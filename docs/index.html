  background: rgba(12, 163, 12, .035); overflow: hidden;
}
.impact-card.has-errors { border-color: rgba(208, 59, 59, .35); background: rgba(208, 59, 59, .035); }
.impact-status { display: flex; gap: 8px; align-items: center; padding: 11px 12px; border-bottom: 1px solid var(--hairline); font-size: 12px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.has-errors .status-dot { background: var(--critical); }
.impact-card dl { padding: 5px 12px; }
.impact-card dl > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 11.5px; }
.impact-card dt { color: var(--ink-3); }
.impact-card dd { color: var(--ink-2); text-align: right; }
.change-summary { padding: 10px 12px; color: #9fcaff; font-size: 11.5px; background: rgba(57, 135, 229, .07); }
.validation-list { padding: 9px 12px 9px 28px; color: #ffadad; font-size: 11px; }

.gate-editor, .version-list { padding: 12px 20px 20px; display: grid; gap: 9px; }
.gate-rule {
  display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center;
  padding: 13px 14px; border: 1px solid var(--hairline); border-radius: 9px; background: var(--surface-2);
}
.gate-rule > div { display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 9px; }
.gate-rule p { grid-column: 2; color: var(--ink-3); font-size: 11.5px; margin-top: 2px; }
.gate-index { color: #81b9fb; font-size: 10px; font-weight: 750; }
.gate-controls { display: flex; align-items: center; gap: 12px; }
.gate-controls > label:first-child { display: grid; gap: 3px; }
.gate-controls > label:first-child span { color: var(--ink-3); font-size: 9.5px; }
.gate-controls select { min-width: 106px; font-size: 11px; padding: 6px 8px; background: var(--surface); }
.version-item { position: relative; padding: 14px; border-radius: 9px; border: 1px solid var(--hairline); background: var(--surface-2); }
.version-item.active { border-color: rgba(12, 163, 12, .3); }
.version-line { display: flex; align-items: center; gap: 8px; }
.version-line time { margin-left: auto; color: var(--ink-3); font-size: 10px; }
.version-item p { color: var(--ink-2); font-size: 12px; margin: 6px 0; }
.version-item code { color: var(--ink-3); font-size: 10px; }
.version-item button { float: right; margin-top: -5px; font-size: 11px; }

.standard-savebar {
  position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; min-height: 66px;
  display: flex; align-items: center; justify-content: flex-end; gap: 14px;
  padding: 10px 28px; border-top: 1px solid var(--hairline);
  background: rgba(20, 20, 19, .94); backdrop-filter: blur(14px);
  box-shadow: 0 -12px 30px rgba(0, 0, 0, .22);
}
.standard-savebar > div { display: flex; align-items: center; gap: 12px; }
.standard-savebar span { color: var(--ink-3); font-size: 11.5px; }
.standard-savebar input { width: min(360px, 36vw); background: var(--surface-2); }
.standard-savebar button { min-height: 42px; min-width: 126px; }

@media (max-width: 1180px) {
  .standards-layout { grid-template-columns: 190px minmax(500px, 1fr); }
  .impact-panel { position: static; grid-column: 2; }
  .standard-identity { grid-template-columns: 1fr 1fr; }
  .standard-identity .identity-stat { display: none; }
}

@media (max-width: 780px) {
  #topbar { padding: 0 12px; }
  .topbar-main { gap: 10px; flex: 1; }
  .brand-sub { display: none; }
  .main-nav { margin-left: auto; }
  .main-nav a { min-height: 57px; padding: 0 7px; font-size: 12px; }
  #topbar-right .standard-live { display: none; }
  .standards-page { padding: 18px 12px 104px; }
  .standards-hero { align-items: flex-start; flex-direction: column; }
  .standard-actions { justify-content: flex-start; }
  .standard-actions button { min-height: 44px; }
  .standard-identity { grid-template-columns: 1fr; }
  .standard-identity > div { border-right: 0; border-bottom: 1px solid var(--hairline); }
  .standard-identity > div:last-child { border-bottom: 0; }
  .standards-layout { display: block; }
  .standard-nav {
    position: sticky; top: 0; z-index: 4; display: flex; overflow-x: auto;
    margin-bottom: 10px; scrollbar-width: none;
  }
  .standard-nav::-webkit-scrollbar { display: none; }
  .standard-nav a { flex: 0 0 auto; grid-template-columns: auto auto; min-height: 44px; }
  .standard-editor { margin-bottom: 10px; }
  .standard-field { grid-template-columns: 1fr; gap: 10px; }
  .impact-panel { margin-bottom: 10px; }
  .gate-rule { grid-template-columns: 1fr; }
  .gate-controls { justify-content: space-between; }
  .standard-savebar { padding: 9px 12px; }
  .standard-savebar > div { min-width: 0; flex: 1; }
  .standard-savebar span { display: none; }
  .standard-savebar input { width: 100%; min-width: 0; }
  .standard-savebar button { min-height: 46px; min-width: 116px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
/* ---------- 剧本审阅页(第一道确认) ---------- */
.script-review {
  max-width: 760px; margin: 8px auto 40px; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: 14px;
  padding: 28px 34px;
}
.script-review h1 { font-size: 22px; margin-bottom: 6px; }
.script-review .logline { color: var(--ink-2); margin-bottom: 12px; }
.script-review .cast { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.script-review .scene { margin-top: 18px; border-top: 1px solid var(--grid); padding-top: 14px; }
.script-review .scene h4 { font-size: 14px; margin-bottom: 8px; color: var(--accent); }
.script-review .action { color: var(--ink-3); font-size: 13px; margin-bottom: 8px; }
.script-review .line { padding: 4px 0; font-size: 15px; }
.script-review .line b { color: var(--ink-2); margin-right: 10px; }

/* ---------- 生产直播页 / 停止生成 ---------- */
.produce-live {
  display: grid; gap: 16px; align-items: start;
  grid-template-columns: 320px minmax(0, 1fr);
  padding: 14px 18px 40px;
}
@media (max-width: 900px) { .produce-live { grid-template-columns: 1fr; } }
.stage-steps { list-style: none; margin: 10px 0 12px; display: flex; flex-direction: column; gap: 7px; }
.stage-steps li { font-size: 13.5px; color: var(--ink-3); }
.stage-steps li.done { color: var(--good); }
.stage-steps li.run { color: var(--accent); font-weight: 600; }
.stop-btn {
  background: rgba(236, 131, 90, .12); color: var(--serious);
  border: 1px solid rgba(236, 131, 90, .5); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; font-size: 12.5px; flex: none;
}
.stop-btn:hover { background: rgba(236, 131, 90, .22); }
.stop-btn.big { padding: 8px 16px; font-size: 13.5px; }
.progress-card .stop-btn { margin-right: 10px; }

/* ---------- 持久生产历史 ---------- */
.history-page {
  flex: 1; overflow-y: auto; padding: 26px 28px 56px;
  background:
    radial-gradient(circle at 88% 0, rgba(57, 135, 229, .13), transparent 28%),
    radial-gradient(circle at 5% 20%, rgba(12, 163, 12, .05), transparent 24%),
    var(--page);
}
.history-page > * { max-width: 1540px; margin-left: auto; margin-right: auto; }
.history-live { color: #9fcaff; }
.history-hero {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 380px);
  gap: 22px; align-items: end; margin-bottom: 18px;
}
.history-hero h1, .history-detail-title h1 {
  font-size: clamp(27px, 3vw, 40px); line-height: 1.12; letter-spacing: -.025em;
}
.history-hero > div:first-child > p:last-child,
.history-detail-title p { color: var(--ink-2); margin-top: 8px; }
.history-assurance {
  display: grid; grid-template-columns: auto 1fr; gap: 10px;
  align-items: start; padding: 14px 16px; border-radius: 10px;
  border: 1px solid rgba(12, 163, 12, .25); background: rgba(12, 163, 12, .065);
}
.history-assurance b { color: #82d982; }
.history-assurance span { color: var(--ink-2); font-size: 12px; }
.history-kpis {
  display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr));
  border: 1px solid var(--hairline); border-radius: 12px;
  background: rgba(26, 26, 25, .88); margin-bottom: 16px; overflow: hidden;
}
.history-kpis > div { min-height: 86px; padding: 14px 16px; border-right: 1px solid var(--hairline); }
.history-kpis > div:last-child { border-right: 0; }
.history-kpis span { display: block; color: var(--ink-3); font-size: 11px; margin-bottom: 4px; }
.history-kpis strong { font-size: 24px; font-variant-numeric: tabular-nums; }
.history-ledger { padding: 0; overflow: hidden; }
.history-toolbar {
  display: grid; grid-template-columns: minmax(220px, 1fr) minmax(220px, .7fr) auto auto;
  gap: 12px; align-items: end; padding: 15px 17px; border-bottom: 1px solid var(--hairline);
}
.history-toolbar h2 { font-size: 15px; }
.history-toolbar p { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.history-toolbar label { display: grid; gap: 4px; }
.history-toolbar label span { color: var(--ink-3); font-size: 10px; }
.history-toolbar input { width: 100%; }
.history-table-wrap { overflow-x: auto; }
.history-table { min-width: 980px; }
.history-table th { background: rgba(13, 13, 13, .35); }
.history-table td { vertical-align: middle; padding-top: 12px; padding-bottom: 12px; }
.history-table tbody tr { transition: background .15s ease; }
.history-table tbody tr:hover { background: rgba(57, 135, 229, .055); }
.history-table td small { display: block; color: var(--ink-3); font-size: 10px; margin-top: 3px; }
.history-delete-row, .episode-delete-work {
  white-space: nowrap; padding: 6px 9px; font-size: 11px;
}
.history-delete-row.danger, .episode-delete-work.danger {
  color: #ffadad; border-color: rgba(208, 59, 59, .38);
  background: rgba(208, 59, 59, .08);
}
.episode-delete-work:disabled { cursor: not-allowed; opacity: .45; }
.history-time, .history-project { color: var(--ink); font-weight: 650; }
.history-time { font-variant-numeric: tabular-nums; }
.history-error-mini {
  max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: #ffadad !important;
}
.action-tag {
  display: inline-flex; padding: 3px 8px; border-radius: 999px;
  color: #bcd9fb; background: rgba(57, 135, 229, .1);
  border: 1px solid rgba(57, 135, 229, .22); font-size: 11px;
}
.run-status {
  display: inline-flex; align-items: center; white-space: nowrap; padding: 3px 8px;
  border-radius: 999px; font-size: 10.5px; font-weight: 700;
  border: 1px solid var(--hairline); color: var(--ink-2); background: var(--surface-2);
}
.run-status.completed { color: #8be58b; border-color: rgba(12, 163, 12, .3); background: rgba(12, 163, 12, .1); }
.run-status.paused { color: #9fcaff; border-color: rgba(57, 135, 229, .32); background: rgba(57, 135, 229, .11); }
.run-status.failed { color: #ffadad; border-color: rgba(208, 59, 59, .38); background: rgba(208, 59, 59, .1); }
.run-status.interrupted, .run-status.stopped { color: #ffc89b; border-color: rgba(236, 131, 90, .38); background: rgba(236, 131, 90, .1); }
.run-status.running, .run-status.cancelling { color: #ffe09a; border-color: rgba(250, 178, 25, .35); background: rgba(250, 178, 25, .1); }
.history-empty { min-height: 190px; display: grid; place-content: center; gap: 4px; text-align: center; }
.history-empty span { color: var(--ink-3); font-size: 12px; }

.history-detail-page { padding-top: 20px; }
.history-detail-head { margin-bottom: 16px; }
.back-link { display: inline-flex; margin-bottom: 18px; color: var(--ink-3); }
.history-detail-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; }
.history-detail-actions { display: flex; gap: 8px; margin-top: 16px; }
.history-delete-overlay { z-index: 75; }
.history-delete-dialog {
  width: min(590px, 100%); padding: 22px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--hairline);
  box-shadow: 0 28px 80px rgba(0, 0, 0, .55);
}
.history-delete-dialog h2 { margin: 5px 0 10px; }
.history-delete-warning { color: var(--ink-2); line-height: 1.65; }
.history-delete-options {
  display: grid; gap: 9px; margin: 18px 0; padding: 0; border: 0;
}
.history-delete-options label {
  display: flex; gap: 11px; align-items: flex-start; padding: 12px;
  border: 1px solid var(--hairline); border-radius: 10px; cursor: pointer;
  background: var(--surface-2);
}
.history-delete-options label:has(input:checked) { border-color: var(--accent); }
.history-delete-options input { margin-top: 3px; }
.history-delete-options span { display: grid; gap: 3px; }
.history-delete-options small { color: var(--ink-3); line-height: 1.5; }
.history-delete-actions { display: flex; justify-content: flex-end; gap: 8px; }
.button-link.primary { color: #fff; background: var(--accent); border-color: transparent; }
.history-error {
  max-width: 1540px; margin-bottom: 16px; padding: 13px 16px; border-radius: 10px;
  border: 1px solid rgba(208, 59, 59, .38); background: rgba(208, 59, 59, .075);
}
.history-error b { color: #ffadad; }
.history-error p { color: var(--ink-2); margin-top: 4px; white-space: pre-wrap; }
.history-detail-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, .6fr); gap: 16px; }
.history-stage-panel, .history-meta-panel { align-self: start; }
.section-title { padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
.section-title h2 { font-size: 15px; }
.section-title p { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
.run-timeline { list-style: none; margin-top: 4px; }
.run-timeline li {
  position: relative; display: grid; grid-template-columns: 38px 1fr; gap: 10px;
  padding: 13px 0; border-bottom: 1px solid var(--grid);
}
.run-timeline li:last-child { border-bottom: 0; }
.timeline-index {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  color: #9fcaff; background: var(--accent-soft); border: 1px solid rgba(57, 135, 229, .3);
  font-size: 10px; font-weight: 750; font-variant-numeric: tabular-nums;
}
.timeline-title { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.timeline-title b { font-size: 13px; }
.run-timeline p { color: var(--ink-3); font-size: 11px; margin-top: 3px; }
.history-meta-panel dl { margin-top: 6px; }
.history-meta-panel dl > div { display: flex; justify-content: space-between; gap: 15px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
.history-meta-panel dt { color: var(--ink-3); font-size: 11px; }
.history-meta-panel dd { text-align: right; color: var(--ink-2); font-size: 12px; }
.provider-value { font-size: 13px !important; overflow-wrap: anywhere; }

@media (max-width: 1000px) {
  .history-hero { grid-template-columns: 1fr; align-items: start; }
  .history-kpis { grid-template-columns: repeat(3, 1fr); }
  .history-kpis > div { border-bottom: 1px solid var(--hairline); }
  .history-toolbar { grid-template-columns: 1fr 1fr 1fr; }
  .history-toolbar > div:first-child { grid-column: 1 / -1; }
  .history-detail-grid { grid-template-columns: 1fr; }
}
@media (max-width: 680px) {
  .history-page { padding: 18px 12px 42px; }
  .history-kpis { grid-template-columns: 1fr 1fr; }
  .history-kpis > div { min-height: 76px; }
  .history-kpis strong { font-size: 20px; }
  .history-toolbar { grid-template-columns: 1fr; }
  .history-toolbar > div:first-child { grid-column: auto; }
  .history-detail-title { align-items: flex-start; flex-direction: column; }
  .history-detail-actions { flex-wrap: wrap; }
  .history-live { display: none; }
}
/* ---------- 实时工作状态条 ---------- */
.live-strip {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 18px; font-size: 13px; flex: none;
  background: rgba(250, 178, 25, .08);
  border-bottom: 1px solid rgba(250, 178, 25, .35);
}
.live-strip b { color: #ffd77a; }
.live-dot {
  width: 9px; height: 9px; border-radius: 50%; background: var(--warning);
  animation: pulse 1.2s infinite; flex: none;
}
.live-dot.stopping { background: var(--serious); }
.live-last { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 48vw; }

/* ---------- 剧本体例排版(审阅页/直播页/弹层共用) ---------- */
.script-review, .script-panel { line-height: 1.9; }
.script-review { max-width: 680px; }
.script-review h1 { font-size: 21px; text-align: center; margin-bottom: 4px; }
.script-review .logline {
  text-align: center; color: var(--ink-2); font-size: 13.5px;
  margin-bottom: 14px;
}
.script-review .cast { justify-content: center; }
.scene-head {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.scene-no {
  flex: none; font-size: 12px; font-weight: 700; letter-spacing: .08em;
  color: #cfe4ff; background: var(--accent-soft);
  border: 1px solid rgba(57, 135, 229, .35);
  padding: 2px 12px; border-radius: 999px;
}
.scene-loc { font-size: 15px; font-weight: 650; }
.script-review .scene, .script-panel .scene {
  margin-top: 22px; border-top: 1px dashed var(--grid); padding-top: 16px;
}
.script-review .action, .script-panel .action {
  color: var(--ink-3); font-size: 13px; margin: 6px 0 12px;
  padding-left: 2px; letter-spacing: .01em;
}
.line-block {
  display: grid; grid-template-columns: 84px minmax(0, 1fr);
  gap: 12px; align-items: start; padding: 7px 0;
}
.line-block .speaker {
  color: var(--accent); font-weight: 650; font-size: 14px;
  text-align: right; padding-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.line-block .speech {
  font-size: 15px; color: var(--ink);
  border-left: 2px solid var(--grid); padding-left: 12px;
}
.performance-cue {
  display: block; width: fit-content; margin-top: 4px;
  padding: 2px 7px; border-radius: 999px;
  color: #c7d7ea; background: rgba(57, 135, 229, .12);
  border: 1px solid rgba(57, 135, 229, .24);
  font-size: 10.5px; line-height: 1.45;
}
.line-block:hover .speech { border-left-color: var(--accent); }
@media (max-width: 640px) {
  .line-block { grid-template-columns: 1fr; gap: 2px; }
  .line-block .speaker { text-align: left; }
  .line-block .speech { border-left: none; padding-left: 0; }
}
.story-bible {
  margin: 14px 0 16px; padding: 12px;
  border: 1px solid rgba(57, 135, 229, .3); border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(57, 135, 229, .1), var(--surface-2));
}
.story-bible-title {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 10px;
}
.story-bible-title b { color: #cfe4ff; }
.story-bible-title span { color: var(--ink-3); font-size: 11.5px; }
.story-bible-columns {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
}
.story-bible-columns > div {
  padding: 9px 10px; border: 1px solid var(--hairline);
  border-radius: 8px; background: rgba(0, 0, 0, .1);
}
.story-bible-columns h3 {
  margin: 0 0 5px; color: var(--accent); font-size: 13px;
}
.story-bible-row {
  display: grid; grid-template-columns: 72px minmax(0, 1fr);
  gap: 8px; padding: 3px 0; font-size: 12px; line-height: 1.65;
}
.story-bible-row b { color: var(--ink-2); font-weight: 650; }
.story-bible-row span { color: var(--ink-3); overflow-wrap: anywhere; }
@media (max-width: 720px) {
  .story-bible-title { align-items: flex-start; flex-direction: column; gap: 2px; }
  .story-bible-columns { grid-template-columns: 1fr; }
}

/* ---- 图片生产清单:分类/状态/提示词/单张改词重画 ---- */
.plan-panel { margin-top: 14px; }
.plan-panel h2 { display: flex; align-items: baseline; gap: 8px; }
.produce-live .plan-panel {
  max-height: 460px; overflow-y: auto; padding-right: 4px;
}
.plan-hint { margin: 2px 0 8px; font-size: 12px; }
.plan-cat h3 {
  font-size: 13px; margin: 12px 0 6px; color: var(--ink-2);
  display: flex; align-items: baseline; gap: 8px;
}
.plan-item {
  display: flex; gap: 10px; padding: 8px;
  border: 1px solid var(--hairline); border-radius: var(--radius);
  margin-bottom: 8px; background: var(--surface-2);
}
.plan-item.st-generating {
  border-color: var(--warning);
  box-shadow: 0 0 0 1px rgba(250, 178, 25, .25);
}
.plan-item.st-failed { border-color: var(--critical); }
.plan-thumbs { display: flex; gap: 4px; flex: 0 0 auto; }
.plan-thumbs img {
  width: 46px; height: 46px; object-fit: cover;
  border-radius: 8px; background: #000;
}
.plan-thumb-empty {
  width: 46px; height: 46px; display: flex; align-items: center;
  justify-content: center; border-radius: 8px;
  background: var(--surface-3); font-size: 18px;
}
.plan-main { flex: 1; min-width: 0; }
.plan-row {
  display: flex; align-items: center; gap: 8px;
  justify-content: space-between; flex-wrap: wrap;
}
.plan-row > b { font-size: 13px; min-width: min(180px, 100%); flex: 1; }
.plan-story-context {
  display: grid; gap: 5px; margin-top: 8px; padding: 8px 10px;
  border: 1px solid rgba(123, 180, 239, .28); border-left: 3px solid #7db4ef;
  border-radius: 8px; background: rgba(36, 72, 115, .14);
  color: var(--ink-2); font-size: 11px; line-height: 1.55;
}
.plan-story-context.modern { border-left-color: #70b7ff; }
.plan-story-context.historical { border-left-color: #e5b85c; }
.plan-story-context.unknown { border-left-color: var(--ink-3); }
.plan-story-head, .plan-story-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.plan-story-head b { color: var(--ink); }
.plan-story-era { padding: 2px 7px; border-radius: 999px; background: var(--surface-3); color: #cfe4ff; }
.plan-story-context.historical .plan-story-era { color: #ffe3a0; }
.plan-story-meta { color: var(--ink-3); }
.plan-story-context p, .plan-story-context small { margin: 0; overflow-wrap: anywhere; }
.plan-story-context p b, .plan-story-context small b { color: var(--ink-2); }
.plan-st {
  font-size: 11px; padding: 2px 9px; border-radius: 999px;
  background: var(--surface-3); color: var(--ink-2); white-space: nowrap;
}
.plan-st.st-done { background: rgba(12, 163, 12, .18); color: #58c558; }
.plan-st.st-reused { background: var(--accent-soft); color: #7db4ef; }
.plan-st.st-generating {
  background: rgba(250, 178, 25, .2); color: var(--warning);
  animation: planPulse 1.2s ease-in-out infinite;
}
.plan-st.st-failed { background: rgba(208, 59, 59, .2); color: #e57a7a; }
@keyframes planPulse { 50% { opacity: .5; } }
.plan-err {
  color: #e57a7a; font-size: 12px; margin-top: 4px;
  word-break: break-all;
}
.plan-prompt { margin-top: 4px; }
.plan-prompt summary { cursor: pointer; font-size: 12px; color: var(--ink-3); }
.plan-prompt pre {
  white-space: pre-wrap; word-break: break-all; font-size: 12px;
  line-height: 1.7; background: var(--page); padding: 8px;
  border-radius: 8px; margin: 6px 0 0; font-family: var(--font);
}
.plan-edit { margin-top: 6px; }
.plan-edit-toggle { font-size: 12px; }
.plan-edit-form {
  display: flex; flex-direction: column; gap: 6px; margin-top: 6px;
}
.plan-edit-form textarea, .plan-edit-form input {
  width: 100%; font-size: 12px; line-height: 1.6;
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px; padding: 8px;
}
.plan-note { font-size: 11px; margin-top: 4px; }
.plan-overlay { max-width: 780px; }
.plan-filter-empty {
  margin: 14px 0; padding: 18px 12px; text-align: center;
  border: 1px dashed var(--hairline); border-radius: 10px;
  color: var(--ink-3); background: var(--surface-2);
}

/* ---- 尚未开工图片 · 严格 API 加速 ---- */
.acceleration-panel { width: min(980px, 96vw); max-width: 980px; }
.accel-controls {
  position: sticky; top: 0; z-index: 4; display: grid;
  grid-template-columns: repeat(3, minmax(150px, 1fr)) auto;
  gap: 9px; align-items: end; margin: 12px 0; padding: 11px;
  border: 1px solid rgba(57, 135, 229, .42); border-radius: 12px;
  background: rgba(20, 30, 48, .97);
}
.accel-controls label { display: grid; gap: 4px; font-size: 11px; color: var(--ink-3); }
.accel-controls select {
  min-width: 0; width: 100%; padding: 8px; color: var(--ink);
  background: var(--page); border: 1px solid var(--hairline); border-radius: 8px;
}
.accel-summary {
  padding: 9px 11px; border-radius: 9px; background: var(--surface-2);
  color: var(--ink-2); font-size: 12px;
}
.accel-summary .ok, .accel-gate.ok { color: #67ce89; }
.accel-summary .bad, .accel-gate.bad { color: #ef8f8f; }
.accel-items { display: grid; gap: 10px; margin: 12px 0; }
.accel-item {
  padding: 11px; border: 1px solid var(--hairline); border-radius: 11px;
  background: var(--surface-2);
}
.accel-item.ready { border-color: rgba(74, 190, 117, .42); }
.accel-item.blocked { border-color: rgba(208, 59, 59, .45); }
.accel-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.accel-pick > span { margin-left: auto; color: var(--ink-3); font-size: 11px; }
.accel-gates, .accel-refs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.accel-gate {
  padding: 3px 8px; border-radius: 999px; background: var(--surface-3);
  color: var(--ink-2); font-size: 11px;
}
.accel-ref {
  display: inline-flex; align-items: center; gap: 5px; max-width: 220px;
  padding: 4px 7px; border: 1px solid var(--hairline); border-radius: 8px;
  color: var(--ink-2); font-size: 10px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.accel-ref img { width: 30px; height: 30px; object-fit: cover; border-radius: 5px; }
.accel-issues { margin-top: 8px; color: #ef8f8f; font-size: 12px; }
.accel-item details { margin-top: 8px; color: var(--ink-3); font-size: 11px; }
.accel-item pre {
  max-height: 180px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  padding: 8px; border-radius: 8px; background: var(--page); color: var(--ink-2);
  font: 11px/1.6 var(--font);
}
.accel-actions { display: flex; justify-content: flex-end; }
.plan-batchbar .batch-accelerate {
  background: linear-gradient(135deg, #2a70db, #7757d8);
  color: #fff; border-color: rgba(125, 180, 255, .65);
}
.image-accel-livebar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 14px 16px; border: 1px solid var(--hairline); border-radius: 14px;
  background: var(--surface); box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
}
.image-accel-livebar.ready {
  border-color: rgba(86, 148, 255, .58);
  background: linear-gradient(135deg, rgba(42, 112, 219, .18), rgba(119, 87, 216, .1));
}
.image-accel-livebar > div { display: grid; gap: 4px; }
.image-accel-livebar b { font-size: 16px; }
.image-accel-livebar span { line-height: 1.45; }
.image-accel-livebar small { color: var(--ink-3); line-height: 1.4; }
.image-accel-livebar button { flex: 0 0 auto; }
.canvas-view > .image-accel-livebar { margin: 12px 18px; }

@media (max-width: 760px) {
  .acceleration-panel { width: 100%; }
  .accel-controls { position: static; grid-template-columns: 1fr; }
  .accel-pick > span { width: 100%; margin-left: 26px; }
  .accel-actions .primary { width: 100%; }
  .image-accel-livebar { align-items: stretch; flex-direction: column; }
  .image-accel-livebar button { width: 100%; min-height: 44px; }
  .canvas-view > .image-accel-livebar { margin: 10px 12px; }
}

/* ---- 空间调度图 ---- */
.blocking-overlay { width: min(980px, 100%); max-width: 980px; }
.blocking-summary {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 12px 0 4px; padding: 10px 12px;
  border: 1px solid var(--hairline); border-radius: 10px;
  background: var(--surface-2);
}
.blocking-summary span { margin-left: auto; }
.blocking-scene {
  margin-top: 18px; padding: 14px; border: 1px solid var(--hairline);
  border-radius: 12px; background: var(--page);
}
.blocking-scene-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 10px;
}
.blocking-scene-head h3 { margin: 0 0 2px; font-size: 15px; }
.blocking-legend {
  display: grid; gap: 9px; margin-bottom: 10px; padding: 10px;
  border: 1px solid rgba(57, 135, 229, .28); border-radius: 10px;
  background: rgba(57, 135, 229, .07);
}
.blocking-route-key, .blocking-actor-legend {
  display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  font-size: 11px; color: var(--ink-2);
}
.blocking-route-key > span { display: inline-flex; align-items: center; gap: 6px; }
.route-symbol { display: inline-block; width: 28px; height: 0; border-top: 3px solid #ff5d8f; }
.route-symbol.camera { border-color: #52b8ff; border-top-style: dashed; }
.blocking-actor-legend > span {
  display: inline-flex; align-items: center; gap: 7px; min-width: 0;
  padding: 5px 8px; border-radius: 999px; background: var(--surface);
}
.blocking-actor-legend i, .blocking-route.actor > i {
  width: 10px; height: 10px; flex: none; border-radius: 50%;
  background: var(--actor-color, #94a3b8); box-shadow: 0 0 0 2px rgba(255, 255, 255, .12);
}
.blocking-actor-legend b { overflow-wrap: anywhere; }
.blocking-legend-empty { color: var(--ink-3); font-size: 11px; }
.blocking-3d-stage {
  overflow: hidden; margin-top: 10px;
  border: 1px solid rgba(82, 184, 255, .38); border-radius: 12px;
  background: #080d16; box-shadow: inset 0 0 35px rgba(37, 99, 235, .08);
}
.blocking-3d-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 9px 10px;
  border-bottom: 1px solid rgba(148, 163, 184, .18);
  background: rgba(15, 23, 42, .96);
}
.blocking-3d-shot-tabs, .blocking-3d-views {
  display: flex; align-items: center; gap: 5px; min-width: 0;
}
.blocking-3d-shot-tabs {
  overflow-x: auto; padding-bottom: 1px; scrollbar-width: thin;
}
.blocking-3d-toolbar button {
  min-height: 31px; padding: 5px 9px;
  border: 1px solid #334155; border-radius: 7px;
  background: #111827; color: #94a3b8; font-size: 11px; white-space: nowrap;
}
.blocking-3d-toolbar button:hover, .blocking-3d-toolbar button:focus-visible {
  border-color: #52b8ff; color: #e0f2fe;
}
.blocking-3d-toolbar button.active {
  border-color: #52b8ff; color: #e0f2fe;
  background: rgba(14, 116, 178, .28);
  box-shadow: inset 0 0 0 1px rgba(82, 184, 255, .14);
}
.blocking-3d-canvas {
  display: block; width: 100%; height: 430px; cursor: grab;
  touch-action: none; outline: none;
}
.blocking-3d-canvas:active { cursor: grabbing; }
.blocking-3d-canvas:focus-visible { box-shadow: inset 0 0 0 2px #52b8ff; }
.blocking-3d-hint {
  padding: 7px 10px; border-top: 1px solid rgba(148, 163, 184, .15);
  color: #94a3b8; background: rgba(15, 23, 42, .9);
  font-size: 10px; text-align: center;
}
.blocking-fixed-reference { margin-top: 10px; }
.blocking-fixed-reference > summary {
  width: fit-content; padding: 5px 2px; cursor: pointer;
  color: var(--accent); font-size: 11px;
}
.blocking-fixed-reference[open] > summary { margin-bottom: 5px; }
.blocking-map-scroll { max-width: 100%; overflow-x: auto; border-radius: 10px; -webkit-overflow-scrolling: touch; }
.blocking-map-btn {
  display: block; width: 100%; padding: 0; overflow: hidden; cursor: zoom-in;
  border: 1px solid var(--hairline); border-radius: 10px; background: #111827;
}
.blocking-map-btn img { display: block; width: 100%; height: auto; }
.blocking-map-mobile-hint { display: none; color: var(--ink-3); font-size: 10px; margin-top: 4px; text-align: center; }
.blocking-shot-list { display: grid; gap: 6px; margin-top: 10px; }
.blocking-shot {
  display: grid; grid-template-columns: 66px minmax(0, 1fr);
  align-items: start; gap: 8px; padding: 9px;
  border-radius: 8px; background: var(--surface);
  font-size: 12px; line-height: 1.45;
}
.blocking-shot-head { display: grid; gap: 2px; }
.blocking-shot-head b { color: var(--accent); font-size: 13px; }
.blocking-shot-head span { color: var(--ink-3); font-size: 10px; }
.blocking-routes { display: grid; gap: 6px; min-width: 0; }
.blocking-route {
  display: grid; grid-template-columns: 12px minmax(100px, auto) minmax(0, 1fr);
  align-items: center; gap: 7px; min-width: 0; padding-bottom: 5px;
  border-bottom: 1px solid var(--hairline);
}
.blocking-route:last-child { border-bottom: 0; padding-bottom: 0; }
.blocking-route b { color: var(--ink); font-size: 11px; overflow-wrap: anywhere; }
.blocking-route span { color: var(--ink-2); overflow-wrap: anywhere; }
.blocking-route.camera > i {
  width: 11px; height: 11px; border: 2px dashed #52b8ff;
  background: rgba(82, 184, 255, .15); transform: rotate(45deg);
}
.blocking-route.camera em {
  grid-column: 2 / -1; color: var(--ink-3); font-style: normal; white-space: normal;
}
.blocking-route.empty { display: block; color: var(--ink-3); }
.blocking-empty { padding: 36px; text-align: center; color: var(--ink-3); }

/* ---- 真假产线透明:占位图标注与接线指引 ---- */
.plan-badges { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.plan-st.st-real { background: var(--accent-soft); color: #7db4ef; }
.plan-st.st-model { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.plan-st.st-cost.subscription { background: rgba(57, 135, 229, .18); color: #9ecbff; }
.plan-st.st-cost.batch { background: rgba(12, 163, 12, .16); color: #7fd97f; }
.plan-st.st-cost.standard { background: rgba(250, 178, 25, .13); color: #ffd77a; }
.plan-st.st-cost.expensive {
  background: rgba(208, 59, 59, .2); color: #ffadad;
  border: 1px solid rgba(208, 59, 59, .42);
}
.plan-st.st-mock {
  background: rgba(208, 59, 59, .22); color: #ef8f8f;
  border: 1px solid rgba(208, 59, 59, .5);
}
.plan-item:has(.st-mock) { border-color: rgba(208, 59, 59, .45); }
.plan-fallback {
  color: var(--serious); font-size: 12px; margin-top: 4px;
  line-height: 1.6; word-break: break-all;
}
.mock-warn {
  display: flex; flex-direction: column; gap: 4px;
  border: 1px solid rgba(208, 59, 59, .55);
  background: rgba(208, 59, 59, .12);
  border-radius: var(--radius); padding: 10px 14px; margin: 10px 0;
}
.mock-warn b { color: #ef8f8f; }
.mock-warn span { color: var(--ink-2); font-size: 13px; line-height: 1.7; }
.mock-warn a { color: var(--accent); font-weight: 650; }

/* ---- 图片生产实况看板 ---- */
.produce-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.plan-board {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.pb-head h2 { font-size: 16px; }
.pb-meta { color: var(--ink-2); font-size: 13px; margin: 6px 0 8px; }
.pb-meta b { color: var(--ink); font-size: 15px; }
.pb-track {
  height: 8px; border-radius: 999px; background: var(--surface-3);
  overflow: hidden;
}
.pb-fill {
  height: 100%; border-radius: 999px; background: var(--accent);
  transition: width .6s ease;
}
.pb-cat h3 {
  font-size: 13px; margin: 14px 0 8px; color: var(--ink-2);
  display: flex; align-items: baseline; gap: 8px;
}
.pb-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.plan-card {
  border: 1px solid var(--hairline); border-radius: var(--radius);
  background: var(--surface-2); padding: 8px;
  display: flex; flex-direction: column; gap: 5px; min-width: 0;
}
.plan-selectable {
  cursor: pointer; position: relative;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.plan-selectable:hover {
  border-color: rgba(57, 135, 229, .7); transform: translateY(-1px);
}
.plan-selectable:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.plan-selectable.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(57, 135, 229, .35);
}
.plan-selectable.selected::after {
  content: "✓ 已选择"; position: absolute; top: 6px; right: 6px;
  z-index: 2; padding: 2px 7px; border-radius: 999px;
  color: white; background: var(--accent); font-size: 10.5px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
}
.pb-select-hint {
  color: var(--ink-3); font-size: 11.5px; margin-top: 7px;
}
.plan-card.st-generating {
  border-color: var(--warning);
  box-shadow: 0 0 0 1px rgba(250, 178, 25, .3);
  animation: planPulse 1.6s ease-in-out infinite;
}
.plan-card.st-failed { border-color: var(--critical); }
.pc-media img {
  width: 100%; height: 150px; object-fit: cover;
  border-radius: 8px; background: #000; display: block;
}
.pc-empty {
  width: 100%; height: 150px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); font-size: 28px; color: var(--ink-3);
  border: 1px dashed var(--hairline);
}
.pc-empty.gen { color: var(--warning); border-color: var(--warning); }
.pc-empty.fail { color: var(--critical); border-color: var(--critical); }
.pc-label {
  font-size: 12.5px; font-weight: 650; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pc-state { font-size: 11.5px; line-height: 1.5; }
.pc-model {
  color: #9fcaff; font-size: 10.5px; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pc-timer { color: var(--warning); font-weight: 650; }
.pc-ok { color: var(--good); }
.pc-ok .pc-mock { color: var(--serious); }
.pc-fail { color: #e57a7a; word-break: break-all; }
.pc-wait { color: var(--ink-3); }
.plan-card .plan-prompt summary { font-size: 11.5px; }
.plan-card .plan-prompt pre { font-size: 11.5px; max-height: 150px; overflow: auto; }

/* ---- 图片选择与大图预览 ---- */
.image-preview-panel { width: min(920px, 94vw); }
.image-preview-panel .script-head > div { min-width: 0; }
.image-preview-panel .script-head h3 { margin: 0; }
.plan-preview-gallery {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
  margin-top: 12px;
}
.plan-preview-main {
  display: block; max-width: 100%; width: auto; max-height: 66vh;
  margin: 0 auto; object-fit: contain; border-radius: 10px;
  background: #080a0d; border: 1px solid var(--hairline);
}
.plan-preview-thumbs {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
}
.plan-preview-thumb {
  padding: 3px; border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: 8px;
}
.plan-preview-thumb.active { border-color: var(--accent); }
.plan-preview-thumb img {
  display: block; width: 56px; height: 56px; object-fit: cover; border-radius: 5px;
}
.plan-preview-empty {
  min-height: 260px; margin-top: 12px; border: 1px dashed var(--hairline);
  border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-3); background: var(--surface-2); padding: 30px;
  text-align: center;
}
.plan-preview-meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 12px 0 8px; color: var(--ink-2); font-size: 12px;
}
.plan-preview-meta .preview-download { margin-left: auto; }
.image-preview-panel .plan-prompt pre { max-height: 180px; overflow: auto; }

/* ---- 资产中心 ---- */
.assets-center { padding: 14px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.assets-center .canvas-toolbar { position: static; }
.asset-panel {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.asset-panel h2 { font-size: 15px; margin-bottom: 10px; }
.asset-panel h2 .dim { font-size: 12px; font-weight: 400; }
#asset-project {
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 6px 10px; font-size: 13px;
}
.ref-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ref-form input {
  flex: 1; min-width: 200px; background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 10px;
  font-size: 13px;
}
.char-suite { margin-bottom: 16px; }
.char-suite h3 {
  font-size: 14px; margin: 10px 0 8px;
  display: flex; align-items: baseline; gap: 8px;
}
.ref-card .ref-del {
  font-size: 12px; color: var(--ink-2);
  background: var(--surface-3); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 4px 8px; cursor: pointer;
}
.ref-card .ref-del:hover { color: #ef8f8f; border-color: var(--critical); }
.asset-card .regen-box, .asset-card .io-box { margin-top: 2px; }
.asset-catalog-toolbar {
  display: flex; align-items: end; justify-content: space-between;
  gap: 14px; margin-bottom: 12px;
}
.asset-catalog-toolbar h2 { margin-bottom: 3px; }
.asset-catalog-toolbar label { display: grid; gap: 4px; color: var(--ink-3); font-size: 11px; }
.asset-catalog-toolbar select {
  min-width: 150px; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 9px;
}
.asset-board-summary {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px; margin: 4px 0 14px;
}
.asset-board-filter {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 8px;
  min-width: 0; padding: 9px 10px; text-align: left;
  border: 1px solid var(--hairline); border-radius: 9px;
  background: var(--surface-2); color: var(--ink-2); cursor: pointer;
}
.asset-board-filter b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
.asset-board-filter span { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.asset-board-filter.active {
  border-color: rgba(57, 135, 229, .72); color: var(--ink);
  background: rgba(57, 135, 229, .13); box-shadow: 0 0 0 1px rgba(57, 135, 229, .15);
}
.asset-board { min-width: 0; }
.asset-board-lanes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.asset-lane {
  min-width: 0; padding: 11px; border: 1px solid var(--hairline);
  border-radius: 11px; background: rgba(0, 0, 0, .08);
}
.asset-lane-production { grid-column: 1 / -1; }
.asset-lane-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 10px; margin-bottom: 9px;
}
.asset-lane-head h3 { margin: 0; color: var(--ink); font-size: 13px; }
.asset-lane-head h3 span {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 20px; height: 20px; margin-left: 5px; padding: 0 5px;
  border-radius: 999px; color: #cfe4ff; background: rgba(57, 135, 229, .18); font-size: 10px;
}
.asset-lane-head p { margin: 3px 0 0; color: var(--ink-3); font-size: 11px; }
.asset-lane-count { flex: none; color: #7fd97f; font-size: 10px; white-space: nowrap; }
.asset-lane .asset-catalog-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.asset-board-empty { padding: 24px 0; text-align: center; }
.asset-catalog-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
  gap: 12px;
}
.asset-catalog-card {
  position: relative; min-width: 0; overflow: hidden; border-radius: 12px;
  border: 1px solid var(--hairline); background: var(--surface-2);
  padding-bottom: 10px;
}
.asset-catalog-media { aspect-ratio: 4 / 3; background: #080a0d; overflow: hidden; }
.asset-catalog-media img { width: 100%; height: 100%; object-fit: cover; }
.asset-catalog-head { display: flex; align-items: center; gap: 7px; padding: 10px 10px 5px; }
.asset-catalog-head { flex-wrap: wrap; }
.asset-catalog-head b { flex: 1 1 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.asset-category-chip {
  flex: none; padding: 2px 6px; border-radius: 999px; color: #a9d2ff;
  background: rgba(57, 135, 229, .16); font-size: 10px;
}
.asset-usage-chip {
  min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; padding: 2px 6px; border-radius: 999px;
  color: var(--ink-3); background: var(--surface-3); font-size: 10px;
}
.asset-usage-chip.selected { color: #7fd97f; background: rgba(12, 163, 12, .16); }
.asset-origin-meta { padding: 0 10px; }
.asset-origin-meta > div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.asset-origin-meta dt { color: var(--ink-3); font-size: 10px; }
.asset-origin-meta dd { color: var(--ink-2); font-size: 10px; text-align: right; }
.asset-prompt { margin: 6px 10px; font-size: 11px; }
.asset-prompt summary { color: var(--ink-2); cursor: pointer; }
.asset-prompt p { margin-top: 6px; max-height: 118px; overflow: auto; white-space: pre-wrap; line-height: 1.55; }
.asset-catalog-card > .asset-del { margin-left: 10px; }

/* ---- 剧本确认页:画风与参考面板 ---- */
.style-panel {
  margin: 0 18px; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 14px 16px;
}
.style-panel h2 { font-size: 15px; margin-bottom: 10px; }
.style-panel h2 .dim { font-size: 12px; font-weight: 400; }
.style-row {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;

  .asset-catalog-toolbar { align-items: stretch; flex-direction: column; gap: 9px; }

  .asset-catalog-toolbar select { width: 100%; }
  .asset-board-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}

/* ---- 人物设定展示 + 图片灯箱 ---- */
.design-box { margin: 4px 0 10px; }
.design-box summary {
  cursor: pointer; font-size: 12.5px; color: var(--ink-2);
}
.design-grid {
  display: grid; gap: 6px 14px; margin-top: 8px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 10px 12px;
}
.design-row { font-size: 12.5px; line-height: 1.7; display: flex; gap: 8px; }
.design-row b { flex: 0 0 62px; color: var(--accent); font-weight: 650; }
.design-row span { color: var(--ink-2); }
.background-cast-note {
  margin: 5px 0; padding: 7px 10px; border: 1px dashed var(--hairline);
  border-radius: 8px; color: var(--ink-3); font-size: 12px; line-height: 1.6;
  background: var(--surface-2);
}
.unresolved-cast-note {
  color: #ffd39b; border-color: rgba(226, 154, 61, .5);
  background: rgba(226, 154, 61, .08);
}
.pc-media img.zoomable { cursor: zoom-in; }
.img-lightbox { z-index: 300; }
.lightbox-box {
  position: relative; max-width: 92vw; max-height: 92vh;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.lightbox-box img {
  max-width: 92vw; max-height: 84vh; object-fit: contain;
  border-radius: 12px; background: #000;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
}
.lightbox-box figcaption { color: var(--ink-2); font-size: 13px; }
.lightbox-box .close {
  position: absolute; top: -2px; right: -2px;
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 6px 10px; cursor: pointer;
}

/* ---- 断点续画横幅 + 重画表单动作行 ---- */
.resume-banner {
  margin: 0 18px; padding: 10px 14px;
  border: 1px solid rgba(250, 178, 25, .5);
  background: rgba(250, 178, 25, .1);
  border-radius: var(--radius); color: var(--ink-2); font-size: 13px;
}
.resume-banner b { color: var(--warning); }
.plan-edit-actions { display: flex; gap: 8px; }
.plan-edit-actions .plan-edit-go { flex: 1; }
.regen-form .regen-ref { font-size: 12px; }

/* 暂停不等于锁页：已有生产环节保持可进入、可核对。 */
.paused-production-access {
  display: grid; gap: 10px; padding: 13px 18px;
  border-bottom: 1px solid rgba(250, 178, 25, .42);
  background:
    radial-gradient(circle at 95% 0, rgba(57, 135, 229, .14), transparent 34%),
    rgba(250, 178, 25, .08);
}
.paused-production-summary {
  display: flex; align-items: center; justify-content: space-between;
  gap: 14px; color: var(--ink-2);
}
.paused-production-summary b { display: block; color: var(--ink); }
.paused-production-summary span { display: block; margin-top: 3px; font-size: 12px; }
.paused-production-summary strong {
  flex: 0 0 auto; color: var(--warning); font-size: 12px; white-space: nowrap;
}

/* ---- 出图产线切换 ---- */
.image-line-row select {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 10px; font-size: 13px;
}

.image-line-row .il-label { flex: 0 0 auto; }

/* ---- 图片质检徽标 ---- */
.plan-st.st-qc-ok { background: rgba(12, 163, 12, .14); color: #58c558; }
.plan-st.st-manual { background: rgba(250, 178, 25, .18); color: #ffd77a; }
.plan-st.st-auto { background: rgba(141, 83, 255, .18); color: #c6adff; }
.plan-st.st-refs { background: rgba(57, 135, 229, .18); color: #9ecbff; }
.plan-trace {
  margin: 5px 0; padding: 6px 8px;
  border: 1px solid rgba(57, 135, 229, .22); border-radius: 7px;
  background: rgba(57, 135, 229, .06); color: var(--ink-2); font-size: 11px;
}
.plan-trace summary { cursor: pointer; color: #a9d0ff; }
.plan-trace div { margin-top: 5px; line-height: 1.45; overflow-wrap: anywhere; }
.batch-job-progress {
  position: sticky; top: 38px; z-index: 3; margin: 8px 0 12px; padding: 11px 12px;
  border: 1px solid rgba(57, 135, 229, .42); border-radius: 10px;

.batch-job-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
.batch-job-head b { color: #cfe4ff; }
.batch-job-head span { color: var(--ink-2); text-align: right; }

  height: 7px; margin: 8px 0; overflow: hidden;

}

  display: flex; flex-wrap: wrap; gap: 5px 12px;

}

.mock-warn .mw-redo { margin-left: 12px; font-size: 12.5px; }

/* ---- 单张/批量质检按钮 ---- */
.plan-qc-row { margin: 4px 0; }
.plan-qc-one {
  font-size: 12px; background: var(--surface-3); color: var(--ink-2);
  border: 1px solid var(--hairline); border-radius: 8px;

}

  font-size: 12px; background: rgba(250, 178, 25, .12); color: #ffd77a;

}
.plan-qc-accept:hover { color: var(--ink); border-color: var(--warning); }

  margin-top: 8px; padding: 7px 9px; border-radius: 7px;

}
.qc-manual-pass span { display: block; margin-top: 3px; color: var(--ink-3); }
.plan-batchbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;

}

}

  color: #ffd77a; border-color: rgba(250, 178, 25, .45);
}

  color: #ffd77a; border-color: rgba(250, 178, 25, .45);
}
.plan-batchbar .batch-filter-failed:hover,
.plan-batchbar .batch-show-all:hover {
  background: rgba(250, 178, 25, .14);
}
.plan-batchbar .batch-manual-pass:not(:disabled) {
  background: rgba(250, 178, 25, .16); color: #ffd77a;
  border-color: rgba(250, 178, 25, .5);
}
.plan-batchbar button:disabled { opacity: .5; cursor: default; }

/* ---- 勾选批量重画 ---- */
.plan-pick { font-size: 11px; color: var(--ink-3); cursor: pointer; margin-right: 6px; white-space: nowrap; }
.plan-pick input { vertical-align: middle; }

}

}
.image-line-row #qc-line {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 10px; font-size: 13px;
}

.video-ref-mode {

@media (max-width:700px) {

/* 生产画布:人物/场景/镜头关系线 */
.relation-canvas { margin: 10px 0 16px; }
.relation-canvas h3 { margin: 0 0 8px; font-size: 13.5px; }
.relation-canvas h3 .dim { font-weight: 400; font-size: 11px; }
.rel-scroll { overflow-x: auto; border: 1px solid var(--hairline);
  border-radius: 10px; background: rgba(255, 255, 255, .02); }
.rel-svg { display: block; margin: 0 auto; }
.rel-col { fill: var(--ink-3); font-size: 11px; text-anchor: middle;
  letter-spacing: 2px; }
.rel-node { cursor: pointer; }
.rel-node rect { fill: rgba(255, 255, 255, .05);
  stroke: rgba(255, 255, 255, .22); }
.rel-node-character rect { stroke: rgba(57, 135, 229, .65);
  fill: rgba(57, 135, 229, .12); }
.rel-node-scene rect { stroke: rgba(178, 148, 250, .6);
  fill: rgba(178, 148, 250, .1); }
.rel-node-shot rect { stroke: rgba(255, 255, 255, .25); }
.rel-node.st-done rect, .rel-node.st-reused rect {
  stroke: rgba(63, 185, 80, .8); fill: rgba(63, 185, 80, .12); }
.rel-node.st-generating rect { stroke: rgba(250, 178, 25, .85);
  fill: rgba(250, 178, 25, .12); }
.rel-node.st-failed rect { stroke: rgba(248, 81, 73, .85);
  fill: rgba(248, 81, 73, .12); }
.rel-node text { text-anchor: middle; pointer-events: none; }
.rel-node .rel-label { fill: var(--ink); font-size: 11.5px; }
.rel-node .rel-sub { fill: var(--ink-3); font-size: 9.5px; }
.rel-node.hl rect { stroke-width: 2.4; filter: drop-shadow(0 0 5px rgba(57, 135, 229, .8)); }
.rel-edge path { stroke: rgba(255, 255, 255, .18); stroke-width: 1.2; }
.rel-edge.rel-co_scene path { stroke: rgba(57, 135, 229, .55);
  stroke-width: 1.8; stroke-dasharray: none; }
.rel-edge.rel-appears path { stroke: rgba(57, 135, 229, .3); }
.rel-edge.rel-contains path { stroke: rgba(178, 148, 250, .3); }
.rel-edge.rel-features path { display: none; }
.rel-edge.rel-sequence path { stroke: rgba(255, 255, 255, .1); }
.rel-edge text { fill: #9ec3f0; font-size: 9.5px; }

/* 剧本前置：AI 世界观 / 环境 / 风格制作圣经 */
.prepro-steps {
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px; margin:14px 18px 10px;
}
.prepro-steps > div {
  display:flex; gap:10px; align-items:center; min-width:0; padding:10px 12px;
  border:1px solid var(--hairline); border-radius:12px;
  background:var(--surface-2); color:var(--ink-3);
}
.prepro-steps b {
  display:grid; place-items:center; flex:0 0 32px; height:32px;
  border-radius:50%; background:var(--surface-3); font-size:11px;
}
.prepro-steps span,.prepro-steps small { display:block; min-width:0 }
.prepro-steps span { color:var(--ink); font-size:12px; font-weight:650 }
.prepro-steps small { margin-top:2px; color:var(--ink-3); font-size:9.5px }
.prepro-steps .done { border-color:rgba(63,185,80,.35) }
.prepro-steps .done b { background:rgba(63,185,80,.18); color:#8fe1aa }
.prepro-steps .active {
  border-color:rgba(97,145,255,.65);
  background:linear-gradient(135deg,rgba(55,111,230,.18),rgba(139,83,255,.1));
}
.prepro-steps .active b { background:var(--accent); color:#fff }
.analysis-studio {
  margin:14px 18px 18px; padding:18px;
  border:1px solid rgba(97,145,255,.42); border-radius:16px;
  background:radial-gradient(circle at 90% 0,rgba(130,81,255,.13),transparent 34%),
    linear-gradient(145deg,rgba(42,85,165,.1),var(--surface-2) 48%);
  box-shadow:0 18px 48px rgba(0,0,0,.16);
}
.analysis-studio.missing { border-color:rgba(244,181,70,.45) }
.analysis-head {
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:20px; margin-bottom:14px;
}
.analysis-head h2 { margin:3px 0 5px; font-size:20px }
.analysis-head p {
  max-width:760px; margin:0; color:var(--ink-2); font-size:12px; line-height:1.6;
}
.analysis-state {
  flex:0 0 auto; padding:6px 10px; border-radius:999px;
  border:1px solid rgba(97,145,255,.42); background:rgba(97,145,255,.1);
  color:#cfe4ff; font-size:11px;
}
.analysis-summary {
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px; margin-bottom:14px;
}
.analysis-summary > div {
  min-width:0; padding:10px 11px; border-radius:10px;
  border:1px solid var(--hairline); background:rgba(0,0,0,.12);
}
.analysis-summary span,.analysis-summary b { display:block }
.analysis-summary span {
  margin-bottom:4px; color:var(--ink-3); font-size:9px;
  text-transform:uppercase; letter-spacing:.08em;
}
.analysis-summary b {
  overflow:hidden; color:var(--ink); font-size:11.5px; line-height:1.4;
  text-overflow:ellipsis; white-space:nowrap;
}
.analysis-grid {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px;
}
.analysis-grid label {
  display:grid; gap:5px; min-width:0; color:var(--ink-2);
  font-size:10.5px; font-weight:650;
}
.analysis-grid label.wide { grid-column:1/-1 }
.analysis-grid textarea {
  width:100%; min-height:70px; resize:vertical; box-sizing:border-box;
  padding:9px 10px; border:1px solid var(--hairline); border-radius:9px;
  background:rgba(0,0,0,.18); color:var(--ink);
  font:inherit; font-size:11.5px; line-height:1.5;
}
.analysis-grid textarea:focus {
  outline:none; border-color:var(--accent);
  box-shadow:0 0 0 2px rgba(97,145,255,.12);
}
.prompt-master,.analysis-scenes {
  margin-top:12px; border-top:1px solid var(--hairline); padding-top:10px;
}
.prompt-master > summary,.analysis-scenes > summary {
  margin-bottom:10px; color:#cfe4ff; cursor:pointer;
  font-size:12px; font-weight:650;
}
.analysis-scene-grid {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px;
}
.analysis-scene {
  padding:8px 10px; border:1px solid var(--hairline);
  border-radius:9px; background:rgba(0,0,0,.12);
}
.analysis-scene summary { color:var(--ink); cursor:pointer; font-size:11px }
.analysis-scene div {
  margin-top:6px; color:var(--ink-2); font-size:10.5px; line-height:1.5;
}
.analysis-actions {
  display:grid; grid-template-columns:minmax(220px,1fr) auto auto auto;
  gap:8px; margin-top:14px;
}
.analysis-actions input {
  min-width:0; padding:8px 10px; border:1px solid var(--hairline);
  border-radius:9px; background:rgba(0,0,0,.18); color:var(--ink);
}
.analysis-actions button {
  min-height:38px; padding:7px 12px; white-space:nowrap;
  border:1px solid var(--hairline); border-radius:9px;
  background:var(--surface-3); color:var(--ink); cursor:pointer;
}
.analysis-actions #analysis-save {
  border-color:rgba(97,145,255,.55);
  background:rgba(55,111,230,.18); color:#dceaff;
}

/* 火火漫剧研究室 */
.panel-heading-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.panel-heading-row h2 { margin:2px 0 0; }
.muted { color:var(--ink-3); line-height:1.55; }
.independent-style-field small { color:var(--ink-3); font-size:10px; line-height:1.35; }
.firefire-summary-panel { border-color:rgba(170,125,255,.35); background:linear-gradient(135deg,rgba(76,45,130,.16),rgba(24,31,60,.2)); }
.firefire-stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin:12px 0; }
.firefire-stats span { display:grid; gap:3px; padding:9px 10px; border:1px solid var(--hairline); border-radius:9px; color:var(--ink-3); font-size:10px; }

.firefire-style-chips { margin-top:8px; }

.checkline { display:flex; gap:6px; align-items:flex-start; color:var(--ink-3); font-size:10px; line-height:1.4; }
.firefire-records { display:grid; gap:7px; margin-top:14px; }
.firefire-record { display:grid; gap:5px; padding:10px 12px; border:1px solid var(--hairline); border-radius:9px; background:rgba(0,0,0,.1); }
.firefire-record > div { display:flex; align-items:center; gap:8px; }
.firefire-record small { color:var(--ink-3); overflow-wrap:anywhere; line-height:1.45; }
.firefire-record .mini-btn { justify-self:start; }
@media (max-width:760px) {
  .firefire-stats { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .firefire-grid { grid-template-columns:1fr; }
  .firefire-panel { margin:12px; padding:14px; }
}
@media (max-width:760px) {
  .paused-production-access { padding: 10px; }
  .paused-production-summary { align-items: flex-start; flex-direction: column; gap: 5px; }
  .paused-production-summary strong { white-space: normal; }
  .prepro-steps {
    grid-template-columns:repeat(2,minmax(0,1fr)); margin:10px; gap:6px;
  }
  .prepro-steps > div { padding:8px; gap:7px }
  .prepro-steps b { flex-basis:27px; height:27px }
  .analysis-studio { margin:10px; padding:13px; border-radius:13px }
  .analysis-head { display:grid; gap:9px }
  .analysis-head h2 { font-size:17px }
  .analysis-state { justify-self:start }
  .analysis-summary { grid-template-columns:repeat(2,minmax(0,1fr)) }
  .analysis-grid,.analysis-scene-grid { grid-template-columns:1fr }
  .analysis-grid label.wide { grid-column:auto }
  .analysis-grid textarea { min-height:82px; font-size:12px }
  .analysis-actions { grid-template-columns:1fr 1fr }
  .analysis-actions input { grid-column:1/-1; min-height:40px }
  .analysis-actions button { min-height:44px; white-space:normal }
}

  /* 自带剧本解析(与平台 script_import.py 同构) */
  function parseTextScript(text, title, number) {

    const openScene = (loc) => {
      current = { scene_no: scenes.length + 1,
        location: loc || `场景${scenes.length + 1}`,
        characters: [], action: "", lines: [] };
      scenes.push(current);
    };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const sm = sceneRe.exec(line);
      if (sm) { openScene((sm[3] || "").trim()); continue; }
      if (!current) openScene("主场景");
      const lm = lineRe.exec(line);

    valid.forEach((s, i) => {
      s.scene_no = i + 1;

      s.lines.forEach((l) => { counts[l.character] = (counts[l.character] || 0) + 1; });
    });
    const ordered = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const firstAction = (valid.find((s) => s.action) || {}).action || "";
    return {
      project_title: title, episode_number: number,
      episode_title: valid[0].location,
      logline: firstAction || valid[0].lines[0].dialogue,
      characters: ordered.map((name, i) => ({

  }

  /* ---- 作品名自由识别(与平台 smart_input.py 同构) ---- */
  const CN_DIGITS = { "零": 0, "一": 1, "二": 2, "两": 2, "三": 3, "四": 4,
    "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };

      const u = units === "" ? 0 : CN_DIGITS[units];
      if (t === undefined || u === undefined) return null;
      return t * 10 + u;
    }
    let v = 0;
    for (const ch of text) {

      v = v * 10 + CN_DIGITS[ch];

    /[eE][pP]\.?\s*(\d+)/, /(\d+)\s*[集期话]/];
  const CMD_PREFIXES = ["开始制作", "开始生产", "继续制作", "重新制作",
    "帮我制作", "帮我做", "给我做", "我要做", "我想做", "制作", "生成",
    "生产", "开拍", "再来一集", "来一集", "一集", "做", "把", "将", "拍"]
    .sort((a, b) => b.length - a.length);
  const CMD_SUFFIXES = ["的下一集", "下一集", "的新一集", "新一集",
    "再来一集", "来一集", "一集", "吧", "呗", "啊", "呀", "哦", "喔", "了"]
    .sort((a, b) => b.length - a.length);
  const TRIM_RE = /^[\s《》「」『』“”"'‘’,,。.!!??::;;、~~]+|[\s《》「」『』“”"'‘’,,。.!!??::;;、~~]+$/g;

    let out = trimNoise(text);
    let changed = true;
    while (changed && out) {
      changed = false;
      for (const p of CMD_PREFIXES)
        if (out.startsWith(p) && out.length > p.length) {
          out = trimNoise(out.slice(p.length)); changed = true; break;
        }
      for (const s of CMD_SUFFIXES)
        if (out.endsWith(s) && out.length > s.length) {
          out = trimNoise(out.slice(0, -s.length)); changed = true; break;
        }
    }

    let number = null, working = text;
    for (const re of EP_PATTERNS) {
      const m = re.exec(working);
      if (m) {
        const raw = m[1];
        const n = /^\d+$/.test(raw) ? parseInt(raw, 10) : cnToInt(raw);
        if (n) {
          number = n;
          working = working.slice(0, m.index) +
            working.slice(m.index + m[0].length);
          break;
        }
      }

    const t = /《(.+?)》/.exec(working);
    if (t) return [t[1].trim(), number];
    const hits = knownTitles.filter(
      (k) => k && k.length >= 2 && working.includes(k));
    if (hits.length)
      return [hits.sort((a, b) => b.length - a.length)[0], number];

    return [title || null, number];

  function resolveTarget(sentence, title, number) {

  function extractJsonLoose(text) {
    const start = text.indexOf("{");
    if (start === -1) return null;
    let depth = 0, inStr = false, escNext = false;
    for (let i = start; i < text.length; i += 1) {
      const ch = text[i];
      if (inStr) {
        if (escNext) escNext = false;
        else if (ch === "\\") escNext = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') inStr = true;
      else if (ch === "{") depth += 1;
      else if (ch === "}") {
        depth -= 1;
        if (depth === 0) {
          try { return JSON.parse(text.slice(start, i + 1)); }
          catch (e) { return null; }
        }
      }
    }
    return null;
  }

  function validateScriptLoose(s, project, number) {

      sc.characters = [...new Set(sc.lines.map((l) => l.character))].sort();
    });

  function sizeOf(aspect) {

  async function realImage(conf, prompt, aspect) {
    const r = await realFetch(
      endpointOf(conf, "https://api.openai.com") + "/v1/images/generations", {

          "content-type": "application/json",

    if (!r.ok)
      throw new Error(`HTTP ${r.status} ${(await r.text()).slice(0, 200)}`);
    const data = await r.json();
    const item = (data.data || [])[0] || {};
    if (item.b64_json) return "data:image/png;base64," + item.b64_json;
    if (item.url) return item.url;
    throw new Error("应答缺少 b64_json/url");
  }

  function buildStoryboard(script, seed) {

        duration: 2.5, characters: scene.characters, dialogue: null,
        prompt: `漫剧风格,${scene.location},${scene.action},镜头:${pick(CAMERAS, seed, no)}`,
      });

          shot_no: no, scene_no: scene.scene_no, kind: "dialogue",

  /* ---- 一集的完整生产 ---- */
  function produceEpisode(project, number, premise, providedScript) {
    const aspect = project.aspect || "9:16";
    const [w, h] = DIMS[aspect] || DIMS["9:16"];
    const seed = hash(`${project.title}#${number}#${premise}`);
    const genre = detectGenre(
      project.title, premise, project.style || "", project.kind);
    const script = providedScript
      || (genre === "idol"
        ? idolScript(project.title, number, premise, seed,
            project.title, project.style)
        : dramaScript(project.title, number, premise, seed, genre));
    const storyboard = buildStoryboard(script, seed);
    const shots = storyboard.shots;

    const locations = {};
    script.scenes.forEach((sc) => { locations[sc.scene_no] = sc.location; });
    const artifacts = { images: {}, first: {}, last: {}, videos: {},
      voices: {}, cover: null, final: null, titles: [], clips: [],
      cast_art: [], scene_art: [] };
    script.characters.forEach((c, i) => {
      artifacts.cast_art.push({
        name: c.name, role: c.role || "",
        url: cinematicPortrait(w, h, hash(`${seed}#p#${c.name}`),
          c.name, c.role || "") });
    });
    [...new Set(script.scenes.map((sc) => sc.location))].forEach((loc) => {
      artifacts.scene_art.push({
        name: loc,
        url: cinematicShot(w, h, hash(`${seed}#s#${loc}`), loc,
          null, null, 0, "", "", "key") });
    });
    for (const s of shots) {
      const sSeed = hash(`${seed}#${s.shot_no}`);
      const loc = locations[s.scene_no] || "";
      artifacts.images[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "key");
      artifacts.first[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "first");
      artifacts.last[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "last");
      artifacts.videos[s.shot_no] = jsonUri({
        type: "mock-video", shot_no: s.shot_no, duration: s.duration,
        prompt: s.prompt, dialogue: s.dialogue || null,
        audio_in_video: true, aspect });
    }
    const voices = [];
    const subtitles = [];
    let lineNo = 0;
    for (const scene of script.scenes) {
      for (const line of scene.lines) {
        lineNo += 1;
        const dur = Math.max(1, Math.round(line.dialogue.length * 18) / 100);
        artifacts.voices[lineNo] = jsonUri({
          type: "mock-voice", line_no: lineNo, character: line.character,
          text: line.dialogue, duration: dur });
        voices.push({ line_no: lineNo, duration: dur });
        subtitles.push({ line_no: lineNo, character: line.character,
          text: line.dialogue });
      }
    }
    const total = Math.round(shots.reduce((a, s) => a + s.duration, 0) * 10) / 10;
    artifacts.final = jsonUri({ type: "mock-final-video",
      total_duration: total, shot_count: shots.length, aspect });
    artifacts.cover = cinematicCover(
      w, h, seed, script.project_title, number, script.logline);
    artifacts.titles = project.kind === "idol"
      ? [`${project.title}第${number}期:${script.episode_title}`,
         script.logline.slice(0, 24),
         `${script.episode_title}|${project.title}的日常`]
      : [`《${project.title}》第${number}集:${script.episode_title}`,
         `${script.characters[0].name}对决${script.characters[2] ? script.characters[2].name : "强敌"},第${number}集高能开场!`,
         `${script.logline.slice(0, 24)}……第${number}集`];
    let t = 0;
    const sceneAgg = new Map();
    for (const s of shots) {
      const e = sceneAgg.get(s.scene_no) || { start: t, duration: 0 };
      e.duration = Math.round((e.duration + s.duration) * 10) / 10;
      sceneAgg.set(s.scene_no, e);
      t = Math.round((t + s.duration) * 10) / 10;
    }
    artifacts.clips = [...sceneAgg.entries()].map(([n, e]) => ({
      scene_no: n,
      url: jsonUri({ scene_no: n, start: e.start, duration: e.duration }) }));

    const perCall = 0.1;
    const stageCosts = {
      script: perCall,
      cast: perCall * (script.characters.length + artifacts.scene_art.length),
      storyboard: perCall,
      images: perCall * shots.length, frames: perCall * shots.length,
      videos: perCall * shots.length, voices: perCall * voices.length,
      edit: perCall, qc: 0, package: perCall, archive: 0,
    };
    const stageNames = { script: "剧本", cast: "人物/场景图",
      storyboard: "分镜", images: "镜头画面", frames: "首尾帧",
      videos: "视频", voices: "配音", edit: "剪映剪辑", qc: "AI质检",
      package: "封面/标题/拆条", archive: "数据沉淀" };
    const tasks = Object.keys(stageCosts).map((stage, i) => ({
      id: i + 1, stage, name: stageNames[stage], status: "done",
      provider: stageCosts[stage] > 0 ? "mock" : "", cost: stageCosts[stage],
      error: "" }));
    const cost = Math.round(Object.values(stageCosts)
      .reduce((a, b) => a + b, 0) * 100) / 100;

    return {

      qc_report: { score: 100, passed: true, pass_score: 80, issues: [],
        rerun_shots: [], rerun_lines: [] },

  }
