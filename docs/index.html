.blocking-scene {
  margin-top: 18px; padding: 14px; border: 1px solid var(--hairline);
  border-radius: 12px; background: var(--page);
}
.blocking-scene-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 10px;
}
.blocking-scene-head h3 { margin: 0 0 2px; font-size: 15px; }
.blocking-legend {
  display: grid; gap: 9px; margin-bottom: 10px; padding: 10px;
  border: 1px solid rgba(57, 135, 229, .28); border-radius: 10px;
  background: rgba(57, 135, 229, .07);
}
.blocking-route-key, .blocking-actor-legend {
  display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap;
  font-size: 11px; color: var(--ink-2);
}
.blocking-route-key > span { display: inline-flex; align-items: center; gap: 6px; }
.route-symbol { display: inline-block; width: 28px; height: 0; border-top: 3px solid #ff5d8f; }
.route-symbol.camera { border-color: #52b8ff; border-top-style: dashed; }
.blocking-actor-legend > span {
  display: inline-flex; align-items: center; gap: 7px; min-width: 0;
  padding: 5px 8px; border-radius: 999px; background: var(--surface);
}
.blocking-actor-legend i, .blocking-route.actor > i {
  width: 10px; height: 10px; flex: none; border-radius: 50%;
  background: var(--actor-color, #94a3b8); box-shadow: 0 0 0 2px rgba(255, 255, 255, .12);
}
.blocking-actor-legend b { overflow-wrap: anywhere; }
.blocking-legend-empty { color: var(--ink-3); font-size: 11px; }
.blocking-map-scroll { max-width: 100%; overflow-x: auto; border-radius: 10px; -webkit-overflow-scrolling: touch; }
.blocking-map-btn {
  display: block; width: 100%; padding: 0; overflow: hidden; cursor: zoom-in;
  border: 1px solid var(--hairline); border-radius: 10px; background: #111827;
}
.blocking-map-btn img { display: block; width: 100%; height: auto; }
.blocking-map-mobile-hint { display: none; color: var(--ink-3); font-size: 10px; margin-top: 4px; text-align: center; }
.blocking-shot-list { display: grid; gap: 6px; margin-top: 10px; }
.blocking-shot {
  display: grid; grid-template-columns: 66px minmax(0, 1fr);
  align-items: start; gap: 8px; padding: 9px;
  border-radius: 8px; background: var(--surface);
  font-size: 12px; line-height: 1.45;
}
.blocking-shot-head { display: grid; gap: 2px; }
.blocking-shot-head b { color: var(--accent); font-size: 13px; }
.blocking-shot-head span { color: var(--ink-3); font-size: 10px; }
.blocking-routes { display: grid; gap: 6px; min-width: 0; }
.blocking-route {
  display: grid; grid-template-columns: 12px minmax(100px, auto) minmax(0, 1fr);
  align-items: center; gap: 7px; min-width: 0; padding-bottom: 5px;
  border-bottom: 1px solid var(--hairline);
}
.blocking-route:last-child { border-bottom: 0; padding-bottom: 0; }
.blocking-route b { color: var(--ink); font-size: 11px; overflow-wrap: anywhere; }
.blocking-route span { color: var(--ink-2); overflow-wrap: anywhere; }
.blocking-route.camera > i {
  width: 11px; height: 11px; border: 2px dashed #52b8ff;
  background: rgba(82, 184, 255, .15); transform: rotate(45deg);
}
.blocking-route.camera em {
  grid-column: 2 / -1; color: var(--ink-3); font-style: normal; white-space: normal;
}
.blocking-route.empty { display: block; color: var(--ink-3); }
.blocking-empty { padding: 36px; text-align: center; color: var(--ink-3); }

/* ---- 真假产线透明:占位图标注与接线指引 ---- */
.plan-badges { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.plan-st.st-real { background: var(--accent-soft); color: #7db4ef; }
.plan-st.st-model { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.plan-st.st-cost.subscription { background: rgba(57, 135, 229, .18); color: #9ecbff; }
.plan-st.st-cost.batch { background: rgba(12, 163, 12, .16); color: #7fd97f; }
.plan-st.st-cost.standard { background: rgba(250, 178, 25, .13); color: #ffd77a; }
.plan-st.st-cost.expensive {
  background: rgba(208, 59, 59, .2); color: #ffadad;
  border: 1px solid rgba(208, 59, 59, .42);
}
.plan-st.st-mock {
  background: rgba(208, 59, 59, .22); color: #ef8f8f;
  border: 1px solid rgba(208, 59, 59, .5);
}
.plan-item:has(.st-mock) { border-color: rgba(208, 59, 59, .45); }
.plan-fallback {
  color: var(--serious); font-size: 12px; margin-top: 4px;
  line-height: 1.6; word-break: break-all;
}
.mock-warn {
  display: flex; flex-direction: column; gap: 4px;
  border: 1px solid rgba(208, 59, 59, .55);
  background: rgba(208, 59, 59, .12);
  border-radius: var(--radius); padding: 10px 14px; margin: 10px 0;
}
.mock-warn b { color: #ef8f8f; }
.mock-warn span { color: var(--ink-2); font-size: 13px; line-height: 1.7; }
.mock-warn a { color: var(--accent); font-weight: 650; }

/* ---- 图片生产实况看板 ---- */
.produce-main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.plan-board {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.pb-head h2 { font-size: 16px; }
.pb-meta { color: var(--ink-2); font-size: 13px; margin: 6px 0 8px; }
.pb-meta b { color: var(--ink); font-size: 15px; }
.pb-track {
  height: 8px; border-radius: 999px; background: var(--surface-3);
  overflow: hidden;
}
.pb-fill {
  height: 100%; border-radius: 999px; background: var(--accent);
  transition: width .6s ease;
}
.pb-cat h3 {
  font-size: 13px; margin: 14px 0 8px; color: var(--ink-2);
  display: flex; align-items: baseline; gap: 8px;
}
.pb-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.plan-card {
  border: 1px solid var(--hairline); border-radius: var(--radius);
  background: var(--surface-2); padding: 8px;
  display: flex; flex-direction: column; gap: 5px; min-width: 0;
}
.plan-selectable {
  cursor: pointer; position: relative;
  transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.plan-selectable:hover {
  border-color: rgba(57, 135, 229, .7); transform: translateY(-1px);
}
.plan-selectable:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.plan-selectable.selected {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(57, 135, 229, .35);
}
.plan-selectable.selected::after {
  content: "✓ 已选择"; position: absolute; top: 6px; right: 6px;
  z-index: 2; padding: 2px 7px; border-radius: 999px;
  color: white; background: var(--accent); font-size: 10.5px; font-weight: 700;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .28);
}
.pb-select-hint {
  color: var(--ink-3); font-size: 11.5px; margin-top: 7px;
}
.plan-card.st-generating {
  border-color: var(--warning);
  box-shadow: 0 0 0 1px rgba(250, 178, 25, .3);
  animation: planPulse 1.6s ease-in-out infinite;
}
.plan-card.st-failed { border-color: var(--critical); }
.pc-media img {
  width: 100%; height: 150px; object-fit: cover;
  border-radius: 8px; background: #000; display: block;
}
.pc-empty {
  width: 100%; height: 150px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface-3); font-size: 28px; color: var(--ink-3);
  border: 1px dashed var(--hairline);
}
.pc-empty.gen { color: var(--warning); border-color: var(--warning); }
.pc-empty.fail { color: var(--critical); border-color: var(--critical); }
.pc-label {
  font-size: 12.5px; font-weight: 650; color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pc-state { font-size: 11.5px; line-height: 1.5; }
.pc-model {
  color: #9fcaff; font-size: 10.5px; line-height: 1.35;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pc-timer { color: var(--warning); font-weight: 650; }
.pc-ok { color: var(--good); }
.pc-ok .pc-mock { color: var(--serious); }
.pc-fail { color: #e57a7a; word-break: break-all; }
.pc-wait { color: var(--ink-3); }
.plan-card .plan-prompt summary { font-size: 11.5px; }
.plan-card .plan-prompt pre { font-size: 11.5px; max-height: 150px; overflow: auto; }

/* ---- 图片选择与大图预览 ---- */
.image-preview-panel { width: min(920px, 94vw); }
.image-preview-panel .script-head > div { min-width: 0; }
.image-preview-panel .script-head h3 { margin: 0; }
.plan-preview-gallery {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
  margin-top: 12px;
}
.plan-preview-main {
  display: block; max-width: 100%; width: auto; max-height: 66vh;
  margin: 0 auto; object-fit: contain; border-radius: 10px;
  background: #080a0d; border: 1px solid var(--hairline);
}
.plan-preview-thumbs {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
}
.plan-preview-thumb {
  padding: 3px; border: 1px solid var(--hairline); background: var(--surface-2);
  border-radius: 8px;
}
.plan-preview-thumb.active { border-color: var(--accent); }
.plan-preview-thumb img {
  display: block; width: 56px; height: 56px; object-fit: cover; border-radius: 5px;
}
.plan-preview-empty {
  min-height: 260px; margin-top: 12px; border: 1px dashed var(--hairline);
  border-radius: 10px; display: grid; place-items: center;
  color: var(--ink-3); background: var(--surface-2); padding: 30px;
  text-align: center;
}
.plan-preview-meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 12px 0 8px; color: var(--ink-2); font-size: 12px;
}
.plan-preview-meta .preview-download { margin-left: auto; }
.image-preview-panel .plan-prompt pre { max-height: 180px; overflow: auto; }

/* ---- 资产中心 ---- */
.assets-center { padding: 14px 18px 40px; display: flex; flex-direction: column; gap: 14px; }
.assets-center .canvas-toolbar { position: static; }
.asset-panel {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.asset-panel h2 { font-size: 15px; margin-bottom: 10px; }
.asset-panel h2 .dim { font-size: 12px; font-weight: 400; }
#asset-project {
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 6px 10px; font-size: 13px;
}
.ref-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.ref-form input {
  flex: 1; min-width: 200px; background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px; padding: 8px 10px;
  font-size: 13px;
}
.char-suite { margin-bottom: 16px; }
.char-suite h3 {
  font-size: 14px; margin: 10px 0 8px;
  display: flex; align-items: baseline; gap: 8px;
}
.ref-card .ref-del {
  font-size: 12px; color: var(--ink-2);
  background: var(--surface-3); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 4px 8px; cursor: pointer;
}
.ref-card .ref-del:hover { color: #ef8f8f; border-color: var(--critical); }
.asset-card .regen-box, .asset-card .io-box { margin-top: 2px; }
.asset-catalog-toolbar {
  display: flex; align-items: end; justify-content: space-between;
  gap: 14px; margin-bottom: 12px;
}
.asset-catalog-toolbar h2 { margin-bottom: 3px; }
.asset-catalog-toolbar label { display: grid; gap: 4px; color: var(--ink-3); font-size: 11px; }
.asset-catalog-toolbar select {
  min-width: 150px; background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px; padding: 7px 9px;
}
.asset-catalog-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
  gap: 12px;
}
.asset-catalog-card {
  position: relative; min-width: 0; overflow: hidden; border-radius: 12px;
  border: 1px solid var(--hairline); background: var(--surface-2);
  padding-bottom: 10px;
}
.asset-catalog-media { aspect-ratio: 4 / 3; background: #080a0d; overflow: hidden; }
.asset-catalog-media img { width: 100%; height: 100%; object-fit: cover; }
.asset-catalog-head { display: flex; align-items: center; gap: 7px; padding: 10px 10px 5px; }
.asset-catalog-head b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.asset-category-chip {
  flex: none; padding: 2px 6px; border-radius: 999px; color: #a9d2ff;
  background: rgba(57, 135, 229, .16); font-size: 10px;
}
.asset-origin-meta { padding: 0 10px; }
.asset-origin-meta > div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
.asset-origin-meta dt { color: var(--ink-3); font-size: 10px; }
.asset-origin-meta dd { color: var(--ink-2); font-size: 10px; text-align: right; }
.asset-prompt { margin: 6px 10px; font-size: 11px; }
.asset-prompt summary { color: var(--ink-2); cursor: pointer; }
.asset-prompt p { margin-top: 6px; max-height: 118px; overflow: auto; white-space: pre-wrap; line-height: 1.55; }
.asset-catalog-card > .asset-del { margin-left: 10px; }

/* ---- 剧本确认页:画风与参考面板 ---- */
.style-panel {
  margin: 0 18px; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 14px 16px;
}
.style-panel h2 { font-size: 15px; margin-bottom: 10px; }
.style-panel h2 .dim { font-size: 12px; font-weight: 400; }
.style-row {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-bottom: 8px;
}
.style-row label {
  flex: 0 0 64px; font-size: 13px; color: var(--ink-2); font-weight: 650;
}
.style-row input {
  flex: 1; min-width: 180px; background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 10px; font-size: 13px;
}
#style-input { font-weight: 650; }
.style-panel .ref-grid { margin-top: 10px; }

/* ---------- PWA / 手机访问包装 ---------- */
.nav-icon { display: none; }
.mobile-install-trigger {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 40px; padding: 7px 12px; white-space: nowrap;
  color: #cfe4ff; background: var(--accent-soft);
  border-color: rgba(57, 135, 229, .42);
}
.mobile-install-trigger:hover { border-color: var(--accent); }
.mobile-access-card {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-radius: var(--radius); border: 1px solid rgba(57, 135, 229, .34);
  background: #111b28;
}
.mobile-access-card img {
  width: 44px; height: 44px; flex: none; border-radius: 11px;
  box-shadow: 0 5px 16px rgba(0, 0, 0, .34);
}
.mobile-access-card > div { display: grid; gap: 2px; min-width: 0; }
.mobile-access-card b { font-size: 14px; }
.mobile-access-card span { color: var(--ink-2); font-size: 11.5px; }
.mobile-access-card button { margin-left: auto; min-height: 40px; flex: none; }
.mobile-access-overlay { z-index: 60; }
.mobile-access-panel { width: min(620px, 100%); padding: 22px; }
.mobile-kicker {
  color: #8fc2ff; font-size: 10px; font-weight: 750;
  letter-spacing: .13em;
}
.mobile-access-close { width: 44px; height: 44px; padding: 0; flex: none; }
.mobile-access-hero {
  display: grid; grid-template-columns: 76px 1fr; gap: 16px; align-items: center;
  margin: 18px 0; padding: 16px; border-radius: 12px;
  background: #101923; border: 1px solid rgba(57, 135, 229, .24);
}
.mobile-access-hero img { width: 76px; height: 76px; border-radius: 18px; }
.mobile-access-hero strong { display: block; font-size: 16px; margin-bottom: 4px; }
.mobile-access-hero p { color: var(--ink-2); font-size: 12.5px; }
.mobile-url-list { display: grid; gap: 8px; }
.mobile-url-list > span { color: var(--ink-3); font-size: 11px; }
.mobile-url-list a {
  display: block; padding: 12px 14px; border-radius: 9px;
  color: var(--ink-2); border: 1px solid var(--hairline);
  background: var(--surface-2); overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}
.mobile-url-list a.preferred { color: #cfe4ff; border-color: rgba(57, 135, 229, .5); }
.mobile-access-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
.mobile-access-actions button { min-height: 44px; }
.mobile-install-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mobile-install-guide > div {
  display: grid; gap: 3px; padding: 11px 12px; border-radius: 9px;
  border: 1px solid var(--hairline); background: var(--surface-2);
}
.mobile-install-guide b { font-size: 12px; }
.mobile-install-guide span { color: var(--ink-3); font-size: 11px; }
.mobile-access-warning {
  padding: 12px; color: #ffd39a; border: 1px solid rgba(250, 178, 25, .36);
  background: rgba(250, 178, 25, .08); border-radius: 9px;
}
.mobile-security-note { color: var(--ink-3); font-size: 10.5px; margin-top: 14px; }

/* 扫码打开:同一 Wi-Fi / 外网地址二维码 */
.mobile-qr {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  margin-top: 10px;
}
.mobile-qr img {
  border-radius: 10px; background: #fff; padding: 8px;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .28); image-rendering: pixelated;
}
.mobile-qr span { color: var(--ink-3); font-size: 11px; }
.mobile-public-access {
  display: grid; gap: 8px; margin-top: 14px; padding: 14px;
  border: 1px solid rgba(57, 135, 229, .4); border-radius: 11px;
  background: rgba(57, 135, 229, .08);
}
.mobile-public-access > span { color: #cfe4ff; font-size: 11px; font-weight: 600; }
.mobile-public-access.muted {
  border-color: rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .03);
}
.mobile-public-access.muted > span { color: var(--ink-3); }
.mobile-public-access a {
  color: #cfe4ff; word-break: break-all; font-size: 13px;
  padding: 9px 11px; border: 1px solid rgba(57, 135, 229, .5);
  border-radius: 9px; background: rgba(10, 16, 28, .5);
}
.mobile-hint { color: var(--ink-3); font-size: 11px; line-height: 1.6; }
.mobile-hint code {
  background: rgba(255, 255, 255, .1); padding: 1px 5px; border-radius: 5px;
}

@media (max-width: 780px) {
  :root { --radius: 12px; }
  html { min-height: 100%; background: var(--page); }
  body { min-height: 100dvh; height: auto; padding-bottom: env(safe-area-inset-bottom); }
  button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
  button, input, select { min-height: 44px; }
  input, select, textarea { font-size: 16px; }

  #topbar {
    position: sticky; top: 0; z-index: 16; min-height: 56px; height: 56px;
    padding: 0 max(12px, env(safe-area-inset-left)); gap: 8px;
    /* backdrop-filter 会把 position:fixed 的底部导航困在顶栏坐标系内。 */
    background: #141413; backdrop-filter: none;
  }
  .topbar-main { flex: 0 1 auto; min-width: 0; }
  .brand { min-width: 0; }
  .brand-mark { font-size: 16px; letter-spacing: .05em; }
  .brand-sub, #topbar-right { display: none; }
  #mobile-access-global { margin-left: auto; min-width: 44px; padding: 7px 10px; }
  #mobile-access-global > span:last-child { display: none; }

  .main-nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0;
    min-height: calc(66px + env(safe-area-inset-bottom));
    padding: 4px max(4px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px, env(safe-area-inset-left));
    background: rgba(20, 20, 19, .97); border-top: 1px solid var(--hairline);
    box-shadow: 0 -10px 28px rgba(0, 0, 0, .35); backdrop-filter: blur(18px);
  }
  .main-nav a {
    min-width: 0; min-height: 58px; padding: 5px 2px 4px;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
    color: var(--ink-3); font-size: 10px; line-height: 1.2; border-radius: 10px;
  }
  .main-nav a:hover { text-decoration: none; }
  .main-nav a.active { color: #bcdcff; background: var(--accent-soft); }
  .main-nav a.active::after { display: none; }
  .nav-icon { display: block; font-size: 20px; line-height: 1; font-weight: 500; }

  #app { min-height: calc(100dvh - 56px); padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
  .loading { padding: 42px 16px; }
  .dash, .settings, .assets-center, .produce-live { padding: 12px 12px 26px; gap: 12px; }
  .history-page { padding: 16px 12px 28px; }
  .standards-page { padding: 16px 12px calc(152px + env(safe-area-inset-bottom)); }

  .mobile-access-card { align-items: center; padding: 11px 12px; }
  .mobile-access-card img { width: 40px; height: 40px; border-radius: 10px; }
  .mobile-access-card span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mobile-access-card button { width: 44px; padding: 0; overflow: hidden; color: transparent; position: relative; }
  .mobile-access-card button::after { content: "›"; position: absolute; inset: 0; display: grid; place-items: center; color: #cfe4ff; font-size: 25px; }

  .produce-bar { display: grid; grid-template-columns: minmax(0, 1fr); padding: 13px; gap: 10px; }
  .produce-bar input, .produce-bar select, .produce-bar textarea,
  .produce-bar .style-field, .produce-bar button.primary { width: 100%; min-width: 0; }
  .produce-bar button.primary { min-height: 50px; font-size: 15px; }
  .series-import-tools { grid-template-columns: minmax(0, 1fr); }
  .series-import-tools > small { grid-column: auto; }

/* ---- 人物设定展示 + 图片灯箱 ---- */
.design-box { margin: 4px 0 10px; }
.design-box summary {
  cursor: pointer; font-size: 12.5px; color: var(--ink-2);
}
.design-grid {
  display: grid; gap: 6px 14px; margin-top: 8px;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 10px 12px;
}
.design-row { font-size: 12.5px; line-height: 1.7; display: flex; gap: 8px; }
.design-row b { flex: 0 0 62px; color: var(--accent); font-weight: 650; }
.design-row span { color: var(--ink-2); }
.pc-media img.zoomable { cursor: zoom-in; }
.img-lightbox { z-index: 300; }
.lightbox-box {
  position: relative; max-width: 92vw; max-height: 92vh;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.lightbox-box img {
  max-width: 92vw; max-height: 84vh; object-fit: contain;
  border-radius: 12px; background: #000;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
}
.lightbox-box figcaption { color: var(--ink-2); font-size: 13px; }
.lightbox-box .close {
  position: absolute; top: -2px; right: -2px;
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 6px 10px; cursor: pointer;
}

/* ---- 断点续画横幅 + 重画表单动作行 ---- */
.resume-banner {
  margin: 0 18px; padding: 10px 14px;
  border: 1px solid rgba(250, 178, 25, .5);
  background: rgba(250, 178, 25, .1);
  border-radius: var(--radius); color: var(--ink-2); font-size: 13px;
}
.resume-banner b { color: var(--warning); }
.plan-edit-actions { display: flex; gap: 8px; }
.plan-edit-actions .plan-edit-go { flex: 1; }
.regen-form .regen-ref { font-size: 12px; }

/* ---- 出图产线切换 ---- */
.image-line-row select {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 10px; font-size: 13px;
}
.image-line-row #image-line:disabled { opacity: 1; color: #cfe4ff; cursor: help; }
.image-line-row .il-label { flex: 0 0 auto; }

/* ---- 图片质检徽标 ---- */
.plan-st.st-qc-ok { background: rgba(12, 163, 12, .14); color: #58c558; }
.plan-st.st-auto { background: rgba(141, 83, 255, .18); color: #c6adff; }
.plan-st.st-refs { background: rgba(57, 135, 229, .18); color: #9ecbff; }
.plan-trace {
  margin: 5px 0; padding: 6px 8px;
  border: 1px solid rgba(57, 135, 229, .22); border-radius: 7px;
  background: rgba(57, 135, 229, .06); color: var(--ink-2); font-size: 11px;
}
.plan-trace summary { cursor: pointer; color: #a9d0ff; }
.plan-trace div { margin-top: 5px; line-height: 1.45; overflow-wrap: anywhere; }
.batch-job-progress {
  position: sticky; top: 38px; z-index: 3; margin: 8px 0 12px; padding: 11px 12px;
  border: 1px solid rgba(57, 135, 229, .42); border-radius: 10px;
  background: rgba(20, 30, 48, .96); box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
}
.batch-job-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
.batch-job-head b { color: #cfe4ff; }
.batch-job-head span { color: var(--ink-2); text-align: right; }
.batch-job-track {
  height: 7px; margin: 8px 0; overflow: hidden;
  border-radius: 99px; background: var(--surface-3);
}
.batch-job-track i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, #3987e5, #8d53ff);
  transition: width .25s ease;
}
.batch-job-meta {
  display: flex; flex-wrap: wrap; gap: 5px 12px;
  color: var(--ink-3); font-size: 10.5px;
}

.mock-warn .mw-redo { margin-left: 12px; font-size: 12.5px; }

/* ---- 单张/批量质检按钮 ---- */
.plan-qc-row { margin: 4px 0; }
.plan-qc-one {
  font-size: 12px; background: var(--surface-3); color: var(--ink-2);
  border: 1px solid var(--hairline); border-radius: 8px;

}
.plan-qc-one:hover { color: var(--ink); border-color: var(--accent); }

  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;

  background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: var(--radius);
}
.plan-batchbar button {
  font-size: 13px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--hairline);
}
.plan-batchbar .batch-redo-failed:not(:disabled) {
  background: rgba(208, 59, 59, .18); color: #ef8f8f;
  border-color: rgba(208, 59, 59, .5);
}
.plan-batchbar button:disabled { opacity: .5; cursor: default; }

/* ---- 勾选批量重画 ---- */
.plan-pick { font-size: 11px; color: var(--ink-3); cursor: pointer; margin-right: 6px; white-space: nowrap; }
.plan-pick input { vertical-align: middle; }
.plan-item:has(.plan-pick-box:checked) {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent-soft);
}
.plan-batchbar .batch-sep { color: var(--ink-3); }

  background: var(--accent); color: #fff; border-color: var(--accent);
}
.image-line-row #qc-line {
  background: var(--page); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 10px; font-size: 13px;

.quality-select, .regen-quality, .plan-edit-quality, .batch-quality,

/* 生产画布:人物/场景/镜头关系线 */
.relation-canvas { margin: 10px 0 16px; }
.relation-canvas h3 { margin: 0 0 8px; font-size: 13.5px; }
.relation-canvas h3 .dim { font-weight: 400; font-size: 11px; }
.rel-scroll { overflow-x: auto; border: 1px solid var(--hairline);
  border-radius: 10px; background: rgba(255, 255, 255, .02); }
.rel-svg { display: block; margin: 0 auto; }
.rel-col { fill: var(--ink-3); font-size: 11px; text-anchor: middle;
  letter-spacing: 2px; }
.rel-node { cursor: pointer; }
.rel-node rect { fill: rgba(255, 255, 255, .05);
  stroke: rgba(255, 255, 255, .22); }
.rel-node-character rect { stroke: rgba(57, 135, 229, .65);
  fill: rgba(57, 135, 229, .12); }
.rel-node-scene rect { stroke: rgba(178, 148, 250, .6);
  fill: rgba(178, 148, 250, .1); }
.rel-node-shot rect { stroke: rgba(255, 255, 255, .25); }
.rel-node.st-done rect, .rel-node.st-reused rect {
  stroke: rgba(63, 185, 80, .8); fill: rgba(63, 185, 80, .12); }
.rel-node.st-generating rect { stroke: rgba(250, 178, 25, .85);
  fill: rgba(250, 178, 25, .12); }
.rel-node.st-failed rect { stroke: rgba(248, 81, 73, .85);
  fill: rgba(248, 81, 73, .12); }
.rel-node text { text-anchor: middle; pointer-events: none; }
.rel-node .rel-label { fill: var(--ink); font-size: 11.5px; }
.rel-node .rel-sub { fill: var(--ink-3); font-size: 9.5px; }
.rel-node.hl rect { stroke-width: 2.4; filter: drop-shadow(0 0 5px rgba(57, 135, 229, .8)); }
.rel-edge path { stroke: rgba(255, 255, 255, .18); stroke-width: 1.2; }

  /* 自带剧本解析(与平台 script_import.py 同构) */
  function parseTextScript(text, title, number) {
    const sceneRe = /^\s*(?:【?第\s*([0-9一二三四五六七八九十百]+)\s*场】?|场景\s*(\d+))[::.\s]*(.*)$/;
    const lineRe = /^\s*([^\s::]{1,12})\s*[::]\s*(.+)$/;
    const scenes = [];
    let current = null;
    const openScene = (loc) => {
      current = { scene_no: scenes.length + 1,
        location: loc || `场景${scenes.length + 1}`,
        characters: [], action: "", lines: [] };
      scenes.push(current);
    };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const sm = sceneRe.exec(line);
      if (sm) { openScene((sm[3] || "").trim()); continue; }
      if (!current) openScene("主场景");
      const lm = lineRe.exec(line);
      if (lm) current.lines.push({ character: lm[1], dialogue: lm[2].trim() });
      else current.action = current.action ? current.action + " " + line : line;
    }
    const valid = scenes.filter((s) => s.lines.length || s.action);
    if (!valid.some((s) => s.lines.length))
      throw new Error("未能从剧本解析出台词;格式:「角色名:台词」,场次用「第1场 地点」");
    const counts = {};
    valid.forEach((s, i) => {
      s.scene_no = i + 1;
      s.characters = [...new Set(s.lines.map((l) => l.character))].sort();
      s.lines.forEach((l) => { counts[l.character] = (counts[l.character] || 0) + 1; });
    });
    const ordered = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const firstAction = (valid.find((s) => s.action) || {}).action || "";
    return {
      project_title: title, episode_number: number,
      episode_title: valid[0].location,
      logline: firstAction || valid[0].lines[0].dialogue,
      characters: ordered.map((name, i) => ({
        name, role: i === 0 ? "主角" : "配角" })),
      scenes: valid,
    };
  }

  /* ---- 作品名自由识别(与平台 smart_input.py 同构) ---- */
  const CN_DIGITS = { "零": 0, "一": 1, "二": 2, "两": 2, "三": 3, "四": 4,
    "五": 5, "六": 6, "七": 7, "八": 8, "九": 9 };
  function cnToInt(text) {
    if (!text) return null;
    if (text.includes("十")) {
      const [tens, units] = text.split("十");
      const t = tens === "" ? 1 : CN_DIGITS[tens];
      const u = units === "" ? 0 : CN_DIGITS[units];
      if (t === undefined || u === undefined) return null;
      return t * 10 + u;
    }
    let v = 0;
    for (const ch of text) {
      if (CN_DIGITS[ch] === undefined) return null;
      v = v * 10 + CN_DIGITS[ch];
    }
    return v || null;
  }
  const EP_PATTERNS = [
    /第\s*(\d+)\s*[集期话]/, /第\s*([零一二两三四五六七八九十]+)\s*[集期话]/,
    /[eE][pP]\.?\s*(\d+)/, /(\d+)\s*[集期话]/];
  const CMD_PREFIXES = ["开始制作", "开始生产", "继续制作", "重新制作",
    "帮我制作", "帮我做", "给我做", "我要做", "我想做", "制作", "生成",
    "生产", "开拍", "再来一集", "来一集", "一集", "做", "把", "将", "拍"]
    .sort((a, b) => b.length - a.length);
  const CMD_SUFFIXES = ["的下一集", "下一集", "的新一集", "新一集",
    "再来一集", "来一集", "一集", "吧", "呗", "啊", "呀", "哦", "喔", "了"]
    .sort((a, b) => b.length - a.length);
  const TRIM_RE = /^[\s《》「」『』“”"'‘’,,。.!!??::;;、~~]+|[\s《》「」『』“”"'‘’,,。.!!??::;;、~~]+$/g;
  function trimNoise(s) { return s.replace(TRIM_RE, ""); }
  function stripNoise(text) {
    let out = trimNoise(text);
    let changed = true;
    while (changed && out) {
      changed = false;
      for (const p of CMD_PREFIXES)
        if (out.startsWith(p) && out.length > p.length) {
          out = trimNoise(out.slice(p.length)); changed = true; break;
        }
      for (const s of CMD_SUFFIXES)
        if (out.endsWith(s) && out.length > s.length) {
          out = trimNoise(out.slice(0, -s.length)); changed = true; break;
        }
    }
    return out;
  }
  function parseFreeText(text, knownTitles) {
    text = (text || "").trim();
    if (!text) return [null, null];
    let number = null, working = text;
    for (const re of EP_PATTERNS) {
      const m = re.exec(working);
      if (m) {
        const raw = m[1];
        const n = /^\d+$/.test(raw) ? parseInt(raw, 10) : cnToInt(raw);
        if (n) {
          number = n;
          working = working.slice(0, m.index) +
            working.slice(m.index + m[0].length);
          break;
        }
      }
    }
    const t = /《(.+?)》/.exec(working);
    if (t) return [t[1].trim(), number];
    const hits = knownTitles.filter(
      (k) => k && k.length >= 2 && working.includes(k));
    if (hits.length)
      return [hits.sort((a, b) => b.length - a.length)[0], number];
    const title = stripNoise(working);
    return [title || null, number];
  }
  function resolveTarget(sentence, title, number) {
    const titles = state.projects.map((p) => p.title);
    if (!title) {
      const [t, n] = parseFreeText(sentence, titles);
      title = t;
      if (number == null) number = n;
    }
    if (!title)
      return { error: "没认出作品名。直接写作品名即可,如「万妖图录 第3集」" +
        "或「苏念的一天」(集数可不写,自动接着做下一集)" };
    if (!titles.includes(title)) {
      const norm = title.split(" ").join("");
      const cands = titles.filter((k) => k.split(" ").join("") === norm ||
        (title.length >= 2 && (k.includes(title) || title.includes(k))));
      if (cands.length) title = cands.sort((a, b) => b.length - a.length)[0];
    }
    let note = "";
    if (number == null) {
      const project = state.projects.find((p) => p.title === title);
      if (project) {
        const nums = state.episodes.filter(
          (e) => e.project_id === project.id).map((e) => e.number);
        number = (nums.length ? Math.max(...nums) : 0) + 1;

      } else { number = 1; note = `新作品《${title}》,从第1集开始`; }
    } else if (sentence && !sentence.includes("《")) {
      note = `已匹配到项目《${title}》第${number}集`;
    }
    return { title, number, note };
  }

  function maskKey(v) {

  /* ---- 真实 API 直连:配好 Key 后剧本/图片真实调用,失败自动回退 ---- */
  const realFetch = typeof window.fetch === "function"
    ? window.fetch.bind(window)
    : async () => { throw new Error("当前环境不支持网络请求"); };
  const SANDBOX_HINT = "若在 claude.ai 演示页打开,沙箱会拦截外联;" +
    "请把页面另存为本地 html 打开(或用外链版 / 本机运行正式版)再试";
  function apiConf(name) {

  function endpointOf(conf, dflt) {
    return (conf.endpoint || dflt).replace(/\/+$/, "");

  async function claudeMessages(conf, prompt, maxTokens) {
    const r = await realFetch(
      endpointOf(conf, "https://api.anthropic.com") + "/v1/messages", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": conf.api_key,
          "anthropic-version": "2023-06-01",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify({
          model: conf.model || "claude-opus-4-8",
          max_tokens: maxTokens || 8000,
          messages: [{ role: "user", content: prompt }],
        }),
      });
    if (!r.ok)
      throw new Error(`HTTP ${r.status} ${(await r.text()).slice(0, 200)}`);
    const data = await r.json();
    return (data.content || []).filter((b) => b.type === "text")
      .map((b) => b.text).join("");
  }
  function extractJsonLoose(text) {
    const start = text.indexOf("{");
    if (start === -1) return null;
    let depth = 0, inStr = false, escNext = false;
    for (let i = start; i < text.length; i += 1) {
      const ch = text[i];
      if (inStr) {
        if (escNext) escNext = false;
        else if (ch === "\\") escNext = true;
        else if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') inStr = true;
      else if (ch === "{") depth += 1;
      else if (ch === "}") {
        depth -= 1;
        if (depth === 0) {
          try { return JSON.parse(text.slice(start, i + 1)); }
          catch (e) { return null; }
        }
      }
    }
    return null;
  }
  function claudePrompt(project, number, premise) {
    const style = project.style ||
      (project.kind === "idol" ? "元气偶像" : "国风漫剧");
    if (project.kind === "idol") {
      const persona = personaFromTitle(project.title);
      return `你是 AI 虚拟偶像「${persona}」的内容策划。为第${number}期短视频写口播脚本。
人设风格:${style};本期主题:${premise || "自选一个日常主题"}。

要求:3 场;台词口语化有网感,单句不超过 22 个字;若主题涉及女团/组合,设 2-4 名成员并分配台词;只输出一个 JSON 对象,不要任何其他文字或 Markdown 代码块。

JSON 格式:{"project_title":"${project.title}","episode_number":${number},"episode_title":"本期小标题","logline":"一句话概要","characters":[{"name":"${persona}","role":"主角"}],"scenes":[{"scene_no":1,"location":"场景","characters":["${persona}"],"action":"画面动作","lines":[{"character":"${persona}","dialogue":"口播台词"}]}]}`;
    }
    return `你是漫剧编剧。为作品《${project.title}》第${number}集创作一集完整剧本。
风格:${style};本集前提:${premise || "自由发挥"}。

要求:3 到 5 场,每场 2-4 句台词,适合 1-2 分钟短剧;台词口语化,单句不超过 25 个字;只输出一个 JSON 对象,不要任何其他文字或 Markdown 代码块。

JSON 格式:{"project_title":"${project.title}","episode_number":${number},"episode_title":"本集小标题","logline":"一句话梗概","characters":[{"name":"角色名","role":"主角/同伴/反派"}],"scenes":[{"scene_no":1,"location":"地点","characters":["出场角色名"],"action":"本场动作描述","lines":[{"character":"角色名","dialogue":"台词"}]}]}`;
  }
  function validateScriptLoose(s, project, number) {
    if (!s || !Array.isArray(s.scenes) || !s.scenes.length ||
        !Array.isArray(s.characters) || !s.characters.length) return null;
    s.project_title = s.project_title || project.title;
    s.episode_number = number;
    s.episode_title = s.episode_title || "";
    s.logline = s.logline || "";
    s.scenes.forEach((sc, i) => {
      sc.scene_no = i + 1;
      sc.location = sc.location || `场景${i + 1}`;
      sc.action = sc.action || "";
      sc.lines = (sc.lines || []).filter(
        (l) => l && l.character && l.dialogue);
      sc.characters = [...new Set(sc.lines.map((l) => l.character))].sort();
    });
    if (!s.scenes.some((sc) => sc.lines.length)) return null;
    return s;
  }
  async function realScriptFor(project, number, premise, conf) {
    const text = await claudeMessages(
      conf, claudePrompt(project, number, premise), 8000);
    const obj = validateScriptLoose(
      extractJsonLoose(text), project, number);
    if (!obj) throw new Error("Claude 输出未通过剧本校验");
    return obj;
  }
  function sizeOf(aspect) {
    return aspect === "16:9" ? "1536x1024"
      : aspect === "9:16" ? "1024x1536" : "1024x1024";
  }
  async function realImage(conf, prompt, aspect) {
    const r = await realFetch(
      endpointOf(conf, "https://api.openai.com") + "/v1/images/generations", {
        method: "POST",
        headers: {
          "content-type": "application/json",
          authorization: `Bearer ${conf.api_key}`,
        },
        body: JSON.stringify({ model: conf.model || "gpt-image-2",
          prompt, n: 1, size: sizeOf(aspect) }),
      });
    if (!r.ok)
      throw new Error(`HTTP ${r.status} ${(await r.text()).slice(0, 200)}`);
    const data = await r.json();
    const item = (data.data || [])[0] || {};
    if (item.b64_json) return "data:image/png;base64," + item.b64_json;
    if (item.url) return item.url;
    throw new Error("应答缺少 b64_json/url");
  }
  /* 人物/场景图渐进替换为真实出图(成一张换一张,失败保留占位图) */
  async function enhanceWithRealImages(epId, project, full) {
    const conf = apiConf("image_api");

    const each = (fn) => {
      [state.payloads[epId], state.fullResults[epId], full].forEach(

    const wanted = [];
    (full.artifacts.cast_art || []).forEach((c) => wanted.push({
      label: `人物立绘「${c.name}」`,

          `出图 API 失败(${job.label}):${e.message}`);

            "error");

      }
    }
    if (done && window.showToast)
      showToast(`出图 API 已真实生成 ${done} 张人物/场景图`, "ok");

  function buildStoryboard(script, seed) {
    const shots = [];
    let no = 0;
    for (const scene of script.scenes) {
      no += 1;
      shots.push({
        shot_no: no, scene_no: scene.scene_no, kind: "environment",
        description: scene.action, camera: pick(CAMERAS, seed, no),
        duration: 2.5, characters: scene.characters, dialogue: null,
        prompt: `漫剧风格,${scene.location},${scene.action},镜头:${pick(CAMERAS, seed, no)}`,
      });
      for (const line of scene.lines) {
        no += 1;
        shots.push({
          shot_no: no, scene_no: scene.scene_no, kind: "dialogue",
          description: `${line.character}说话`, camera: pick(CAMERAS, seed, no),
          duration: 3.0, characters: [line.character], dialogue: line,
          prompt: `漫剧风格,${scene.location},${line.character}正在说:「${line.dialogue}」,镜头:${pick(CAMERAS, seed, no)}`,
        });
      }

    return { episode_title: script.episode_title, shots };
  }

  /* ---- 一集的完整生产 ---- */
  function produceEpisode(project, number, premise, providedScript) {
    const aspect = project.aspect || "9:16";
    const [w, h] = DIMS[aspect] || DIMS["9:16"];
    const seed = hash(`${project.title}#${number}#${premise}`);
    const genre = detectGenre(
      project.title, premise, project.style || "", project.kind);
    const script = providedScript
      || (genre === "idol"
        ? idolScript(project.title, number, premise, seed,
            project.title, project.style)
        : dramaScript(project.title, number, premise, seed, genre));
    const storyboard = buildStoryboard(script, seed);
    const shots = storyboard.shots;

    const locations = {};
    script.scenes.forEach((sc) => { locations[sc.scene_no] = sc.location; });
    const artifacts = { images: {}, first: {}, last: {}, videos: {},
      voices: {}, cover: null, final: null, titles: [], clips: [],
      cast_art: [], scene_art: [] };
    script.characters.forEach((c, i) => {
      artifacts.cast_art.push({
        name: c.name, role: c.role || "",
        url: cinematicPortrait(w, h, hash(`${seed}#p#${c.name}`),
          c.name, c.role || "") });
    });
    [...new Set(script.scenes.map((sc) => sc.location))].forEach((loc) => {
      artifacts.scene_art.push({
        name: loc,
        url: cinematicShot(w, h, hash(`${seed}#s#${loc}`), loc,
          null, null, 0, "", "", "key") });
    });
    for (const s of shots) {
      const sSeed = hash(`${seed}#${s.shot_no}`);
      const loc = locations[s.scene_no] || "";
      artifacts.images[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "key");
      artifacts.first[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "first");
      artifacts.last[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "last");
      artifacts.videos[s.shot_no] = jsonUri({
        type: "mock-video", shot_no: s.shot_no, duration: s.duration,
        prompt: s.prompt, dialogue: s.dialogue || null,
        audio_in_video: true, aspect });
    }
    const voices = [];
    const subtitles = [];
    let lineNo = 0;
    for (const scene of script.scenes) {
      for (const line of scene.lines) {
        lineNo += 1;
        const dur = Math.max(1, Math.round(line.dialogue.length * 18) / 100);
        artifacts.voices[lineNo] = jsonUri({
          type: "mock-voice", line_no: lineNo, character: line.character,
          text: line.dialogue, duration: dur });
        voices.push({ line_no: lineNo, duration: dur });
        subtitles.push({ line_no: lineNo, character: line.character,
          text: line.dialogue });
      }
    }
    const total = Math.round(shots.reduce((a, s) => a + s.duration, 0) * 10) / 10;
    artifacts.final = jsonUri({ type: "mock-final-video",
      total_duration: total, shot_count: shots.length, aspect });
    artifacts.cover = cinematicCover(
      w, h, seed, script.project_title, number, script.logline);
    artifacts.titles = project.kind === "idol"
      ? [`${project.title}第${number}期:${script.episode_title}`,
         script.logline.slice(0, 24),
         `${script.episode_title}|${project.title}的日常`]
      : [`《${project.title}》第${number}集:${script.episode_title}`,
         `${script.characters[0].name}对决${script.characters[2] ? script.characters[2].name : "强敌"},第${number}集高能开场!`,
         `${script.logline.slice(0, 24)}……第${number}集`];
    let t = 0;
    const sceneAgg = new Map();
    for (const s of shots) {
      const e = sceneAgg.get(s.scene_no) || { start: t, duration: 0 };
      e.duration = Math.round((e.duration + s.duration) * 10) / 10;
      sceneAgg.set(s.scene_no, e);
      t = Math.round((t + s.duration) * 10) / 10;
    }
    artifacts.clips = [...sceneAgg.entries()].map(([n, e]) => ({
      scene_no: n,
      url: jsonUri({ scene_no: n, start: e.start, duration: e.duration }) }));

    const perCall = 0.1;
    const stageCosts = {
      script: perCall,
      cast: perCall * (script.characters.length + artifacts.scene_art.length),
      storyboard: perCall,
      images: perCall * shots.length, frames: perCall * shots.length,
      videos: perCall * shots.length, voices: perCall * voices.length,
      edit: perCall, qc: 0, package: perCall, archive: 0,
    };
    const stageNames = { script: "剧本", cast: "人物/场景图",
      storyboard: "分镜", images: "镜头画面", frames: "首尾帧",
      videos: "视频", voices: "配音", edit: "剪映剪辑", qc: "AI质检",
      package: "封面/标题/拆条", archive: "数据沉淀" };
    const tasks = Object.keys(stageCosts).map((stage, i) => ({
      id: i + 1, stage, name: stageNames[stage], status: "done",
      provider: stageCosts[stage] > 0 ? "mock" : "", cost: stageCosts[stage],
      error: "" }));
    const cost = Math.round(Object.values(stageCosts)
      .reduce((a, b) => a + b, 0) * 100) / 100;

    return {
      script, storyboard, artifacts, tasks, cost,
      hashtags: project.kind === "idol"
        ? [`#${project.title}`, "#AI虚拟偶像", "#虚拟偶像", "#日常vlog"]
        : [`#${project.title}`, "#漫剧", "#AI短剧", `#第${number}集`],
      qc_report: { score: 100, passed: true, pass_score: 80, issues: [],
        rerun_shots: [], rerun_lines: [] },

  }

  /* ---- 后台任务:两段式(预生产 → 确认 → 生产) ---- */
  const jobs = {};

  function runStages(ep, stages, onDone) {

    // 开工时复制当前生效标准；后续保存/激活其他版本不改变本集合同。
    const productionStandard = clone(activeStandard());

        jobs[jobId].summary = { status: "awaiting_confirm" };

  function confirmProduce(episodeId) {
    const ep = state.episodes.find((e) => e.id === episodeId);
    const full = state.fullResults[episodeId];
    if (!ep || !full) return null;
    jobSeq += 1;
    const jobId = `j${jobSeq}`;
    jobs[jobId] = { id: jobId, status: "running", title: full.project.title,
      episode: ep.number, started_at: Date.now() / 1000 };
    log("INFO", "director", `已确认第${ep.number}集,自动生产中`);
    runStages(ep, PHASE2, () => {
      ep.status = "done";
      ep.qc_score = full.qc_report.score;
      ep.cost = full.cost;
      full.episode = { ...ep };
      state.payloads[ep.id] = full;
      jobs[jobId].status = "done";
      jobs[jobId].summary = { status: "done" };
      log("INFO", "director",
        `《${full.project.title}》第${ep.number}集 制作完成:质检 100`);
    });
    save();
    return jobId;
  }

  /* ---- API 汇总 ---- */
  function overview() {
    const episodes = state.episodes.map((e) => ({ ...e,
      project: state.projects.find((p) => p.id === e.project_id).title }));
    const done = episodes.filter((e) => e.status === "done");
    const scored = episodes.filter((e) => e.qc_score != null);
    const stageAgg = {};
    const assetStats = {};
    for (const p of state.projects) assetStats[p.title] = [];
    for (const e of episodes) {
      const payload = state.payloads[e.id];
      if (!payload) continue;
      for (const t of payload.tasks) {
        stageAgg[t.stage] = stageAgg[t.stage] || { stage: t.stage, tasks: 0, total: 0 };
        stageAgg[t.stage].tasks += 1;
        stageAgg[t.stage].total += t.cost;
      }
    }
    for (const p of state.projects) {
      const eps = episodes.filter((e) => e.project_id === p.id && state.payloads[e.id]);
      const chars = new Set(), scenes = new Set();
      let images = 0, videos = 0, voicesN = 0, clips = 0;
      for (const e of eps) {
        const pl = state.payloads[e.id];
        pl.script.characters.forEach((c) => chars.add(c.name));
        pl.script.scenes.forEach((s) => scenes.add(s.location));
        images += Object.keys(pl.artifacts.images).length;
        videos += Object.keys(pl.artifacts.videos).length;
        voicesN += Object.keys(pl.artifacts.voices).length;
        clips += pl.artifacts.clips.length;
      }
      const rows = [
        ["character", chars.size], ["scene", scenes.size],
        ["image", images], ["video", videos], ["voice", voicesN],
        ["clip", clips], ["cover", eps.length], ["edit", eps.length]];
      assetStats[p.title] = rows.filter(([, n]) => n > 0)
        .map(([kind, total]) => ({ kind, total, reused: 0 }));
    }
    const totalCost = Math.round(
      episodes.reduce((a, e) => a + (e.cost || 0), 0) * 100) / 100;
    return {
      version: "3.2.0-browser-demo",
      projects: state.projects,
      episodes: episodes.slice().reverse(),
      stats: {
        episodes: episodes.length, done: done.length, total_cost: totalCost,
        avg_qc: scored.length ? Math.round(scored.reduce(
          (a, e) => a + e.qc_score, 0) / scored.length * 10) / 10 : null,
        budget: BUDGET,
      },
      cost_by_stage: Object.values(stageAgg).map((r) => ({ ...r,
        total: Math.round(r.total * 100) / 100 }))
        .sort((a, b) => b.total - a.total),
      cost_by_provider: [{ provider: "mock(浏览器)",
        calls: Math.round(totalCost / 0.1), total: totalCost }],
      quota: [{ provider: "jimeng", used: 0, quota_limit: 1000 }],
      asset_stats: assetStats,
      jobs: Object.values(jobs).sort((a, b) => b.started_at - a.started_at),
    };
  }

  async function route(path, opts) {
    const key = path.split("#")[0];
    const method = (opts?.method || "GET").toUpperCase();
    if (method === "GET" && key === "/api/standards")
      return [200, standardsPayload()];
    if (method === "GET" && key.startsWith("/api/standards/export")) {
      const versionId = Number(new URL(path, location.href)
        .searchParams.get("version_id"));
      const standard = versionId
        ? state.standards.history.find((item) => item.version_id === versionId)
        : activeStandard();
      if (!standard) return [404, { error: "制作标准版本不存在" }];
      return [200, { schema: STANDARD_SCHEMA, exported_at: Date.now() / 1000,
        standard: clone(standard) }];
    }
    if (method === "POST" && key === "/api/standards/save") {
      const body = JSON.parse(opts.body || "{}");
      if (!body.content || typeof body.content !== "object")
        return [400, { error: "缺少 content 制作标准" }];
      const result = saveStandardVersion(body.content, body.change_note,
        body.activate !== false, body.expected_active_id);
      if (result.conflict) return [409, {
        error: "制作标准已被其他操作更新",
        message: `激活版本已变化（期望 ${result.expected_active_id}，实际 ${result.actual_active_id}）`,
        expected_active_id: result.expected_active_id,
        actual_active_id: result.actual_active_id,
      }];
      if (result.error) return [400, { error: result.error,
        message: result.issues.map((item) =>
          `${item.path}: ${item.message}`).join("; "), issues: result.issues }];
      log("INFO", "standard", `制作标准 v${result.version} 已保存${result.active ? "并生效" : ""}`);
      save();
      return [201, { standard: result }];
    }
    if (method === "POST" && key === "/api/standards/activate") {
      const body = JSON.parse(opts.body || "{}");
      const standard = activateStandard(body.version_id);
      if (!standard) return [400, { error: "制作标准校验失败",
        message: `制作标准版本不存在: ${body.version_id}`, issues: [] }];
      log("INFO", "standard", `制作标准 v${standard.version} 已激活`);
      save();
      return [200, { standard }];
    }
    if (method === "POST" && key === "/api/standards/reset") {
      const body = JSON.parse(opts.body || "{}");
      const standard = saveStandardVersion(clone(window.__DEFAULT_STANDARD__),
        body.change_note || "恢复 SK 五维漫剧 V5 官方标准", true, null);
      log("INFO", "standard", `制作标准已恢复为官方标准 v${standard.version}`);
      save();
      return [201, { standard }];
    }
    if (method === "POST" && key === "/api/standards/import") {
      const body = JSON.parse(opts.body || "{}");
      const bundle = body.bundle;
      if (!bundle || typeof bundle !== "object")
        return [400, { error: "缺少 bundle 标准包" }];
      if (bundle.schema && bundle.schema !== STANDARD_SCHEMA)
        return [400, { error: "制作标准校验失败",
          message: "schema: 不支持的制作标准包版本",
          issues: [{ path: "schema", message: "不支持的制作标准包版本" }] }];
      const source = bundle.standard || bundle;
      const content = source.content || (bundle.standard ? null : bundle);
      if (!content || typeof content !== "object")
        return [400, { error: "制作标准校验失败",
          message: "standard.content: 缺少制作标准内容",
          issues: [{ path: "standard.content", message: "缺少制作标准内容" }] }];
      if (typeof source.fingerprint === "string" &&
          source.fingerprint.startsWith("demo-") &&
          source.fingerprint !== demoFingerprint(content))
        return [400, { error: "制作标准校验失败",
          message: "standard.fingerprint: 指纹不匹配，导入包可能已损坏或被篡改",
          issues: [{ path: "standard.fingerprint",
            message: "指纹不匹配，导入包可能已损坏或被篡改" }] }];
      const standard = saveStandardVersion(content,
        body.change_note || "导入制作标准", body.activate !== false, null);
      if (standard.error) return [400, { error: standard.error,
        message: standard.issues.map((item) =>
          `${item.path}: ${item.message}`).join("; "), issues: standard.issues }];
      log("INFO", "standard", `已导入制作标准 v${standard.version}`);
      save();
      return [201, { standard }];
    }
    if (opts && opts.method === "POST" && key === "/api/produce") {
      const body = JSON.parse(opts.body || "{}");
      let title = body.title,
        number = body.episode ? parseInt(body.episode, 10) : null;
      let note = "";
      if (body.sentence || !(title && number)) {
        const r = resolveTarget(body.sentence || "", title || null, number);
        if (r.error) return [400, { error: r.error }];
        title = r.title; number = r.number; note = r.note;
      }
      let provided = null;
      if (body.script_text && body.script_text.trim()) {
        try {
          const text = body.script_text.trim();
          provided = text.startsWith("{")
            ? JSON.parse(text)
            : parseTextScript(text, title, number);
        } catch (e) {
          return [400, { error: `剧本解析失败:${e.message}` }];
        }
      }
      const review = body.review === undefined ? true : !!body.review;
      const jobId = startProduce(
        title, number, body.premise || "", !!body.force, provided, review,
        body.kind || "");
      return [202, { job_id: jobId || "cached", title, episode: number,
        note }];
    }
    if (opts && opts.method === "POST" && key === "/api/project/rename") {
      const body = JSON.parse(opts.body || "{}");
      const project = state.projects.find(
        (p) => p.title === body.title ||
          (body.project_id && p.id === parseInt(body.project_id, 10)));
      const next = (body.new_title || "").trim();
      if (!project)
        return [400, { error: `项目不存在: ${body.title || ""}` }];
      if (!next) return [400, { error: "新名字不能为空" }];
      if (next !== project.title &&
          state.projects.some((p) => p.title === next))
        return [400, { error: `已存在同名项目: ${next}` }];
      const old = project.title;
      project.title = next;
      state.episodes.forEach((e) => {
        if (e.project_id === project.id) e.project = next;
      });
      for (const store of [state.payloads, state.fullResults])
        for (const pl of Object.values(store || {}))
          if (pl && pl.project && pl.project.id === project.id)
            pl.project.title = next;
      log("INFO", "project", `项目改名:《${old}》 → 《${next}》`);
      save();
      return [200, { ...project }];
    }
    if (key.startsWith("/api/doctor")) {
      const view = settingsView();
      const caps = Object.entries(state.config.routing).map(
        ([cap, chain]) => {
          let chosen = "mock", detail = "内置模拟";
          if (cap === "voice") {
            const carried = (state.config.routing.video || []).find((name) => {
              const conf = state.config.providers[name];
              return conf && conf.enabled && conf.audio_in_video === true &&
                MODE_CN[conf.type] === "API" && !!conf.api_key;
            });
            if (carried) {
              chosen = carried;
              detail = "Seedance2 随视频生成对白与口型，无需独立 TTS";
            }
          }
          for (const n of chosen === "mock" ? chain : []) {
            const c = state.config.providers[n];
            if (!c || !c.enabled) continue;
            if (c.type === "mock") { chosen = n; break; }
            if (MODE_CN[c.type] === "API" && c.api_key) {
              chosen = n; detail = "API 已配置(真实调用)"; break;
            }
            // CLI 在浏览器演示中不可用 → 看下一个
          }
          const real = chosen !== "mock";
          return { capability: cap,
            label: view.capabilities[cap] || cap,
            provider: chosen,
            provider_label: (state.config.providers[chosen] || {}).label
              || chosen,
            real, detail,
            hint: real ? null
              : "在 ⚙️ 设置里配 API Key(浏览器演示无法调 CLI)" };
        });
      return [200, { capabilities: caps, providers: [],
        real_count: caps.filter((c) => c.real).length,
        total: caps.length, pinged: false }];
    }
    if (opts && opts.method === "POST" && key === "/api/settings/detect")
      return [400, { error: "浏览器演示无法扫描本机 CLI;本机正式版的" +
        "启动脚本会自动检测(install_aifos.sh / start_aifos.command)" }];
    if (key === "/api/settings" && (!opts || opts.method !== "POST"))
      return [200, settingsView()];
    if (opts && opts.method === "POST" && key === "/api/settings") {
      const body = JSON.parse(opts.body || "{}");
      if (body.provider) {
        const conf = state.config.providers[body.provider];
        if (!conf) return [400, { error: `未知 Provider: ${body.provider}` }];
        const fields = body.fields || {};
        for (const [k, v] of Object.entries(fields)) {
          if (k === "api_key") {
            if (v && !String(v).startsWith("****"))
              conf.api_key = String(v).trim();
          } else if (k === "enabled") {
            conf.enabled = !!v;
          } else if (["command", "endpoint", "model", "model_version",
                      "appid", "voice_type"].includes(k)) {
            conf[k] = String(v).trim();
          }
        }
        // 填了 Key 即自动启用(与正式版一致)
        if (fields.api_key && fields.enabled === undefined)
          conf.enabled = true;
      } else if (body.capability) {
        let chain = body.chain || [];
        if (typeof chain === "string")
          chain = chain.split(",").map((s) => s.trim()).filter(Boolean);
        if (!state.config.routing[body.capability])
          return [400, { error: `未知能力: ${body.capability}` }];
        if (!chain.length) return [400, { error: "路由链不能为空" }];
        const unknown = chain.filter((n) => !state.config.providers[n]);
        if (unknown.length)
          return [400, { error: `未知 Provider: ${unknown.join(", ")}` }];
        state.config.routing[body.capability] = chain;
      } else {
        return [400, { error: "缺少 provider 或 capability" }];
      }
      save();
      return [200, settingsView()];
    }
    if (opts && opts.method === "POST" && key === "/api/settings/test") {
      const body = JSON.parse(opts.body || "{}");
      const conf = state.config.providers[body.provider];
      if (!conf) return [400, { error: `未知 Provider: ${body.provider}` }];
      const results = providerChecks(body.provider, conf);
      let ok = results.every((r) => r.ok);
      let extra = null;
      // 配好 Key 的 API Provider:从浏览器发真实请求验证
      if (conf.enabled && conf.api_key) {
        try {
          if (conf.type === "claude_api") {
            await claudeMessages(conf, "ping", 8);
            ok = true;
            extra = "✓ 真实连通成功:剧本将由 Claude API 实际生成";
          } else if (conf.type === "image_api") {
            const r = await realFetch(
              endpointOf(conf, "https://api.openai.com") + "/v1/models",
              { headers: { authorization: `Bearer ${conf.api_key}` } });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            ok = true;
            extra = "✓ 真实连通成功:人物/场景图将由出图 API 实际生成";
          } else if (conf.type === "ark_video" || conf.type === "api") {
            await realFetch(endpointOf(conf, "https://example.com"),
              { method: "GET", mode: "no-cors" });
            extra = "✓ 端点可达;视频生成需在本机正式版执行" +
              "(浏览器无法回传 mp4 大文件)";
          }
        } catch (e) {
          ok = false;
          extra = `✗ 浏览器直连失败:${e.message}。${SANDBOX_HINT}`;
        }
      }
      return [200, { provider: body.provider, ok, results, extra }];
    }
    if (opts && opts.method === "POST" && key === "/api/revise") {
      const body = JSON.parse(opts.body || "{}");
      const ep = state.episodes.find(
        (e) => e.id === parseInt(body.episode_id, 10));
      if (!ep) return [404, { error: "剧集不存在" }];
      const project = state.projects.find((p) => p.id === ep.project_id);
      const jobId = startProduce(
        project.title, ep.number,
        `${ep.premise || ""} ${body.feedback || ""}`.trim(),
        true, null, true, project.kind);
      log("INFO", "director", `按意见重写剧本:${body.feedback}`);
      return [202, { job_id: jobId }];
    }
    if (opts && opts.method === "POST" && key === "/api/regen_image") {
      const body = JSON.parse(opts.body || "{}");
      const id = parseInt(body.episode_id, 10);
      const pl = state.payloads[id];
      if (!pl) return [404, { error: "剧集不存在" }];
      const project = state.projects.find(
        (p) => p.id === pl.episode.project_id);
      const [w, h] = DIMS[project.aspect || "9:16"] || DIMS["9:16"];
      state.bump = (state.bump || 0) + 1;
      const target = body.target || {};
      const s2 = hash(`${body.feedback || ""}#${state.bump}#${target.kind}`);
      const full = state.fullResults[id];
      const each = (fn) => { fn(pl); if (full) fn(full); };
      // 配好出图 API → 单张真实重画(附修改意见),失败任务报错不装死
      const imgConf = apiConf("image_api");
      if (imgConf) {
        const style = project.style || "国风漫剧";
        let prompt = null, apply = null;
        if (target.kind === "character_art") {
          const role = (pl.script.characters.find(
            (c) => c.name === target.name) || {}).role || "主角";
          prompt = `角色立绘:${target.name}(${role}),${style},全身,正面`;
          apply = (url) => each((p) => {
            const item = (p.artifacts.cast_art || []).find(
              (c) => c.name === target.name);
            if (item) item.url = url;
          });
        } else if (target.kind === "scene_art") {
          prompt = `场景概念图:${target.name},${style},空镜,氛围感`;
          apply = (url) => each((p) => {
            const item = (p.artifacts.scene_art || []).find(
              (c) => c.name === target.name);
            if (item) item.url = url;
          });
        } else if (target.kind === "shot") {
          const shot = pl.storyboard.shots.find(
            (s) => s.shot_no === target.shot_no);
          if (!shot) return [404, { error: "镜头不存在" }];
          prompt = shot.prompt;
          apply = (url) => each((p) => {
            p.artifacts.images[shot.shot_no] = url;
            p.artifacts.first[shot.shot_no] = url;
            p.artifacts.last[shot.shot_no] = url;
          });
        }
        if (prompt) {
          if (body.feedback)
            prompt += `。修改意见(必须落实):${body.feedback}`;
          jobSeq += 1;
          const jid = `j${jobSeq}`;
          jobs[jid] = { id: jid, status: "running", title: project.title,
            episode: pl.episode.number, started_at: Date.now() / 1000 };
          (async () => {
            try {
              const url = await realImage(
                imgConf, prompt, project.aspect || "9:16");
              apply(url);
              save();
              jobs[jid].status = "done";
              log("INFO", "router",
                `出图 API 已真实重画 ${target.kind}` +
                `(意见:${body.feedback || "无"})`);
            } catch (e) {
              jobs[jid].status = "failed";
              jobs[jid].error =
                `出图 API 调用失败:${e.message}。${SANDBOX_HINT}`;
              log("WARN", "router", jobs[jid].error);
            }
          })();
          return [202, { job_id: jid }];
        }
      }
      if (target.kind === "character_art") {
        const role = (pl.script.characters.find(
          (c) => c.name === target.name) || {}).role || "";
        const url = cinematicPortrait(w, h, s2, target.name, role);
        each((p) => {
          const item = p.artifacts.cast_art.find(
            (c) => c.name === target.name);
          if (item) item.url = url;
        });
      } else if (target.kind === "scene_art") {
        const url = cinematicShot(w, h, s2, target.name, null, null,
          0, "", "", "key");
        each((p) => {
          const item = p.artifacts.scene_art.find(
            (c) => c.name === target.name);
          if (item) item.url = url;
        });
      } else if (target.kind === "shot") {
        const shot = pl.storyboard.shots.find(
          (s) => s.shot_no === target.shot_no);
        if (!shot) return [404, { error: "镜头不存在" }];
        const loc = (pl.script.scenes.find(
          (sc) => sc.scene_no === shot.scene_no) || {}).location || "";
        each((p) => {
          p.artifacts.images[shot.shot_no] = cinematicShot(
            w, h, s2, loc, shot.characters, shot.dialogue,
            shot.shot_no, shot.camera, shot.description, "key");
          p.artifacts.first[shot.shot_no] = cinematicShot(
            w, h, s2, loc, shot.characters, shot.dialogue,
            shot.shot_no, shot.camera, shot.description, "first");
          p.artifacts.last[shot.shot_no] = cinematicShot(
            w, h, s2, loc, shot.characters, shot.dialogue,
            shot.shot_no, shot.camera, shot.description, "last");
        });
      } else {
        return [400, { error: "不支持的重画目标" }];
      }
      jobSeq += 1;
      const jobId = `j${jobSeq}`;
      jobs[jobId] = { id: jobId, status: "done", title: project.title,
        episode: pl.episode.number, started_at: Date.now() / 1000 };
      log("INFO", "director",
        `已重画 ${target.kind}(意见:${body.feedback || "无"})`);
      save();
      return [202, { job_id: jobId }];
    }
    if (opts && opts.method === "POST" && key === "/api/upload") {
      const body = JSON.parse(opts.body || "{}");
      const id = parseInt(body.episode_id, 10);
      const pl = state.payloads[id];
      if (!pl) return [404, { error: "剧集不存在" }];
      const full = state.fullResults[id];
      const ext = (body.filename || "").split(".").pop().toLowerCase();
      const mime = { png: "image/png", jpg: "image/jpeg",
        jpeg: "image/jpeg", webp: "image/webp", svg: "image/svg+xml",
        mp4: "video/mp4" }[ext];
      if (!mime) return [400, { error: `不支持的格式: .${ext}` }];
      const uri = `data:${mime};base64,${body.data_base64 || ""}`;
      const t = body.target || {};
      const each = (fn) => { fn(pl); if (full) fn(full); };
      if (t.kind === "character_art") {
        each((p) => { const i = p.artifacts.cast_art.find(
          (c) => c.name === t.name); if (i) i.url = uri; });
      } else if (t.kind === "scene_art") {
        each((p) => { const i = p.artifacts.scene_art.find(
          (c) => c.name === t.name); if (i) i.url = uri; });
      } else if (t.kind === "shot") {
        each((p) => {
          p.artifacts.images[t.shot_no] = uri;
          p.artifacts.first[t.shot_no] = uri;
          p.artifacts.last[t.shot_no] = uri;
        });
      } else if (t.kind === "shot_video") {
        each((p) => { p.artifacts.videos[t.shot_no] = uri; });
      } else {
        return [400, { error: "不支持的上传目标" }];
      }
      log("INFO", "director", `已上传替换 ${t.kind}`);
      save();
      return [200, { uri: "uploaded" }];
    }
    if (opts && opts.method === "POST" && key === "/api/confirm") {
      const body = JSON.parse(opts.body || "{}");
      const jobId = confirmProduce(parseInt(body.episode_id, 10));
      if (!jobId) return [404, { error: "剧集不存在或无待确认内容" }];
      return [202, { job_id: jobId }];
    }
    if (key === "/api/overview") return [200, overview()];
    let m = /^\/api\/episode\/(\d+)$/.exec(key);
    if (m) {
      const id = parseInt(m[1], 10);
      const payload = state.payloads[id];
      if (payload) {
        const ep = state.episodes.find((e) => e.id === id);
        payload.episode = { ...ep };
        return [200, payload];
      }
      const ep = state.episodes.find((e) => e.id === id);
      if (ep) return [200, { episode: { ...ep },
        project: state.projects.find((p) => p.id === ep.project_id),
        tasks: [], script: null, storyboard: null, qc_report: null,
        artifacts: { images: {}, first: {}, last: {}, videos: {}, voices: {},
          cover: null, final: null, titles: [], clips: [] } }];
      return [404, { error: "剧集不存在" }];
    }
    if (key.startsWith("/api/logs"))
      return [200, state.logs.slice(-30).reverse()];
    if (key === "/api/jobs") return [200, Object.values(jobs)];
    m = /^\/api\/jobs\/(\w+)$/.exec(key);
    if (m) return jobs[m[1]] ? [200, jobs[m[1]]] : [404, { error: "任务不存在" }];
    return [404, { error: "演示模式无此数据" }];
  }

  /* ---- 浏览器内 zip 打包(存储式)与成品包导出 ---- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n += 1) {
      let c = n;
      for (let k = 0; k < 8; k += 1)
        c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i += 1)
      c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const te = new TextEncoder();
  function buildZip(entries) {
    const chunks = [], central = [];
    let offset = 0;
    const num = (n, len) => {
      const a = new Uint8Array(len);
      for (let i = 0; i < len; i += 1) a[i] = (n >>> (8 * i)) & 0xff;
      return a;
    };
    for (const { name, data } of entries) {
      const nameB = te.encode(name);
      const crc = crc32(data);
      const local = [num(0x04034b50, 4), num(20, 2), num(0x0800, 2),
        num(0, 2), num(0, 2), num(0, 2), num(crc, 4),
        num(data.length, 4), num(data.length, 4),
        num(nameB.length, 2), num(0, 2), nameB, data];
      central.push({ nameB, crc, size: data.length, offset });
      for (const part of local) { chunks.push(part); offset += part.length; }
    }
    const cdStart = offset;
    for (const e of central) {
      const rec = [num(0x02014b50, 4), num(20, 2), num(20, 2),
        num(0x0800, 2), num(0, 2), num(0, 2), num(0, 2), num(e.crc, 4),
        num(e.size, 4), num(e.size, 4), num(e.nameB.length, 2),
        num(0, 2), num(0, 2), num(0, 2), num(0, 2), num(0, 4),
        num(e.offset, 4), e.nameB];
      for (const part of rec) { chunks.push(part); offset += part.length; }
    }
    chunks.push(num(0x06054b50, 4), num(0, 2), num(0, 2),
      num(central.length, 2), num(central.length, 2),
      num(offset - cdStart, 4), num(cdStart, 4), num(0, 2));
    return new Blob(chunks, { type: "application/zip" });
  }
  function dataUriBytes(uri) {
    const b64 = (uri.split(",")[1] || "");
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
    return out;
  }
  const EXT_BY_MIME = { "image/svg+xml": ".svg", "image/png": ".png",
    "image/jpeg": ".jpg", "video/mp4": ".mp4",
    "application/json": ".json", "audio/wav": ".wav" };
  function extOf(uri) {
    const mime = (uri.split(";")[0] || "").replace("data:", "");
    return EXT_BY_MIME[mime] || ".bin";
  }
  function scriptText(script) {
    return script.scenes.map((s) => {
      const rows = [`第${s.scene_no}场 ${s.location}`];
      if (s.action) rows.push(s.action);
      (s.lines || []).forEach((l) => rows.push(`${l.character}:${l.dialogue}`));
      return rows.join("\n");
    }).join("\n\n");
  }
  function exportZipBlob(id) {
    const pl = state.payloads[id];
    if (!pl) return null;
    const art = pl.artifacts;
    const entries = [];
    const addText = (name, text) => entries.push({ name, data: te.encode(text) });
    const addUri = (name, uri) => {
      if (uri) entries.push({ name: name + extOf(uri), data: dataUriBytes(uri) });
    };
    addText("剧本.txt", scriptText(pl.script));
    addText("连续性档案.json", JSON.stringify(pl.continuity || {}, null, 2));
    addText("五维分镜.json", JSON.stringify(pl.storyboard || {}, null, 2));
    addText("文字资产清单.json", JSON.stringify(pl.text_assets || {}, null, 2));
    addText("开拍门禁.json", JSON.stringify(pl.preflight || {}, null, 2));
    addText("逐段内容复核.json", JSON.stringify(pl.content_review || {}, null, 2));
    addText("交付复核结果.json", JSON.stringify(
      pl.qc_report?.delivery_check || {}, null, 2));
    const full = state.fullResults[id] || {};
    addText("标题与话题.txt", ["【候选标题】", ...(art.titles || []), "",
      "【话题标签】", (full.hashtags || []).join(" ")].join("\n"));
    Object.entries(art.images).forEach(([n, u]) => addUri(`画面/shot_${n}`, u));
    Object.entries(art.videos).forEach(([n, u]) => addUri(`视频/shot_${n}`, u));
    Object.entries(art.voices).forEach(([n, u]) => addUri(`配音/line_${n}`, u));
    (art.cast_art || []).forEach((c) => addUri(`人物设定/${c.name}`, c.url));
    (art.scene_art || []).forEach((s) => addUri(`场景设定/${s.name}`, s.url));
    addUri("封面", art.cover);
    addUri("成片", art.final);
    return buildZip(entries);
  }

  load();
  window.fetch = async (path, opts) => {
    // 外部地址(真实 API 直连)放行给浏览器原生 fetch
    if (typeof path !== "string" || /^https?:\/\//i.test(path))
      return realFetch(path, opts);
    const exportMatch = /^\/api\/export\/(\d+)$/.exec(path.split("#")[0]);
    if (exportMatch) {
      const blob = exportZipBlob(parseInt(exportMatch[1], 10));
      if (!blob) return { ok: false, status: 404,
        json: async () => ({ error: "剧集不存在" }) };
      return { ok: true, status: 200, blob: async () => blob,
        json: async () => ({}) };
    }
    const [status, data] = await route(path, opts);
    return { ok: status < 400, status,
      json: async () => JSON.parse(JSON.stringify(data)) };
  };
  window.__DEMO_RESET__ = () => {
    localStorage.removeItem(KEY); localStorage.removeItem(LEGACY_KEY); location.reload();
  };
  const resetLink = document.getElementById("demo-reset");
  if (resetLink) resetLink.onclick = window.__DEMO_RESET__;
})();

</script>

const durationText = (seconds) => {
  const value = Math.max(0, Number(seconds) || 0);
  if (value < 60) return `${Math.round(value)} 秒`;
  if (value < 3600) return `${Math.floor(value / 60)} 分 ${Math.round(value % 60)} 秒`;

/* 服务自动更新后 build 变化 → 页面自动刷新,用户零操作 */
let appBuild = null;
function watchBuild(data) {
  if (!data || !data.build) return;
  if (appBuild === null) { appBuild = data.build; return; }
  if (appBuild !== data.build) {
    showToast("平台已自动更新到新版本,页面即将自动刷新…", "ok");
    setTimeout(() => location.reload(), 1500);
    appBuild = data.build;
  }
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(data.message || data.error || `HTTP ${res.status}`);
    error.details = data;
    throw error;
  }
  return data;
}

/* 页面内置提示(不用 alert/confirm——沙箱环境会静默拦截弹窗) */
function showToast(message, kind = "info") {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const toast = document.createElement("div");
  toast.className = `toast ${kind}`;
  toast.setAttribute("role", kind === "error" ? "alert" : "status");
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (_) {
    const input = document.createElement("textarea");
    input.value = text;
    input.setAttribute("readonly", "");
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();
  }
}

/* 二次点击确认:第一次点击进入待确认态,3 秒内再点执行 */
function armConfirm(btn, label, action) {
  if (btn.dataset.armed === "1") {
    btn.dataset.armed = "";
    btn.textContent = btn.dataset.original;
    action();
    return;
  }
  btn.dataset.armed = "1";
  btn.dataset.original = btn.textContent;
  btn.textContent = `再点一次确认${label}`;
  setTimeout(() => {
    if (btn.dataset.armed === "1") {
      btn.dataset.armed = "";
      btn.textContent = btn.dataset.original;
    }
  }, 3000);
}

/* ---------- 路由 ---------- */
function route() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (typeof liveTicker !== "undefined" && liveTicker) {
    clearInterval(liveTicker); liveTicker = null;
  }
  const standards = location.hash.match(/^#\/standards(?:\/([a-z_]+))?$/);
  const history = location.hash.match(/^#\/history(?:\/(\d+))?$/);
  const m = location.hash.match(/^#\/episode\/(\d+)$/);
  const settings = location.hash === "#/settings";
  const assets = location.hash === "#/assets";
  const area = standards ? "standards" : history ? "history"
    : settings ? "settings" : assets ? "assets" : "dashboard";
  document.querySelectorAll(".main-nav a").forEach((link) => {
    const active = link.dataset.nav === area;
    link.classList.toggle("active", active);
    if (active) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
  if (standards) renderStandards(standards[1] || "production");
  else if (history) renderHistory(history[1] ? Number(history[1]) : null);
  else if (m) renderCanvasView(Number(m[1]));
  else if (settings) renderSettings();
  else if (assets) renderAssetsCenter();
  else renderDashboard();
}
