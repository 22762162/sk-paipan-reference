<title>AIFOS V3.0 · 漫剧生产控制台演示</title>
<style>
/* AIFOS 控制台 · 深色工作室主题
   色板:经 dataviz 校验的深色面板参考值
   surface #1a1a19 / page #0d0d0d / 主文字 #fff / 次要 #c3c2b7 / 弱化 #898781
   系列蓝(深色面)#3987e5;状态色 good/warning/serious/critical 固定,
   永远与图标或文字并用,不单靠颜色传义。 */

:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232322;
  --surface-3: #2c2c2a;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --hairline: rgba(255, 255, 255, 0.10);
  --grid: #2c2c2a;
  --accent: #3987e5;
  --accent-soft: rgba(57, 135, 229, 0.16);
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font-family: inherit; font-size: 13px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 7px 14px; cursor: pointer;
}
button:hover { background: var(--surface-3); }
button.primary { background: var(--accent); border-color: transparent; }
button.primary:hover { filter: brightness(1.1); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select {
  font-family: inherit; font-size: 14px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 12px;
}
input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

/* ---- 顶栏 ---- */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px; flex: none;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
}
.brand { display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark { font-weight: 700; font-size: 17px; letter-spacing: .06em; }
.brand-sub { color: var(--ink-3); font-size: 12px; }
#topbar-right { display: flex; gap: 10px; align-items: center; color: var(--ink-3); font-size: 12px; }

#app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.loading { padding: 48px; color: var(--ink-3); text-align: center; }

/* ---- 仪表盘 ---- */
.dash { padding: 20px; overflow-y: auto; display: grid; gap: 16px; }

.produce-bar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.produce-bar input[name="sentence"] { flex: 2 1 320px; }
.produce-bar input[name="premise"] { flex: 1 1 200px; }
.produce-bar textarea {
  width: 100%; font-family: inherit; font-size: 13px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 12px; resize: vertical;
}
.produce-bar textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.produce-hint { width: 100%; color: var(--ink-3); font-size: 12px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.tile .label { color: var(--ink-3); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
.tile .value small { font-size: 13px; color: var(--ink-3); font-weight: 400; }

.panel {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px;
}
.panel h2 {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  margin-bottom: 12px; letter-spacing: .04em;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }

/* 状态徽章:颜色 + 文字,不单靠颜色 */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: var(--surface-3); color: var(--ink-2);
  white-space: nowrap;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.chip.done { color: #7fd97f; } .chip.done::before { background: var(--good); }
.chip.running { color: #ffd77a; } .chip.running::before { background: var(--warning); animation: pulse 1.2s infinite; }
.chip.qc_failed { color: #ffb598; } .chip.qc_failed::before { background: var(--serious); }
.chip.failed { color: #ff9d9d; } .chip.failed::before { background: var(--critical); }
.chip.awaiting_confirm { color: #ffd77a; } .chip.awaiting_confirm::before { background: var(--warning); }
@keyframes pulse { 50% { opacity: .3; } }

/* 成本条:单色蓝阶(数量级编码) */
.bar-row { display: grid; grid-template-columns: 110px 1fr 74px; gap: 10px; align-items: center; padding: 4px 0; }
.bar-row .name { color: var(--ink-2); font-size: 12px; }
.bar-row .val { text-align: right; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar-track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px 4px 4px 4px; min-width: 2px; }

.asset-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.asset-chips .chip { background: var(--surface-2); }

.log-list { max-height: 220px; overflow-y: auto; font-size: 12px; color: var(--ink-2); }
.log-list div { padding: 3px 0; border-bottom: 1px solid var(--grid); }
.log-list .lv-WARN { color: var(--warning); }
.log-list .lv-ERROR { color: var(--critical); }

.empty { color: var(--ink-3); padding: 12px 0; }

/* ---- 画布视图 ---- */
.canvas-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.canvas-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--hairline); flex: none;
}
.canvas-toolbar .title { font-weight: 650; font-size: 15px; }
.canvas-toolbar .spacer { flex: 1; }
.canvas-toolbar .hint { color: var(--ink-3); font-size: 12px; }
.zoom-group { display: flex; gap: 4px; }
.zoom-group button { padding: 5px 10px; font-size: 12px; }
.zoom-pct { min-width: 48px; text-align: center; color: var(--ink-2); font-size: 12px; align-self: center; }

.canvas-body { flex: 1; min-height: 0; display: flex; }
#viewport {
  flex: 1; position: relative; overflow: hidden; cursor: grab;
  background-color: var(--page);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
#viewport.panning { cursor: grabbing; }
#world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.lane-label {
  position: absolute; width: 118px;
  color: var(--ink-2); font-size: 12px;
  padding: 8px 10px; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: 8px;
}
.lane-label .loc { color: var(--ink); font-weight: 600; display: block; }

.shot-card {
  position: absolute; width: 220px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); overflow: hidden;
  cursor: pointer; user-select: none;
  transition: box-shadow .12s;
}
.shot-card:hover { box-shadow: 0 0 0 2px var(--accent-soft); }
.shot-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.shot-card img { width: 100%; height: 124px; object-fit: cover; display: block; background: var(--surface-2); pointer-events: none; }
.shot-card .no-img { width: 100%; height: 124px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); background: var(--surface-2); font-size: 12px; }
.shot-card .body { padding: 8px 10px 10px; }
.shot-card .head { display: flex; justify-content: space-between; align-items: baseline; }
.shot-card .sn { font-weight: 700; font-size: 13px; }
.shot-card .dur { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.shot-card .desc {
  color: var(--ink-2); font-size: 12px; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 2.9em;
}
.badges { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.badge {
  font-size: 11px; padding: 1px 7px; border-radius: 5px;
  background: var(--surface-2); color: var(--ink-3);
  border: 1px solid var(--grid);
}
.badge.ok { color: #7fd97f; border-color: rgba(12,163,12,.35); }
.badge.miss { color: #ff9d9d; border-color: rgba(208,59,59,.4); }
.badge.qc { color: #ffb598; border-color: rgba(236,131,90,.4); }

/* 时间轴拆条 */
.timeline {
  display: flex; gap: 2px; padding: 8px 16px; flex: none;
  background: var(--surface); border-top: 1px solid var(--hairline);
  align-items: stretch; height: 46px;
}
.tl-seg {
  border-radius: 5px; background: var(--accent-soft);
  border: 1px solid rgba(57,135,229,.35);
  color: var(--ink-2); font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden; white-space: nowrap;
}
.tl-seg:hover { background: rgba(57,135,229,.3); }

/* 侧栏 */
#sidepanel {
  width: 360px; flex: none; overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--hairline);
  padding: 16px;
}
#sidepanel h3 { font-size: 15px; margin-bottom: 8px; }
#sidepanel h4 { font-size: 12px; color: var(--ink-3); margin: 14px 0 6px; font-weight: 600; letter-spacing: .04em; }
#sidepanel img.preview { width: 100%; border-radius: 8px; border: 1px solid var(--hairline); display: block; }
#sidepanel .thumbs { display: flex; gap: 8px; }
#sidepanel .thumbs figure { flex: 1; }
#sidepanel .thumbs img { width: 100%; border-radius: 6px; border: 1px solid var(--hairline); display: block; }
#sidepanel .thumbs figcaption { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 3px; }
#sidepanel .prompt {
  background: var(--surface-2); border-radius: 8px; padding: 10px;
  font-size: 12px; color: var(--ink-2); word-break: break-all;
}
#sidepanel ul.links { list-style: none; font-size: 13px; }
#sidepanel ul.links li { padding: 5px 0; border-bottom: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 8px; }
#sidepanel ul.links li span:first-child { color: var(--ink-2); }
.issue { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; background: var(--surface-2); }
.issue.error { border-left: 3px solid var(--critical); }
.issue.warn { border-left: 3px solid var(--warning); }
.stage-list { list-style: none; }
.stage-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px;
}
.stage-list .cost { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.dialogue { background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: 13px; }
.dialogue b { color: var(--accent); }

.titles-list { list-style: none; }
.titles-list li { padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }

@media (max-width: 860px) {
  #sidepanel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.5); }
}

/* 开工向导 */
.kind-tabs { display: flex; gap: 8px; width: 100%; align-items: center; flex-wrap: wrap; }
.kind-label { color: var(--ink-3); font-size: 12px; }
.kind-tab {
  padding: 6px 14px; font-size: 13px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--hairline);
}
.kind-tab.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe4ff; }
.mode-tabs { display: flex; gap: 8px; width: 100%; }
.mode-tab {
  flex: 1; padding: 10px 14px; font-size: 14px;
  background: var(--surface-2); border: 1px solid var(--hairline);
}
.mode-tab.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe4ff; }
.produce-bar button.primary { font-size: 15px; padding: 10px 26px; }

/* 制作进度条 */
.progress-card {
  background: var(--surface); border: 1px solid rgba(250, 178, 25, .4);
  border-radius: var(--radius); padding: 14px 16px;
}
.progress-text { font-size: 14px; margin-bottom: 10px; }
.progress-text span { color: var(--ink-2); margin-left: 10px; font-size: 13px; }
.progress-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.progress-fill {
  height: 100%; background: var(--warning); border-radius: 5px;
  transition: width .6s ease;
}

/* 剧场模式(影视站观感) */
#theater { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }
.view-toggle button.active {
  background: var(--accent-soft); border-color: var(--accent); color: #cfe4ff;
}
.hero {
  position: relative; min-height: 320px;
  background-size: cover; background-position: center 20%;
  display: flex; align-items: flex-end;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(13,13,13,.25) 0%,
    rgba(13,13,13,.55) 55%, var(--page) 96%);
}
.hero-content { position: relative; z-index: 1; padding: 30px 28px 22px; max-width: 720px; }
.hero-content h1 { font-size: 32px; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.hero-meta .chip { background: rgba(0,0,0,.45); }
.hero-logline {
  color: var(--ink-2); font-size: 14px; margin-bottom: 14px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hero-actions { display: flex; gap: 10px; }
.hero-actions .primary { font-size: 15px; padding: 11px 26px; }
.cast-strip {
  display: flex; gap: 16px; padding: 14px 28px 4px; overflow-x: auto;
}
.cast-strip figure { margin: 0; text-align: center; flex: none; }
.cast-strip img {
  width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--hairline); display: block; margin: 0 auto;
  background: var(--surface-2);
}
.cast-strip figure:hover img { border-color: var(--accent); }
.cast-strip figcaption { font-size: 11px; color: var(--ink-2); margin-top: 4px; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scene-row { padding: 12px 28px 4px; }
.scene-row h3 { font-size: 15px; margin-bottom: 10px; }
.scene-row h3 span { color: var(--ink-3); font-size: 12px; font-weight: 400; margin-left: 10px; }
.row-scroll {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 6px 4px 18px; scroll-snap-type: x proximity;
}
.t-card {
  flex: 0 0 150px; position: relative; border-radius: 10px; overflow: hidden;
  cursor: pointer; scroll-snap-align: start; background: #000;
  border: 1px solid var(--hairline);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
}
.t-card.landscape { flex-basis: 260px; }
.t-card img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; }
.t-card.landscape img { aspect-ratio: 16 / 9; }
.t-empty {
  width: 100%; aspect-ratio: 9 / 16; display: flex; align-items: center;
  justify-content: center; color: var(--ink-3); font-size: 12px;
  background: var(--surface-2);
}
.t-card:hover {
  transform: scale(1.07); z-index: 2;
  box-shadow: 0 10px 32px rgba(0, 0, 0, .65);
  border-color: var(--accent);
}
.t-info {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 9px 8px;
  background: linear-gradient(transparent, rgba(0,0,0,.88));
  font-size: 11px; color: var(--ink-2); pointer-events: none;
}
.t-info b { color: #fff; }
.t-line {
  color: #fff; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.t-play {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(57, 135, 229, .92); color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s; pointer-events: none;
}
.t-card:hover .t-play { opacity: 1; }
.t-detail {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: 26px; height: 26px; border-radius: 50%; padding: 0;
  font-size: 13px; background: rgba(0,0,0,.55); border-color: transparent;
  opacity: 0; transition: opacity .15s;
}
.t-card:hover .t-detail { opacity: 1; }

/* 确认横幅与人物/场景画廊 */
.confirm-banner {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: rgba(250, 178, 25, .1);
  border-bottom: 1px solid rgba(250, 178, 25, .4);
  padding: 12px 18px; flex: none;
}
.confirm-banner b { display: block; margin-bottom: 2px; }
.confirm-banner span { color: var(--ink-2); font-size: 13px; }
.confirm-banner > div { flex: 1; min-width: 260px; }
.confirm-banner button { font-size: 15px; padding: 11px 22px; white-space: nowrap; }
.progress-card.confirm {
  border-color: rgba(250, 178, 25, .5);
  display: flex; align-items: center; gap: 14px;
}
.progress-card.confirm .progress-text { flex: 1; margin: 0; }
.art-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.art-grid figure { margin: 0; }
.art-grid img {
  width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--hairline); display: block;
}
.art-grid figcaption {
  font-size: 11px; color: var(--ink-2); text-align: center; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 打磨:剧本重写与图片重画 */
.revise-bar { margin: 12px 0; display: grid; gap: 8px; }
.revise-bar textarea, #edit-area textarea {
  width: 100%; font-family: inherit; font-size: 13px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 12px; resize: vertical;
}
.revise-actions { display: flex; gap: 8px; flex-wrap: wrap; }
#edit-area { display: grid; gap: 8px; margin-bottom: 8px; }
.regen-box { margin-top: 4px; }
.regen-toggle { width: 100%; font-size: 11px; padding: 4px 6px; }
.regen-form { display: flex; gap: 6px; margin-top: 4px; }
.regen-form input {
  flex: 1; min-width: 0; font-size: 11px; padding: 5px 8px;
}
.regen-form button { font-size: 11px; padding: 4px 10px; white-space: nowrap; }
.io-box { display: flex; gap: 6px; margin-top: 4px; }
.io-box button { flex: 1; font-size: 11px; padding: 4px 6px; }
.io-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.io-row > span { color: var(--ink-2); font-size: 12px; width: 34px; flex: none; }
.io-row .io-box { flex: 1; margin: 0; }

/* 整集播放器 */
.player-overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(0, 0, 0, .82);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.player-box {
  width: min(560px, 96vw); max-height: 96vh;
  display: flex; flex-direction: column; gap: 10px;
}
.player-head { display: flex; align-items: center; gap: 12px; color: var(--ink); font-size: 14px; }
.player-head .player-pos { color: var(--ink-3); font-size: 12px; flex: 1; }
.player-stage {
  position: relative; width: 100%; aspect-ratio: 9 / 16;
  max-height: 74vh; background: #000; border-radius: 14px;
  overflow: hidden; border: 1px solid var(--hairline);
  align-self: center;
}
.player-stage img, .player-stage video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; background: #000;
}
#pl-b { opacity: 0; }
#pl-b.fade-in { opacity: 1; transition-property: opacity; transition-timing-function: linear; }
.player-sub {
  position: absolute; left: 6%; right: 6%; bottom: 5%;
  background: rgba(0, 0, 0, .58); border-radius: 10px;
  padding: 10px 14px; font-size: 15px; color: #fff; text-align: center;
}
.player-sub b { color: var(--accent); margin-right: 10px; }
.player-big {

  /* 自带剧本解析(与平台 script_import.py 同构) */
  function parseTextScript(text, title, number) {
    const sceneRe = /^\s*(?:【?第\s*([0-9一二三四五六七八九十百]+)\s*场】?|场景\s*(\d+))[::.\s]*(.*)$/;
    const lineRe = /^\s*([^\s::]{1,12})\s*[::]\s*(.+)$/;
    const scenes = [];
    let current = null;
    const openScene = (loc) => {
      current = { scene_no: scenes.length + 1,
        location: loc || `场景${scenes.length + 1}`,
        characters: [], action: "", lines: [] };
      scenes.push(current);
    };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line) continue;
      const sm = sceneRe.exec(line);
      if (sm) { openScene((sm[3] || "").trim()); continue; }
      if (!current) openScene("主场景");
      const lm = lineRe.exec(line);
      if (lm) current.lines.push({ character: lm[1], dialogue: lm[2].trim() });
      else current.action = current.action ? current.action + " " + line : line;
    }
    const valid = scenes.filter((s) => s.lines.length || s.action);
    if (!valid.some((s) => s.lines.length))
      throw new Error("未能从剧本解析出台词;格式:「角色名:台词」,场次用「第1场 地点」");
    const counts = {};
    valid.forEach((s, i) => {
      s.scene_no = i + 1;
      s.characters = [...new Set(s.lines.map((l) => l.character))].sort();
      s.lines.forEach((l) => { counts[l.character] = (counts[l.character] || 0) + 1; });
    });
    const ordered = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    const firstAction = (valid.find((s) => s.action) || {}).action || "";
    return {
      project_title: title, episode_number: number,
      episode_title: valid[0].location,
      logline: firstAction || valid[0].lines[0].dialogue,
      characters: ordered.map((name, i) => ({
        name, role: i === 0 ? "主角" : "配角" })),
      scenes: valid,
    };
  }

  function buildStoryboard(script, seed) {

          description: `${line.character}说话`, camera: pick(CAMERAS, seed, no),
          duration: 3.0, characters: [line.character], dialogue: line,
          prompt: `漫剧风格,${scene.location},${line.character}正在说:「${line.dialogue}」,镜头:${pick(CAMERAS, seed, no)}`,
        });
      }
    }
    return { episode_title: script.episode_title, shots };
  }

  /* ---- 一集的完整生产 ---- */
  function produceEpisode(project, number, premise, providedScript) {
    const aspect = project.aspect || "9:16";
    const [w, h] = DIMS[aspect] || DIMS["9:16"];
    const seed = hash(`${project.title}#${number}#${premise}`);
    const genre = detectGenre(
      project.title, premise, project.style || "", project.kind);
    const script = providedScript
      || (genre === "idol"
        ? idolScript(project.title, number, premise, seed,
            project.title, project.style)
        : dramaScript(project.title, number, premise, seed, genre));
    const storyboard = buildStoryboard(script, seed);
    const shots = storyboard.shots;

    const locations = {};
    script.scenes.forEach((sc) => { locations[sc.scene_no] = sc.location; });
    const artifacts = { images: {}, first: {}, last: {}, videos: {},
      voices: {}, cover: null, final: null, titles: [], clips: [],
      cast_art: [], scene_art: [] };
    script.characters.forEach((c, i) => {
      artifacts.cast_art.push({
        name: c.name, role: c.role || "",
        url: cinematicPortrait(w, h, hash(`${seed}#p#${c.name}`),
          c.name, c.role || "") });
    });
    [...new Set(script.scenes.map((sc) => sc.location))].forEach((loc) => {
      artifacts.scene_art.push({
        name: loc,
        url: cinematicShot(w, h, hash(`${seed}#s#${loc}`), loc,
          null, null, 0, "", "", "key") });
    });
    for (const s of shots) {
      const sSeed = hash(`${seed}#${s.shot_no}`);
      const loc = locations[s.scene_no] || "";
      artifacts.images[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "key");
      artifacts.first[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "first");
      artifacts.last[s.shot_no] = cinematicShot(
        w, h, sSeed, loc, s.characters, s.dialogue, s.shot_no,
        s.camera, s.description, "last");
      artifacts.videos[s.shot_no] = jsonUri({
        type: "mock-video", shot_no: s.shot_no, duration: s.duration,
        prompt: s.prompt, aspect });
    }
    const voices = [];
    const subtitles = [];
    let lineNo = 0;
    for (const scene of script.scenes) {
      for (const line of scene.lines) {
        lineNo += 1;
        const dur = Math.max(1, Math.round(line.dialogue.length * 18) / 100);
        artifacts.voices[lineNo] = jsonUri({
          type: "mock-voice", line_no: lineNo, character: line.character,
          text: line.dialogue, duration: dur });
        voices.push({ line_no: lineNo, duration: dur });
        subtitles.push({ line_no: lineNo, character: line.character,
          text: line.dialogue });
      }
    }
    const total = Math.round(shots.reduce((a, s) => a + s.duration, 0) * 10) / 10;
    artifacts.final = jsonUri({ type: "mock-final-video",
      total_duration: total, shot_count: shots.length, aspect });
    artifacts.cover = cinematicCover(
      w, h, seed, script.project_title, number, script.logline);
    artifacts.titles = project.kind === "idol"
      ? [`${project.title}第${number}期:${script.episode_title}`,
         script.logline.slice(0, 24),
         `${script.episode_title}|${project.title}的日常`]
      : [`《${project.title}》第${number}集:${script.episode_title}`,
         `${script.characters[0].name}对决${script.characters[2] ? script.characters[2].name : "强敌"},第${number}集高能开场!`,
         `${script.logline.slice(0, 24)}……第${number}集`];
    let t = 0;
    const sceneAgg = new Map();
    for (const s of shots) {
      const e = sceneAgg.get(s.scene_no) || { start: t, duration: 0 };
      e.duration = Math.round((e.duration + s.duration) * 10) / 10;
      sceneAgg.set(s.scene_no, e);
      t = Math.round((t + s.duration) * 10) / 10;
    }
    artifacts.clips = [...sceneAgg.entries()].map(([n, e]) => ({
      scene_no: n,
      url: jsonUri({ scene_no: n, start: e.start, duration: e.duration }) }));

    const perCall = 0.1;
    const stageCosts = {
      script: perCall,
      cast: perCall * (script.characters.length + artifacts.scene_art.length),
      storyboard: perCall,
      images: perCall * shots.length, frames: perCall * shots.length,
      videos: perCall * shots.length, voices: perCall * voices.length,
      edit: perCall, qc: 0, package: perCall, archive: 0,
    };
    const stageNames = { script: "剧本", cast: "人物/场景图",
      storyboard: "分镜", images: "镜头画面", frames: "首尾帧",
      videos: "视频", voices: "配音", edit: "剪映剪辑", qc: "AI质检",
      package: "封面/标题/拆条", archive: "数据沉淀" };
    const tasks = Object.keys(stageCosts).map((stage, i) => ({
      id: i + 1, stage, name: stageNames[stage], status: "done",
      provider: stageCosts[stage] > 0 ? "mock" : "", cost: stageCosts[stage],
      error: "" }));
    const cost = Math.round(Object.values(stageCosts)
      .reduce((a, b) => a + b, 0) * 100) / 100;

    return {
      script, storyboard, artifacts, tasks, cost,
      hashtags: project.kind === "idol"
        ? [`#${project.title}`, "#AI虚拟偶像", "#虚拟偶像", "#日常vlog"]
        : [`#${project.title}`, "#漫剧", "#AI短剧", `#第${number}集`],
      qc_report: { score: 100, passed: true, pass_score: 80, issues: [],
        rerun_shots: [], rerun_lines: [] },
    };
  }

  /* ---- 后台任务:两段式(预生产 → 确认 → 生产) ---- */
  const jobs = {};
  let jobSeq = 0;
  const PHASE1 = ["script", "cast", "storyboard", "images", "frames"];
  const PHASE2 = ["videos", "voices", "edit", "qc", "package", "archive"];

  function phase1Payload(full) {
    const p = JSON.parse(JSON.stringify(full));
    p.artifacts.videos = {};
    p.artifacts.voices = {};
    p.artifacts.final = null;
    p.artifacts.cover = null;
    p.artifacts.titles = [];
    p.artifacts.clips = [];
    p.tasks = p.tasks.filter((t) => PHASE1.includes(t.stage));
    return p;
  }

  function runStages(ep, stages, onDone) {
    let idx = 0;
    const timer = setInterval(() => {
      if (idx < stages.length) {
        ep.status = stages[idx];
        idx += 1;
        return;
      }
      clearInterval(timer);
      onDone();
      save();
    }, 320);
  }

  function startProduce(title, number, premise, force, providedScript,
                        review, kind) {
    let project = state.projects.find((p) => p.title === title);
    if (!project) {
      project = { id: state.projects.length + 1, title,
        kind: kind === "idol" ? "idol" : "drama",
        account: "", aspect: "", style: "", status: "active" };
      state.projects.push(project);
    } else if (kind === "idol" || kind === "drama") {
      project.kind = kind;
    }
    if (providedScript) force = true; // 剧本变了,全量重制
    let ep = state.episodes.find(
      (e) => e.project_id === project.id && e.number === number);
    if (ep && ep.status === "done" && !force && state.payloads[ep.id]) {
      log("INFO", "director", `第${number}集已存在,增量模式直接复用`);
      save();
      return null; // 无需重跑
    }
    if (!ep) {
      ep = { id: state.episodes.length + 1, project_id: project.id,
        number, title: "", premise, status: "created", qc_score: null,
        cost: 0, project: project.title };
      state.episodes.push(ep);
    }
    jobSeq += 1;
    const jobId = `j${jobSeq}`;
    jobs[jobId] = { id: jobId, status: "running", title, episode: number,
      started_at: Date.now() / 1000 };
    log("INFO", "director", `开始制作《${title}》第${number}集(浏览器 Mock 产线)`);

    const result = produceEpisode(project, number, premise || "",
      providedScript || null);
    const full = {
      episode: null, project: { ...project },
      tasks: result.tasks, script: result.script, script_version: 1,
      storyboard: result.storyboard, storyboard_version: 1,
      qc_report: result.qc_report, artifacts: result.artifacts,
      cost: result.cost,
    };
    state.fullResults[ep.id] = full;

    const finishAll = () => {
      ep.status = "done";
      ep.qc_score = result.qc_report.score;
      ep.cost = result.cost;
      ep.title = result.script.episode_title;
      full.episode = { ...ep };
      state.payloads[ep.id] = full;
      jobs[jobId].status = "done";
      jobs[jobId].summary = { status: "done" };
      log("INFO", "director",
        `《${title}》第${number}集 制作完成:质检 100,成本 ${result.cost}`);
    };
    if (review) {
      runStages(ep, PHASE1, () => {
        ep.status = "awaiting_confirm";
        ep.title = result.script.episode_title;
        const pre = phase1Payload(full);
        ep.cost = pre.tasks.reduce((a, t) => a + t.cost, 0);
        pre.episode = { ...ep };
        state.payloads[ep.id] = pre;
        jobs[jobId].status = "done";
        jobs[jobId].summary = { status: "awaiting_confirm" };
        log("INFO", "director",
          `《${title}》第${number}集 预生产完成,等待确认`);
      });
    } else {
      runStages(ep, PHASE1.concat(PHASE2), finishAll);
    }
    save();
    return jobId;
  }

  function confirmProduce(episodeId) {
    const ep = state.episodes.find((e) => e.id === episodeId);
    const full = state.fullResults[episodeId];
    if (!ep || !full) return null;
    jobSeq += 1;
    const jobId = `j${jobSeq}`;
    jobs[jobId] = { id: jobId, status: "running", title: full.project.title,
      episode: ep.number, started_at: Date.now() / 1000 };
    log("INFO", "director", `已确认第${ep.number}集,自动生产中`);
    runStages(ep, PHASE2, () => {
      ep.status = "done";
      ep.qc_score = full.qc_report.score;
      ep.cost = full.cost;
      full.episode = { ...ep };
      state.payloads[ep.id] = full;
      jobs[jobId].status = "done";
      jobs[jobId].summary = { status: "done" };
      log("INFO", "director",
        `《${full.project.title}》第${ep.number}集 制作完成:质检 100`);
    });
    save();
    return jobId;
  }

  /* ---- API 汇总 ---- */
  function overview() {
    const episodes = state.episodes.map((e) => ({ ...e,
      project: state.projects.find((p) => p.id === e.project_id).title }));
    const done = episodes.filter((e) => e.status === "done");
    const scored = episodes.filter((e) => e.qc_score != null);
    const stageAgg = {};
    const assetStats = {};
    for (const p of state.projects) assetStats[p.title] = [];
    for (const e of episodes) {
      const payload = state.payloads[e.id];
      if (!payload) continue;
      for (const t of payload.tasks) {
        stageAgg[t.stage] = stageAgg[t.stage] || { stage: t.stage, tasks: 0, total: 0 };
        stageAgg[t.stage].tasks += 1;
        stageAgg[t.stage].total += t.cost;
      }
    }
    for (const p of state.projects) {
      const eps = episodes.filter((e) => e.project_id === p.id && state.payloads[e.id]);
      const chars = new Set(), scenes = new Set();
      let images = 0, videos = 0, voicesN = 0, clips = 0;
      for (const e of eps) {
        const pl = state.payloads[e.id];
        pl.script.characters.forEach((c) => chars.add(c.name));
        pl.script.scenes.forEach((s) => scenes.add(s.location));
        images += Object.keys(pl.artifacts.images).length;
        videos += Object.keys(pl.artifacts.videos).length;
        voicesN += Object.keys(pl.artifacts.voices).length;
        clips += pl.artifacts.clips.length;
      }
      const rows = [
        ["character", chars.size], ["scene", scenes.size],
        ["image", images], ["video", videos], ["voice", voicesN],
        ["clip", clips], ["cover", eps.length], ["edit", eps.length]];
      assetStats[p.title] = rows.filter(([, n]) => n > 0)
        .map(([kind, total]) => ({ kind, total, reused: 0 }));
    }
    const totalCost = Math.round(
      episodes.reduce((a, e) => a + (e.cost || 0), 0) * 100) / 100;
    return {
      version: "3.0.0-browser-demo",
      projects: state.projects,
      episodes: episodes.slice().reverse(),
      stats: {
        episodes: episodes.length, done: done.length, total_cost: totalCost,
        avg_qc: scored.length ? Math.round(scored.reduce(
          (a, e) => a + e.qc_score, 0) / scored.length * 10) / 10 : null,
        budget: BUDGET,
      },
      cost_by_stage: Object.values(stageAgg).map((r) => ({ ...r,
        total: Math.round(r.total * 100) / 100 }))
        .sort((a, b) => b.total - a.total),
      cost_by_provider: [{ provider: "mock(浏览器)",
        calls: Math.round(totalCost / 0.1), total: totalCost }],
      quota: [{ provider: "jimeng", used: 0, quota_limit: 1000 }],
      asset_stats: assetStats,
      jobs: Object.values(jobs).sort((a, b) => b.started_at - a.started_at),
    };
  }

  function route(path, opts) {
    const key = path.split("#")[0];
    if (opts && opts.method === "POST" && key === "/api/produce") {
      const body = JSON.parse(opts.body || "{}");
      let title = body.title, number = body.episode;
      const m = /《(.+?)》\s*第\s*(\d+)\s*集/.exec(body.sentence || "");
      if (m) { title = m[1]; number = parseInt(m[2], 10); }
      if (!title || !number)
        return [400, { error: "无法识别制作目标;示例:开始制作《万妖图录》第16集" }];
      let provided = null;
      if (body.script_text && body.script_text.trim()) {
        try {
          const text = body.script_text.trim();
          provided = text.startsWith("{")
            ? JSON.parse(text)
            : parseTextScript(text, title, number);
        } catch (e) {
          return [400, { error: `剧本解析失败:${e.message}` }];
        }
      }
      const review = body.review === undefined ? true : !!body.review;
      const jobId = startProduce(
        title, number, body.premise || "", !!body.force, provided, review,
        body.kind || "");
      return [202, { job_id: jobId || "cached" }];
    }
    if (opts && opts.method === "POST" && key === "/api/revise") {
      const body = JSON.parse(opts.body || "{}");
      const ep = state.episodes.find(
        (e) => e.id === parseInt(body.episode_id, 10));
      if (!ep) return [404, { error: "剧集不存在" }];
      const project = state.projects.find((p) => p.id === ep.project_id);
      const jobId = startProduce(
        project.title, ep.number,
        `${ep.premise || ""} ${body.feedback || ""}`.trim(),
        true, null, true, project.kind);
      log("INFO", "director", `按意见重写剧本:${body.feedback}`);
      return [202, { job_id: jobId }];
    }
    if (opts && opts.method === "POST" && key === "/api/regen_image") {
      const body = JSON.parse(opts.body || "{}");
      const id = parseInt(body.episode_id, 10);
      const pl = state.payloads[id];
      if (!pl) return [404, { error: "剧集不存在" }];
      const project = state.projects.find(
        (p) => p.id === pl.episode.project_id);
      const [w, h] = DIMS[project.aspect || "9:16"] || DIMS["9:16"];
      state.bump = (state.bump || 0) + 1;
      const target = body.target || {};
      const s2 = hash(`${body.feedback || ""}#${state.bump}#${target.kind}`);
      const full = state.fullResults[id];
      const each = (fn) => { fn(pl); if (full) fn(full); };
      if (target.kind === "character_art") {
        const role = (pl.script.characters.find(
          (c) => c.name === target.name) || {}).role || "";
        const url = cinematicPortrait(w, h, s2, target.name, role);
        each((p) => {
          const item = p.artifacts.cast_art.find(
            (c) => c.name === target.name);
          if (item) item.url = url;
        });
      } else if (target.kind === "scene_art") {
        const url = cinematicShot(w, h, s2, target.name, null, null,
          0, "", "", "key");
        each((p) => {
          const item = p.artifacts.scene_art.find(
            (c) => c.name === target.name);
          if (item) item.url = url;
        });
      } else if (target.kind === "shot") {
        const shot = pl.storyboard.shots.find(
          (s) => s.shot_no === target.shot_no);
        if (!shot) return [404, { error: "镜头不存在" }];
        const loc = (pl.script.scenes.find(
          (sc) => sc.scene_no === shot.scene_no) || {}).location || "";
        each((p) => {
          p.artifacts.images[shot.shot_no] = cinematicShot(
            w, h, s2, loc, shot.characters, shot.dialogue,
            shot.shot_no, shot.camera, shot.description, "key");
          p.artifacts.first[shot.shot_no] = cinematicShot(
            w, h, s2, loc, shot.characters, shot.dialogue,
            shot.shot_no, shot.camera, shot.description, "first");
          p.artifacts.last[shot.shot_no] = cinematicShot(
            w, h, s2, loc, shot.characters, shot.dialogue,
            shot.shot_no, shot.camera, shot.description, "last");
        });
      } else {
        return [400, { error: "不支持的重画目标" }];
      }
      jobSeq += 1;
      const jobId = `j${jobSeq}`;
      jobs[jobId] = { id: jobId, status: "done", title: project.title,
        episode: pl.episode.number, started_at: Date.now() / 1000 };
      log("INFO", "director",
        `已重画 ${target.kind}(意见:${body.feedback || "无"})`);
      save();
      return [202, { job_id: jobId }];
    }
    if (opts && opts.method === "POST" && key === "/api/upload") {
      const body = JSON.parse(opts.body || "{}");
      const id = parseInt(body.episode_id, 10);
      const pl = state.payloads[id];
      if (!pl) return [404, { error: "剧集不存在" }];
      const full = state.fullResults[id];
      const ext = (body.filename || "").split(".").pop().toLowerCase();
      const mime = { png: "image/png", jpg: "image/jpeg",
        jpeg: "image/jpeg", webp: "image/webp", svg: "image/svg+xml",
        mp4: "video/mp4" }[ext];
      if (!mime) return [400, { error: `不支持的格式: .${ext}` }];
      const uri = `data:${mime};base64,${body.data_base64 || ""}`;
      const t = body.target || {};
      const each = (fn) => { fn(pl); if (full) fn(full); };
      if (t.kind === "character_art") {
        each((p) => { const i = p.artifacts.cast_art.find(
          (c) => c.name === t.name); if (i) i.url = uri; });
      } else if (t.kind === "scene_art") {
        each((p) => { const i = p.artifacts.scene_art.find(
          (c) => c.name === t.name); if (i) i.url = uri; });
      } else if (t.kind === "shot") {
        each((p) => {
          p.artifacts.images[t.shot_no] = uri;
          p.artifacts.first[t.shot_no] = uri;
          p.artifacts.last[t.shot_no] = uri;
        });
      } else if (t.kind === "shot_video") {
        each((p) => { p.artifacts.videos[t.shot_no] = uri; });
      } else {
        return [400, { error: "不支持的上传目标" }];
      }
      log("INFO", "director", `已上传替换 ${t.kind}`);
      save();
      return [200, { uri: "uploaded" }];
    }
    if (opts && opts.method === "POST" && key === "/api/confirm") {
      const body = JSON.parse(opts.body || "{}");
      const jobId = confirmProduce(parseInt(body.episode_id, 10));
      if (!jobId) return [404, { error: "剧集不存在或无待确认内容" }];
      return [202, { job_id: jobId }];
    }
    if (key === "/api/overview") return [200, overview()];
    let m = /^\/api\/episode\/(\d+)$/.exec(key);
    if (m) {
      const id = parseInt(m[1], 10);
      const payload = state.payloads[id];
      if (payload) {
        const ep = state.episodes.find((e) => e.id === id);
        payload.episode = { ...ep };
        return [200, payload];
      }
      const ep = state.episodes.find((e) => e.id === id);
      if (ep) return [200, { episode: { ...ep },
        project: state.projects.find((p) => p.id === ep.project_id),
        tasks: [], script: null, storyboard: null, qc_report: null,
        artifacts: { images: {}, first: {}, last: {}, videos: {}, voices: {},
          cover: null, final: null, titles: [], clips: [] } }];
      return [404, { error: "剧集不存在" }];
    }
    if (key.startsWith("/api/logs"))
      return [200, state.logs.slice(-30).reverse()];
    if (key === "/api/jobs") return [200, Object.values(jobs)];
    m = /^\/api\/jobs\/(\w+)$/.exec(key);
    if (m) return jobs[m[1]] ? [200, jobs[m[1]]] : [404, { error: "任务不存在" }];
    return [404, { error: "演示模式无此数据" }];
  }

  /* ---- 浏览器内 zip 打包(存储式)与成品包导出 ---- */
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n += 1) {
      let c = n;
      for (let k = 0; k < 8; k += 1)
        c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i += 1)
      c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  const te = new TextEncoder();
  function buildZip(entries) {
    const chunks = [], central = [];
    let offset = 0;
    const num = (n, len) => {
      const a = new Uint8Array(len);
      for (let i = 0; i < len; i += 1) a[i] = (n >>> (8 * i)) & 0xff;
      return a;
    };
    for (const { name, data } of entries) {
      const nameB = te.encode(name);
      const crc = crc32(data);
      const local = [num(0x04034b50, 4), num(20, 2), num(0x0800, 2),
        num(0, 2), num(0, 2), num(0, 2), num(crc, 4),
        num(data.length, 4), num(data.length, 4),
        num(nameB.length, 2), num(0, 2), nameB, data];
      central.push({ nameB, crc, size: data.length, offset });
      for (const part of local) { chunks.push(part); offset += part.length; }
    }
    const cdStart = offset;
    for (const e of central) {
      const rec = [num(0x02014b50, 4), num(20, 2), num(20, 2),
        num(0x0800, 2), num(0, 2), num(0, 2), num(0, 2), num(e.crc, 4),
        num(e.size, 4), num(e.size, 4), num(e.nameB.length, 2),
        num(0, 2), num(0, 2), num(0, 2), num(0, 2), num(0, 4),
        num(e.offset, 4), e.nameB];
      for (const part of rec) { chunks.push(part); offset += part.length; }
    }
    chunks.push(num(0x06054b50, 4), num(0, 2), num(0, 2),
      num(central.length, 2), num(central.length, 2),
      num(offset - cdStart, 4), num(cdStart, 4), num(0, 2));
    return new Blob(chunks, { type: "application/zip" });
  }
  function dataUriBytes(uri) {
    const b64 = (uri.split(",")[1] || "");
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
    return out;
  }
  const EXT_BY_MIME = { "image/svg+xml": ".svg", "image/png": ".png",
    "image/jpeg": ".jpg", "video/mp4": ".mp4",
    "application/json": ".json", "audio/wav": ".wav" };
  function extOf(uri) {
    const mime = (uri.split(";")[0] || "").replace("data:", "");
    return EXT_BY_MIME[mime] || ".bin";
  }
  function scriptText(script) {
    return script.scenes.map((s) => {
      const rows = [`第${s.scene_no}场 ${s.location}`];
      if (s.action) rows.push(s.action);
      (s.lines || []).forEach((l) => rows.push(`${l.character}:${l.dialogue}`));
      return rows.join("\n");
    }).join("\n\n");
  }
  function exportZipBlob(id) {
    const pl = state.payloads[id];
    if (!pl) return null;
    const art = pl.artifacts;
    const entries = [];
    const addText = (name, text) => entries.push({ name, data: te.encode(text) });
    const addUri = (name, uri) => {
      if (uri) entries.push({ name: name + extOf(uri), data: dataUriBytes(uri) });
    };
    addText("剧本.txt", scriptText(pl.script));
    const full = state.fullResults[id] || {};
    addText("标题与话题.txt", ["【候选标题】", ...(art.titles || []), "",
      "【话题标签】", (full.hashtags || []).join(" ")].join("\n"));
    Object.entries(art.images).forEach(([n, u]) => addUri(`画面/shot_${n}`, u));
    Object.entries(art.videos).forEach(([n, u]) => addUri(`视频/shot_${n}`, u));
    Object.entries(art.voices).forEach(([n, u]) => addUri(`配音/line_${n}`, u));
    (art.cast_art || []).forEach((c) => addUri(`人物设定/${c.name}`, c.url));
    (art.scene_art || []).forEach((s) => addUri(`场景设定/${s.name}`, s.url));
    addUri("封面", art.cover);
    addUri("成片", art.final);
    return buildZip(entries);
  }

  load();
  window.fetch = async (path, opts) => {
    const exportMatch = /^\/api\/export\/(\d+)$/.exec(path.split("#")[0]);
    if (exportMatch) {
      const blob = exportZipBlob(parseInt(exportMatch[1], 10));
      if (!blob) return { ok: false, status: 404,
        json: async () => ({ error: "剧集不存在" }) };
      return { ok: true, status: 200, blob: async () => blob,
        json: async () => ({}) };
    }
    const [status, data] = route(path, opts);
    return { ok: status < 400, status,
      json: async () => JSON.parse(JSON.stringify(data)) };
  };
  window.__DEMO_RESET__ = () => { localStorage.removeItem(KEY); location.reload(); };
  const resetLink = document.getElementById("demo-reset");
  if (resetLink) resetLink.onclick = window.__DEMO_RESET__;
})();

</script>
<script>
/* AIFOS 控制台单页应用:仪表盘 + 分镜画布(原生 JS,零依赖) */
"use strict";

const app = document.getElementById("app");
const topbarRight = document.getElementById("topbar-right");
let pollTimer = null;

/* ---------- 工具 ---------- */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n, d = 2) => n == null ? "-" : Number(n).toFixed(d);

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

/* 页面内置提示(不用 alert/confirm——沙箱环境会静默拦截弹窗) */
function showToast(message, kind = "info") {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const toast = document.createElement("div");
  toast.className = `toast ${kind}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

/* 二次点击确认:第一次点击进入待确认态,3 秒内再点执行 */
function armConfirm(btn, label, action) {
  if (btn.dataset.armed === "1") {
    btn.dataset.armed = "";
    btn.textContent = btn.dataset.original;
    action();
    return;
  }
  btn.dataset.armed = "1";
  btn.dataset.original = btn.textContent;
  btn.textContent = `再点一次确认${label}`;
  setTimeout(() => {
    if (btn.dataset.armed === "1") {
      btn.dataset.armed = "";
      btn.textContent = btn.dataset.original;
    }
  }, 3000);
}

const STATUS_CN = {
  done: "完成", failed: "失败", qc_failed: "质检未过", created: "已建",
  awaiting_confirm: "待确认", script: "剧本中", cast: "画人物场景",
  storyboard: "分镜中", images: "出图中",
  frames: "首尾帧", videos: "视频中", voices: "配音中", edit: "剪辑中",
  qc: "质检中", package: "包装中", archive: "沉淀中", running: "制作中",
};
function chip(status) {
  const cls = ["done", "failed", "qc_failed", "awaiting_confirm"].includes(status)
    ? status : "running";
  return `<span class="chip ${cls}">${esc(STATUS_CN[status] || status)}</span>`;
}

/* ---------- 路由 ---------- */
window.addEventListener("hashchange", route);
route();

function route() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  const m = location.hash.match(/^#\/episode\/(\d+)$/);
  if (m) renderCanvasView(Number(m[1]));
  else renderDashboard();
}

/* ================= 仪表盘 ================= */
async function renderDashboard() {
  topbarRight.innerHTML = "";
  let data;
  try { data = await api("/api/overview"); }
  catch (e) { app.innerHTML = `<div class="loading">加载失败:${esc(e.message)}</div>`; return; }

  const s = data.stats;
  const runningJobs = data.jobs.filter((j) => j.status === "running");
  topbarRight.innerHTML = runningJobs.length
    ? `<span class="chip running">${runningJobs.length} 个制作任务进行中</span>` : "";

  const maxStage = Math.max(1, ...data.cost_by_stage.map((r) => r.total || 0));
  app.innerHTML = `
  <div class="dash">
    <form class="produce-bar" id="produce-form">
      <div class="mode-tabs">
        <button type="button" class="mode-tab active" data-mode="ai">✨ AI 自动编剧</button>
        <button type="button" class="mode-tab" data-mode="script">📄 我有剧本</button>
      </div>
      <div class="kind-tabs">
        <span class="kind-label">内容类型</span>
        <button type="button" class="kind-tab active" data-kind="">自动识别</button>
        <button type="button" class="kind-tab" data-kind="drama">🎬 剧情短剧</button>
        <button type="button" class="kind-tab" data-kind="idol">💫 虚拟偶像/女团</button>
      </div>
      <input name="sentence" placeholder='写下作品名和集数,例如:开始制作《苏念的一天》第1集' required>
      <input name="premise" placeholder="内容方向,例如:偶像女团 / 都市职场 / 仙侠(可不填)">
      <button class="primary" type="submit">开始制作</button>
      <textarea name="script" rows="5" hidden placeholder="把你的剧本粘贴到这里,人物、场次、分镜会自动识别。写法示例:
第1场 古镇长街
夜色渐深,妖气翻涌。
林昭:这股妖气不对劲。
小狐:小心,它就在附近!"></textarea>
      <div class="produce-hint">全自动完成:剧本 → 分镜 → 画面 → 配音 → 成片。做完后点下方剧集,再点「▶ 播放本集」观看。</div>
    </form>
    <div id="progress-banner"></div>

    <div class="tiles">
      <div class="tile"><div class="label">剧集总数</div><div class="value">${s.episodes}</div></div>
      <div class="tile"><div class="label">已完成</div><div class="value">${s.done}<small> / ${s.episodes}</small></div></div>
      <div class="tile"><div class="label">总成本</div><div class="value">${fmt(s.total_cost)}<small> 单集预算 ${fmt(s.budget, 0)}</small></div></div>
      <div class="tile"><div class="label">平均质检分</div><div class="value">${s.avg_qc == null ? "-" : fmt(s.avg_qc, 1)}</div></div>
      <div class="tile"><div class="label">制作任务</div><div class="value">${runningJobs.length}<small> 进行中</small></div></div>
    </div>

    <div class="panel">
      <h2>剧集 · 点击进入分镜画布</h2>
      ${data.episodes.length ? `
      <table><thead><tr><th>项目</th><th>集</th><th>状态</th><th class="num">质检</th><th class="num">成本</th></tr></thead>
      <tbody>${data.episodes.map((e) => `
        <tr class="clickable" data-ep="${e.id}">
          <td>${esc(e.project)}</td><td>第${e.number}集</td>
          <td>${chip(e.status)}</td>
          <td class="num">${e.qc_score == null ? "-" : fmt(e.qc_score, 0)}</td>
          <td class="num">${fmt(e.cost)}</td>
        </tr>`).join("")}</tbody></table>`
      : `<div class="empty">暂无剧集,输入一句话开始制作。</div>`}
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2>成本 · 按阶段</h2>
        ${data.cost_by_stage.filter((r) => r.total > 0).map((r) => `
          <div class="bar-row">
            <span class="name">${esc(STAGE_CN[r.stage] || r.stage)}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(r.total / maxStage * 100).toFixed(1)}%"></div></div>
            <span class="val">${fmt(r.total)}</span>
          </div>`).join("") || `<div class="empty">暂无成本数据</div>`}
      </div>
      <div class="panel">
        <h2>Provider · 调用与额度</h2>
        ${data.cost_by_provider.length ? `
        <table><thead><tr><th>Provider</th><th class="num">调用</th><th class="num">成本</th></tr></thead>
        <tbody>${data.cost_by_provider.map((r) => `
          <tr><td>${esc(r.provider)}</td><td class="num">${r.calls}</td><td class="num">${fmt(r.total)}</td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">暂无调用</div>`}
        ${data.quota.map((q) => `
          <div class="bar-row" style="margin-top:8px">
            <span class="name">${esc(q.provider)} 额度</span>
            <div class="bar-track"><div class="bar-fill" style="width:${(q.used / Math.max(1, q.quota_limit) * 100).toFixed(1)}%"></div></div>
            <span class="val">${q.used}/${q.quota_limit}</span>
          </div>`).join("")}
      </div>
    </div>

    <div class="panel">
      <h2>账号矩阵 · IP 资产沉淀</h2>
      ${Object.keys(data.asset_stats).length ? Object.entries(data.asset_stats).map(([proj, rows]) => {
        const p = data.projects.find((x) => x.title === proj) || {};
        const kindCN = { drama: "漫剧", idol: "AI虚拟偶像" }[p.kind] || p.kind || "";
        return `
        <div style="margin-bottom:8px"><b>${esc(proj)}</b>
          <span class="chip" style="margin-left:8px">${esc(kindCN)}</span>
          ${p.account ? `<span class="chip">@${esc(p.account)}</span>` : ""}
          <span class="chip">${esc(p.aspect || "9:16")}</span>
        </div>
        <div class="asset-chips" style="margin-bottom:12px">
          ${rows.map((r) => `<span class="chip">${esc(KIND_CN[r.kind] || r.kind)} ×${r.total}${r.reused ? ` · 复用${r.reused}` : ""}</span>`).join("")}
        </div>`;
      }).join("") : `<div class="empty">暂无资产</div>`}
    </div>

    <div class="panel">
      <h2>最近日志</h2>
      <div class="log-list" id="log-list"><div class="empty">加载中…</div></div>
    </div>
  </div>`;

  const form = document.getElementById("produce-form");
  form.addEventListener("submit", onProduce);
  form.querySelectorAll(".mode-tab").forEach((tab) =>
    tab.addEventListener("click", () => {
      form.querySelectorAll(".mode-tab").forEach((t) =>
        t.classList.toggle("active", t === tab));
      form.script.hidden = tab.dataset.mode !== "script";
      if (tab.dataset.mode === "script") form.script.focus();
    }));
  form.querySelectorAll(".kind-tab").forEach((tab) =>
    tab.addEventListener("click", () => {
      form.querySelectorAll(".kind-tab").forEach((t) =>
        t.classList.toggle("active", t === tab));
      form.dataset.kind = tab.dataset.kind;
    }));
  renderProgressBanner(data);
  app.querySelectorAll("tr.clickable").forEach((tr) =>
    tr.addEventListener("click", () => { location.hash = `#/episode/${tr.dataset.ep}`; }));

  api("/api/logs?limit=30").then((rows) => {
    const el = document.getElementById("log-list");
    if (el) el.innerHTML = rows.length
      ? rows.reverse().map((r) => `<div class="lv-${esc(r.level)}">[${esc(r.level)}] ${esc(r.source)}: ${esc(r.message)}</div>`).join("")
      : `<div class="empty">暂无日志</div>`;
  }).catch(() => {});

  if (runningJobs.length) pollTimer = setInterval(refreshIfIdle, 2500);
}

function refreshIfIdle() {
  if (location.hash === "" || location.hash === "#/") renderDashboard();
}

async function onProduce(ev) {
  ev.preventDefault();
  const form = ev.target;
  const btn = form.querySelector("button");
  btn.disabled = true; btn.textContent = "提交中…";
  try {
    await api("/api/produce", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sentence: form.sentence.value,
        premise: form.premise.value,
        script_text: form.script.hidden ? "" : form.script.value,
        kind: form.dataset.kind || "",
      }),
    });
    showToast("制作任务已提交,进度会自动刷新", "ok");
    renderDashboard();
  } catch (e) {
    showToast(e.message, "error");
    btn.disabled = false; btn.textContent = "开始制作";
  }
}

/* ================= 整集播放器(动态分镜连播) ================= */
function openPlayer(data, startShotNo) {
  const art = data.artifacts;
  const lineNoIndex = buildLineIndex(data.script);
  const shots = data.storyboard.shots.map((s) => {
    const video = art.videos[s.shot_no] || "";
    const lineNo = s.dialogue ? lineNoIndex(s) : null;
    return {
      shot: s,
      mp4: /\.mp4($|\?)/.test((video || "").split("#")[0]) ? video : null,
      first: art.first[s.shot_no] || art.images[s.shot_no] || "",
      last: art.last[s.shot_no] || art.images[s.shot_no] || "",
      audio: lineNo != null &&
        /\.(wav|mp3|m4a|aiff)($|\?)/.test((art.voices[lineNo] || ""))
        ? art.voices[lineNo] : null,
    };
  }).filter((x) => x.first || x.mp4);
  if (!shots.length) return;
  const total = shots.reduce((a, x) => a + x.shot.duration, 0);

  const overlay = document.createElement("div");
  overlay.className = "player-overlay";
  overlay.innerHTML = `
    <div class="player-box">
      <div class="player-head">
        <span>《${esc(data.project.title)}》第${data.episode.number}集</span>
        <span class="player-pos" id="pl-pos"></span>
        <button class="close" id="pl-close">关闭 Esc</button>
      </div>
      <div class="player-stage" id="pl-stage">
        <img id="pl-a" alt=""><img id="pl-b" alt="">
        <video id="pl-video" playsinline hidden></video>
        <div class="player-sub" id="pl-sub" hidden></div>
        <button class="player-big" id="pl-big">▶</button>
      </div>
      <div class="player-bar">
        <button id="pl-toggle">▶ 播放</button>
        <div class="player-track" id="pl-track"><div class="player-fill" id="pl-fill"></div></div>
        <span class="player-time" id="pl-time"></span>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const elA = overlay.querySelector("#pl-a");
  const elB = overlay.querySelector("#pl-b");
  const elVideo = overlay.querySelector("#pl-video");
  const elSub = overlay.querySelector("#pl-sub");
  const elFill = overlay.querySelector("#pl-fill");
  const elPos = overlay.querySelector("#pl-pos");
  const elTime = overlay.querySelector("#pl-time");
  const btnToggle = overlay.querySelector("#pl-toggle");
  const btnBig = overlay.querySelector("#pl-big");

  let index = -1, playing = false, timer = null, elapsedBefore = 0;
  let currentAudio = null;

  function fmtTime(sec) {
    return `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`;
  }
  function stopMedia() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    elVideo.pause();
  }
  function showShot(i, autoplay) {
    index = i;
    const item = shots[i];
    elapsedBefore = shots.slice(0, i).reduce((a, x) => a + x.shot.duration, 0);
    elPos.textContent = `镜头 ${i + 1}/${shots.length} · 场${item.shot.scene_no}`;
    elTime.textContent = `${fmtTime(elapsedBefore)} / ${fmtTime(total)}`;
    elFill.style.width = `${(elapsedBefore / total) * 100}%`;
    if (item.shot.dialogue) {
      elSub.innerHTML = `<b>${esc(item.shot.dialogue.character)}</b>${esc(item.shot.dialogue.dialogue)}`;
      elSub.hidden = false;
    } else { elSub.hidden = true; }
    if (item.mp4) {
      elA.hidden = elB.hidden = true;
      elVideo.hidden = false;
      elVideo.src = item.mp4;
      elVideo.muted = !item.audio ? false : true;
      if (autoplay) elVideo.play().catch(() => {});
      elVideo.onended = () => { if (playing) next(); };
    } else {
      elVideo.hidden = true;
      elA.hidden = elB.hidden = false;
      elA.src = item.first;
      elB.src = item.last;
      elB.classList.remove("fade-in");
      void elB.offsetWidth;  // 重置过渡
      if (autoplay) {
        elB.style.transitionDuration = `${item.shot.duration}s`;
        elB.classList.add("fade-in");
        timer = setTimeout(next, item.shot.duration * 1000);
      }
    }
    if (autoplay && item.audio) {
      currentAudio = new Audio(item.audio);
      currentAudio.play().catch(() => {});
    }
  }
  function next() {
    stopMedia();
    if (index + 1 >= shots.length) { setPlaying(false); showShot(0, false); return; }
    showShot(index + 1, true);
  }
  function setPlaying(value) {
    playing = value;
    btnToggle.textContent = playing ? "⏸ 暂停" : "▶ 播放";
    btnBig.hidden = playing;
    if (!playing) stopMedia();
  }
  function start() {
    setPlaying(true);
    showShot(index < 0 ? 0 : index, true);
  }
  btnToggle.onclick = () => (playing ? setPlaying(false) : start());
  btnBig.onclick = start;
  overlay.querySelector("#pl-track").onclick = (ev) => {
    const rect = ev.currentTarget.getBoundingClientRect();
    const target = ((ev.clientX - rect.left) / rect.width) * total;
    let acc = 0;
    for (let i = 0; i < shots.length; i += 1) {
      acc += shots[i].shot.duration;
      if (target < acc) { stopMedia(); showShot(i, playing); return; }
    }
  };
  const close = () => {
    stopMedia();
    overlay.remove();
    document.removeEventListener("keydown", onKey);
  };
  const onKey = (ev) => {
    if (ev.key === "Escape") close();
    if (ev.key === " ") { ev.preventDefault(); btnToggle.click(); }
  };
  document.addEventListener("keydown", onKey);
  overlay.querySelector("#pl-close").onclick = close;
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
  const aspect = data.project.aspect || "9:16";
  overlay.querySelector(".player-stage").style.aspectRatio =
    aspect === "16:9" ? "16 / 9" : "9 / 16";
  if (aspect === "16:9")
    overlay.querySelector(".player-box").style.width = "min(960px, 96vw)";
  const startIndex = startShotNo
    ? Math.max(0, shots.findIndex((x) => x.shot.shot_no === startShotNo))
    : 0;
  if (startShotNo) {
    setPlaying(true);
    showShot(startIndex, true);
  } else {
    showShot(0, false);
  }
}

function buildLineIndex(script) {
  return (shot) => {
    let n = 0;
    for (const scene of script.scenes) {
      for (const line of scene.lines) {
        n += 1;
        if (scene.scene_no === shot.scene_no &&
            line.character === shot.dialogue.character &&
            line.dialogue === shot.dialogue.dialogue) return n;
      }
    }
    return null;
  };
}

/* 剧本 → 可编辑文本(与导入格式一致) */
function scriptToText(script) {
  return script.scenes.map((s) => {
    const lines = [`第${s.scene_no}场 ${s.location}`];
    if (s.action) lines.push(s.action);
    (s.lines || []).forEach((l) => lines.push(`${l.character}:${l.dialogue}`));
    return lines.join("\n");
  }).join("\n\n");
}

async function pollJob(jobId, onDone) {
  const timer = setInterval(async () => {
    try {
      const job = await api(`/api/jobs/${jobId}`);
      if (job.status !== "running") {
        clearInterval(timer);
        if (job.status === "failed") showToast(job.error || "任务失败", "error");
        onDone(job);
      }
    } catch (e) { clearInterval(timer); }
  }, 1200);
}

      <div class="cast">${(script.characters || []).map((c) =>
        `<span class="chip">${esc(c.name)} · ${esc(c.role || "")}</span>`).join("")}</div>
      ${script.scenes.map((s) => `
        <section class="scene">
          <h4>场 ${s.scene_no} · ${esc(s.location)}</h4>
          ${s.action ? `<p class="action">${esc(s.action)}</p>` : ""}
          ${(s.lines || []).map((l) => `
            <p class="line"><b>${esc(l.character)}</b>${esc(l.dialogue)}</p>`).join("")}
        </section>`).join("")}
    </div>`;
  const close = () => { overlay.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (ev) => { if (ev.key === "Escape") close(); };
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) close(); });
  overlay.querySelector(".close").onclick = close;
  document.addEventListener("keydown", onKey);
  document.body.appendChild(overlay);

  const post = (path, body) => api(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body) });
  overlay.querySelector("#btn-revise").onclick = async () => {
    const feedback = overlay.querySelector("#revise-feedback").value.trim();
    if (!feedback) { showToast("先写一句修改意见", "error"); return; }
    try {
      await post("/api/revise", { episode_id: data.episode.id, feedback });
      close();
      showToast("正在按你的意见重写剧本并重出人物/分镜…", "ok");
      pollTimer = setInterval(() => renderCanvasView(episodeId), 3000);
    } catch (e) { showToast(e.message, "error"); }
  };
  const editArea = overlay.querySelector("#edit-area");
  overlay.querySelector("#btn-edit-toggle").onclick = () => {
    editArea.hidden = !editArea.hidden;
    if (!editArea.hidden) {
      overlay.querySelector("#edit-text").value = scriptToText(script);
    }
  };
  const submitScriptText = async (text, source) => {
    try {
      await post("/api/produce", {
        title: data.project.title,
        episode: data.episode.number,
        script_text: text,
        review: true,
      });
      close();
      showToast(`已按${source}重做,人物/分镜将自动更新…`, "ok");
      pollTimer = setInterval(() => renderCanvasView(episodeId), 3000);
    } catch (e) { showToast(e.message, "error"); }
  };
  overlay.querySelector("#btn-edit-submit").onclick = () =>
    submitScriptText(overlay.querySelector("#edit-text").value, "你的文字");
  overlay.querySelector("#btn-script-down").onclick = () => {
    const blob = new Blob([scriptToText(script)],
      { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    downloadUrl(url,
      `${script.project_title}_第${script.episode_number}集_剧本.txt`);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };
  overlay.querySelector("#btn-script-up").onclick = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".txt,.json,text/plain,application/json";
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => submitScriptText(
        String(reader.result), `文件「${file.name}」`);
      reader.readAsText(file, "utf-8");
    };
    input.click();
  };
}

/* 素材下载 / 人工修改后上传 */
function downloadUrl(url, filename) {
  const a = document.createElement("a");
  a.href = url;
  a.download = filename || "";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function uploadFile(episodeId, target, accept, onDone) {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = accept;
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        showToast("上传中…", "ok");
        await api("/api/upload", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            episode_id: episodeId, target, filename: file.name,
            data_base64: String(reader.result).split(",")[1] || "",
          }),
        });
        showToast("已替换为你的版本", "ok");
        onDone();
      } catch (e) { showToast(e.message, "error"); }
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

/* 可内联播放的媒体标签(真实产线 mp4/wav;mock 的 json 描述文件回退为链接) */
function mediaTag(url) {
  if (!url) return "";
  const clean = url.split("?")[0].toLowerCase();
  if (clean.endsWith(".mp4"))
    return `<video class="player" controls preload="metadata" src="${esc(url)}"></video>`;
  if ([".wav", ".mp3", ".m4a", ".aiff"].some((ext) => clean.endsWith(ext)))
    return `<audio class="player" controls preload="metadata" src="${esc(url)}"></audio>`;
  return "";
}

async function renderCanvasView(episodeId) {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  let data;
  try { data = await api(`/api/episode/${episodeId}`); }
  catch (e) { app.innerHTML = `<div class="loading">加载失败:${esc(e.message)}</div>`; return; }

  const ep = data.episode, sb = data.storyboard, script = data.script;
  topbarRight.innerHTML = chip(ep.status);
  if (!sb) {
    app.innerHTML = `<div class="loading">本集尚无分镜(制作进行中或未开始)。<a href="#/">返回仪表盘</a></div>`;
    if (!["done", "failed", "qc_failed"].includes(ep.status))
      pollTimer = setInterval(() => renderCanvasView(episodeId), 3000);
    return;
  }

  // 质检问题按镜头/台词索引
  const shotIssues = {}, lineIssues = {};
  (data.qc_report?.issues || []).forEach((i) => {
    if (i.shot_no != null) (shotIssues[i.shot_no] = shotIssues[i.shot_no] || []).push(i);
    if (i.line_no != null) (lineIssues[i.line_no] = lineIssues[i.line_no] || []).push(i);
  });

  const awaiting = ep.status === "awaiting_confirm";
  app.innerHTML = `
  <div class="canvas-view">
    ${awaiting ? `
    <div class="confirm-banner">
      <div>
        <b>预生产完成,请过目 👀</b>
        <span>剧本、人物、场景、分镜都已生成(见画布与右侧面板)。满意就点确认,
        视频 → 配音 → 剪辑 → 质检会全自动完成;不满意可改剧本后重新制作。</span>
      </div>
      <button class="primary" id="btn-confirm">✅ 确认,开始生产</button>
    </div>` : ""}
    <div class="canvas-toolbar">
      <button id="btn-back">← 仪表盘</button>
      <span class="title">《${esc(ep.project_title || data.project.title)}》第${ep.number}集</span>
      ${chip(ep.status)}
      <span class="hint">质检 ${ep.qc_score == null ? "-" : fmt(ep.qc_score, 0)} 分 · 成本 ${fmt(ep.cost)}</span>
      <span class="spacer"></span>
      <div class="zoom-group view-toggle">
        <button id="view-theater">🎬 剧场</button>
        <button id="view-canvas">🗺 画布</button>
      </div>
      <button id="btn-play" class="primary">▶ 播放本集</button>
      <button id="btn-script">剧本</button>
      <button id="btn-reproduce" title="复用已完成的部分,只补做缺失内容">继续补齐</button>
      <button id="btn-reproduce-force" title="从头全部重新制作(真实产线会消耗额度)">全部重做</button>
      <div class="zoom-group">
        <button id="zoom-out">−</button>
        <span class="zoom-pct" id="zoom-pct">100%</span>
        <button id="zoom-in">＋</button>
        <button id="zoom-fit">适应</button>
        <button id="layout-reset">重排</button>
      </div>
    </div>
    <div class="canvas-body">
      <div id="theater"></div>
      <div id="viewport" hidden><div id="world"></div></div>
      <aside id="sidepanel"></aside>
    </div>
    <div class="timeline" id="timeline" hidden></div>
  </div>`;

  document.getElementById("btn-back").onclick = () => { location.hash = "#/"; };
  const reproduce = async (force) => {
    try {
      await api("/api/produce", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          title: data.project.title, episode: ep.number, force,
        }),
      });
      showToast(force ? "已提交强制重制,画布将自动刷新" : "已提交增量重制,画布将自动刷新", "ok");
      pollTimer = setInterval(() => renderCanvasView(episodeId), 3000);
    } catch (e) { showToast(e.message, "error"); }
  };
  document.getElementById("btn-reproduce").onclick = (ev) =>
    armConfirm(ev.target, "补齐", () => reproduce(false));
  document.getElementById("btn-reproduce-force").onclick = (ev) =>

  document.getElementById("btn-script").onclick = () => showScriptOverlay(data, episodeId);
  document.getElementById("btn-play").onclick = () => openPlayer(data);
  const btnConfirm = document.getElementById("btn-confirm");
  if (btnConfirm) btnConfirm.onclick = async () => {
    btnConfirm.disabled = true;
    btnConfirm.textContent = "已确认,生产中…";
    try {
      await api("/api/confirm", {

        headers: { "Content-Type": "application/json" },

    if (!theaterMode) canvas.fit();
  };
  btnTheater.onclick = () => setView("theater");
  btnCanvas.onclick = () => setView("canvas");
  setView(localStorage.getItem("aifos.view") || "theater");
}
