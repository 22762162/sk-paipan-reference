<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIFOS V3.2 · AI 漫剧生产工作台演示</title>
<style>
/* AIFOS_DEMO_STYLE_START */
/* AIFOS V3.2 控制台 · 深色工作室主题
   色板:经 dataviz 校验的深色面板参考值
   surface #1a1a19 / page #0d0d0d / 主文字 #fff / 次要 #c3c2b7 / 弱化 #898781
   系列蓝(深色面)#3987e5;状态色 good/warning/serious/critical 固定,
   永远与图标或文字并用,不单靠颜色传义。 */

:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232322;
  --surface-3: #2c2c2a;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --hairline: rgba(255, 255, 255, 0.10);
  --grid: #2c2c2a;
  --accent: #3987e5;
  --accent-soft: rgba(57, 135, 229, 0.16);
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --radius: 10px;
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--page);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button {
  font-family: inherit; font-size: 13px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 7px 14px; cursor: pointer;
}
button:hover { background: var(--surface-3); }
button.primary { background: var(--accent); border-color: transparent; }
button.primary:hover { filter: brightness(1.1); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, select {
  font-family: inherit; font-size: 14px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 12px;
}
input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

/* ---- 顶栏 ---- */
#topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px; height: 52px; flex: none;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
}
.brand { display: flex; align-items: baseline; gap: 10px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark { font-weight: 700; font-size: 17px; letter-spacing: .06em; }
.brand-sub { color: var(--ink-3); font-size: 12px; }
#topbar-right { display: flex; gap: 10px; align-items: center; color: var(--ink-3); font-size: 12px; }

#app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.loading { padding: 48px; color: var(--ink-3); text-align: center; }

/* ---- 仪表盘 ---- */
.dash { padding: 20px; overflow-y: auto; display: grid; gap: 16px; }

.produce-bar {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.produce-bar input[name="sentence"] { flex: 2 1 320px; }
.produce-bar input[name="premise"] { flex: 1 1 200px; }
.style-field {
  flex: 1 1 230px; display: grid; gap: 3px; color: var(--ink-3);
  font-size: 10px;
}
.style-field select {
  width: 100%; min-height: 38px; padding: 8px 10px;
  color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--hairline); border-radius: 8px;
}
.produce-bar textarea {
  width: 100%; font-family: inherit; font-size: 13px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 12px; resize: vertical;
}
.produce-bar textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.series-import-tools {
  flex: 1 0 100%; display: grid;
  grid-template-columns: minmax(220px, 1.2fr) minmax(150px, .55fr) minmax(260px, 1fr);
  gap: 9px; align-items: center; padding: 11px;
  border: 1px solid rgba(89, 157, 255, .28); border-radius: 10px;
  background: rgba(45, 105, 190, .08);
}
.series-import-tools[hidden] { display: none; }
.series-file-picker, .series-start-field, .series-auto-field {
  display: flex; align-items: center; gap: 8px; min-height: 40px;
}
.series-file-picker {
  justify-content: center; border: 1px dashed rgba(120, 179, 255, .55);
  border-radius: 8px; color: #cfe4ff; cursor: pointer; font-weight: 700;
}
.series-file-picker:hover { background: rgba(89, 157, 255, .1); }
.series-file-picker input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.series-start-field span { white-space: nowrap; color: var(--ink-2); font-size: 12px; }
.series-start-field input { min-width: 0; width: 100%; }
.series-auto-field { color: var(--ink-2); font-size: 12px; }
.series-auto-field input { width: auto; }
.series-import-tools > small { grid-column: 1 / -1; color: var(--ink-3); }

.series-queues { display: grid; gap: 12px; margin: 14px 0; }
.series-queue {
  border: 1px solid rgba(89, 157, 255, .24); border-radius: 14px;
  background: linear-gradient(135deg, rgba(31, 76, 137, .18), rgba(17, 20, 27, .96));
  padding: 16px; box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
}
.series-queue-head { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
.series-queue-head h2 { margin: 3px 0 4px; font-size: 18px; }
.series-queue-head p { margin: 0; color: var(--ink-2); font-size: 12px; }
.series-auto { color: var(--ink-2); font-size: 12px; display: flex; gap: 7px; align-items: center; }
.series-auto input { width: auto; }
.series-progress { height: 4px; margin: 13px 0; background: rgba(255,255,255,.08); border-radius: 9px; overflow: hidden; }
.series-progress i { display: block; height: 100%; background: linear-gradient(90deg, #438eea, #7cc7ff); }
.series-episode-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 9px; }
.series-episode {
  min-width: 145px; max-width: 200px; padding: 9px 10px; border-radius: 9px;
  border: 1px solid rgba(255,255,255,.1); color: var(--ink); text-decoration: none;
  background: rgba(255,255,255,.035); display: grid; gap: 3px;
}
.series-episode span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.series-episode small { color: var(--ink-3); font-size: 10px; }
.series-episode.active { border-color: rgba(78, 170, 255, .7); background: rgba(54, 131, 221, .17); }
.series-episode.done { border-color: rgba(69, 191, 118, .45); }
.series-episode.needs_attention { border-color: rgba(242, 102, 102, .62); }
.series-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.button-link { display: inline-flex; align-items: center; text-decoration: none; }
.series-blocked { color: #ff9b9b; font-size: 12px; }

.series-preview-panel { width: min(980px, calc(100vw - 28px)); max-height: 92vh; }
.series-preview-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
.series-preview-summary > div { padding: 12px; border: 1px solid var(--line); border-radius: 9px; display: grid; }
.series-preview-summary b { font-size: 20px; }
.series-preview-summary span { color: var(--ink-3); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.series-preview-rule { color: var(--ink-2); background: rgba(52, 123, 212, .09); padding: 10px; border-radius: 8px; }
.series-import-error { color: #ffc1c1; background: rgba(190, 48, 48, .18); border: 1px solid rgba(240, 85, 85, .38); padding: 10px; border-radius: 8px; }
.series-preview-list { display: grid; gap: 8px; max-height: 48vh; overflow: auto; margin: 12px 0; }
.series-preview-item { border: 1px solid var(--line); border-radius: 9px; padding: 11px; }
.series-preview-item > div { display: flex; justify-content: space-between; gap: 10px; }
.series-preview-item p { color: var(--ink-2); margin: 7px 0; font-size: 12px; }
.series-preview-item small { color: var(--ink-3); }
.series-mode { font-size: 10px; border-radius: 99px; padding: 4px 8px; white-space: nowrap; }
.series-mode.script { color: #9fe2b8; background: rgba(44, 164, 92, .15); }
.series-mode.outline { color: #ffd69a; background: rgba(210, 133, 37, .14); }
.series-preview-actions { display: flex; justify-content: flex-end; gap: 9px; }

.queued-series-card { max-width: 820px; margin: 34px auto; padding: 28px; }
.queued-series-card h1 { margin: 8px 0; }
.queued-series-card > p { color: var(--ink-2); }
.queued-source-mode { padding: 11px; border-radius: 8px; background: rgba(50, 124, 211, .1); color: #cfe4ff; }
.queued-series-card blockquote { margin: 14px 0; padding: 13px; border-left: 3px solid var(--accent); color: var(--ink-2); background: rgba(255,255,255,.025); }
.produce-hint { width: 100%; color: var(--ink-3); font-size: 12px; }

.workflow-map {
  display: grid; grid-template-columns: minmax(220px, .75fr) 2fr; gap: 14px;
  background: linear-gradient(135deg, rgba(57, 135, 229, .12), rgba(12, 163, 12, .05));
  border: 1px solid rgba(57, 135, 229, .28); border-radius: var(--radius);
  padding: 16px;
}
.workflow-lead { display: grid; align-content: center; gap: 5px; }
.workflow-lead strong { font-size: 15px; }
.workflow-lead span { color: var(--ink-2); font-size: 12px; }
.workflow-lead a { font-size: 11px; margin-top: 3px; }
.workflow-steps { display: grid; grid-template-columns: repeat(8, minmax(78px, 1fr)); gap: 7px; }
.workflow-step {
  display: grid; align-content: center; min-height: 58px; padding: 8px;
  background: rgba(13, 13, 13, .5); border: 1px solid var(--hairline); border-radius: 8px;
}
.workflow-step b, .workflow-step em {
  color: #cfe4ff; font-size: 12px; font-style: normal; font-weight: 700;
}
.workflow-step span { color: var(--ink-3); font-size: 10px; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px 16px;
}
.tile .label { color: var(--ink-3); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
.tile .value small { font-size: 13px; color: var(--ink-3); font-weight: 400; }

.panel {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px;
}
.panel h2 {
  font-size: 13px; font-weight: 600; color: var(--ink-2);
  margin-bottom: 12px; letter-spacing: .04em;
}
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-3); font-weight: 500; font-size: 12px; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; }

/* 状态徽章:颜色 + 文字,不单靠颜色 */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: var(--surface-3); color: var(--ink-2);
  white-space: nowrap;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
.chip.done { color: #7fd97f; } .chip.done::before { background: var(--good); }
.chip.running { color: #ffd77a; } .chip.running::before { background: var(--warning); animation: pulse 1.2s infinite; }
.chip.qc_failed { color: #ffb598; } .chip.qc_failed::before { background: var(--serious); }
.chip.failed { color: #ff9d9d; } .chip.failed::before { background: var(--critical); }
.chip.awaiting_confirm { color: #ffd77a; } .chip.awaiting_confirm::before { background: var(--warning); }
.chip.paused { color: #9fcaff; } .chip.paused::before { background: #6599d6; }
@keyframes pulse { 50% { opacity: .3; } }

/* 成本条:单色蓝阶(数量级编码) */
.bar-row { display: grid; grid-template-columns: 110px 1fr 74px; gap: 10px; align-items: center; padding: 4px 0; }
.bar-row .name { color: var(--ink-2); font-size: 12px; }
.bar-row .val { text-align: right; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.bar-track { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 4px 4px 4px 4px; min-width: 2px; }

.asset-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.asset-chips .chip { background: var(--surface-2); }

.log-list { max-height: 220px; overflow-y: auto; font-size: 12px; color: var(--ink-2); }
.log-list div { padding: 3px 0; border-bottom: 1px solid var(--grid); }
.log-list .lv-WARN { color: var(--warning); }
.log-list .lv-ERROR { color: var(--critical); }
.produce-live #live-log {
  height: clamp(132px, 20dvh, 220px);
  min-height: 132px;
  max-height: 220px;
  overflow-y: auto;
  overflow-anchor: none;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
  contain: layout paint;
}

.empty { color: var(--ink-3); padding: 12px 0; }

/* ---- 画布视图 ---- */
.canvas-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.profile-strip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 16px; background: rgba(57, 135, 229, .08);
  border-bottom: 1px solid rgba(57, 135, 229, .22); color: var(--ink-2); font-size: 12px;
}
.profile-strip strong { color: #cfe4ff; margin-right: 4px; }
.profile-strip span {
  padding: 2px 8px; border-radius: 999px; background: rgba(13, 13, 13, .46);
  border: 1px solid var(--hairline);
}
.canvas-toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--hairline); flex: none;
}
.canvas-toolbar .title { font-weight: 650; font-size: 15px; }
.canvas-toolbar .spacer { flex: 1; }
.canvas-toolbar .hint { color: var(--ink-3); font-size: 12px; }
.episode-more-menu { position: relative; }
.episode-more-menu > summary {
  display: inline-flex; align-items: center; min-height: 32px; padding: 5px 11px;
  border: 1px solid var(--hairline); border-radius: 7px;
  background: var(--surface-2); color: var(--ink-2); cursor: pointer;
  font-size: 12px; list-style: none;
}
.episode-more-menu > summary::-webkit-details-marker { display: none; }
.episode-more-menu[open] > summary { border-color: var(--accent); color: #cfe4ff; }
.episode-more-menu > div {
  position: absolute; z-index: 30; top: calc(100% + 7px); right: 0;
  display: grid; gap: 5px; width: 190px; padding: 8px;
  border: 1px solid var(--hairline); border-radius: 9px;
  background: #171b20; box-shadow: 0 14px 34px rgba(0,0,0,.38);
}
.episode-more-menu button { width: 100%; text-align: left; }
.episode-workspace-nav {
  display: grid; grid-template-columns: repeat(8, minmax(112px, 1fr));
  gap: 6px; flex: none; padding: 8px 14px; overflow-x: auto;
  scrollbar-width: none; border-bottom: 1px solid rgba(95, 155, 255, .24);
  background: #0d131c;
}
.episode-workspace-nav::-webkit-scrollbar { display: none; }
.episode-workspace-stage {
  display: grid; grid-template-columns: 24px minmax(0, 1fr);
  gap: 1px 7px; min-width: 0; min-height: 48px; padding: 7px 9px;
  border-color: var(--hairline); border-radius: 9px;
  background: rgba(255,255,255,.025); text-align: left;
}
.episode-workspace-stage > b {
  grid-row: 1 / span 2; align-self: center; color: #7595b9;
  font-size: 10px; letter-spacing: .04em;
}
.episode-workspace-stage > span {
  overflow: hidden; color: var(--ink-2); font-size: 11px;
  text-overflow: ellipsis; white-space: nowrap;
}
.episode-workspace-stage > small {
  overflow: hidden; color: var(--ink-3); font-size: 8.8px;
  text-overflow: ellipsis; white-space: nowrap;
}
.episode-workspace-stage:hover, .episode-workspace-stage:focus-visible {
  border-color: #5e9ce4; background: rgba(57, 135, 229, .11);
}
.episode-workspace-stage.state-complete { border-color: rgba(48, 184, 112, .34); }
.episode-workspace-stage.state-attention { border-color: rgba(208, 59, 59, .46); }
.episode-workspace-stage.state-blocked { opacity: .72; }
.episode-workspace-stage.current {
  border-color: var(--accent); background: rgba(57, 135, 229, .18);
  box-shadow: inset 0 -2px 0 var(--accent);
}
.episode-workspace-stage.current > span { color: #fff; }
.zoom-group { display: flex; gap: 4px; }
.zoom-group button { padding: 5px 10px; font-size: 12px; }
.zoom-pct { min-width: 48px; text-align: center; color: var(--ink-2); font-size: 12px; align-self: center; }

.canvas-body {
  flex: 0 0 clamp(480px, calc(100dvh - 180px), 700px);
  height: clamp(480px, calc(100dvh - 180px), 700px);
  min-height: 0;
  display: flex;
}
#viewport {
  flex: 1; position: relative; overflow: hidden; cursor: grab;
  background-color: var(--page);
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  touch-action: none;
}
#viewport.panning { cursor: grabbing; }
#world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }

.canvas-stage-nav {
  display: flex; align-items: center; gap: 7px; flex: none;
  padding: 8px 14px; overflow-x: auto; scrollbar-width: none;
  background: #101722; border-bottom: 1px solid rgba(95, 155, 255, .24);
}
.canvas-stage-nav[hidden] { display: none; }
.canvas-stage-nav::-webkit-scrollbar { display: none; }
.canvas-stage-nav-label {
  flex: 0 0 auto; align-self: stretch;
  display: flex; align-items: center; padding: 0 10px 0 14px;
  color: var(--ink-2); font-size: 11px; white-space: nowrap;
}
.canvas-stage-jump {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  min-height: 32px; padding: 5px 9px; border-color: var(--hairline);
  background: rgba(255,255,255,.025); color: var(--ink-2); font-size: 11px;
}
.canvas-stage-jump b { color: #8dbdff; font-size: 10px; }
.canvas-stage-jump span {
  min-width: 20px; padding: 1px 5px; border-radius: 999px;
  background: var(--surface-3); color: var(--ink-3); text-align: center;
}
.canvas-stage-jump.state-done { border-color: rgba(44,164,92,.38); color: #a6ebbd; }
.canvas-stage-jump.state-generating { border-color: rgba(250,178,25,.46); color: #ffe09a; }
.canvas-stage-jump.state-failed, .canvas-stage-jump.state-stopped {
  border-color: rgba(208,59,59,.44); color: #ffadad;
}

.canvas-flow-line {
  position: absolute; height: 2px; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(95,155,255,.46) 0 10px,
    transparent 10px 18px);
}
.canvas-stage-board {
  position: absolute; width: 324px; overflow: hidden;
  background: #14181d; border: 1px solid var(--hairline);
  border-radius: 13px; box-shadow: 0 12px 30px rgba(0,0,0,.22);
  transition: border-color .16s, box-shadow .16s;
}
.canvas-stage-board::before {
  content: ""; position: absolute; left: -18px; top: 34px;
  width: 18px; height: 2px; background: rgba(95,155,255,.5);
}
.canvas-stage-board.state-done { border-color: rgba(44,164,92,.35); }
.canvas-stage-board.state-generating {
  border-color: rgba(250,178,25,.58); box-shadow: 0 0 0 2px rgba(250,178,25,.12),
    0 12px 30px rgba(0,0,0,.24);
}
.canvas-stage-board.state-failed, .canvas-stage-board.state-stopped {
  border-color: rgba(208,59,59,.52);
}
.canvas-stage-board.focused {
  border-color: #5f9bff; box-shadow: 0 0 0 3px rgba(95,155,255,.2),
    0 18px 40px rgba(0,0,0,.36);
}
.canvas-stage-board-head {
  position: relative; display: grid; grid-template-columns: 40px minmax(0,1fr) auto;
  align-items: center; gap: 9px; min-height: 68px; padding: 10px 12px;
  background: linear-gradient(135deg, rgba(57,135,229,.13), rgba(15,17,20,.5));
  border-bottom: 1px solid var(--hairline);
}
.canvas-stage-index {
  display: grid; place-items: center; width: 38px; height: 38px;
  border-radius: 10px; background: rgba(57,135,229,.16);
  color: #b8d6ff; font-weight: 750; font-size: 13px;
}
.canvas-stage-board-head h3 { margin: 0; color: var(--ink); font-size: 14px; }
.canvas-stage-board-head p {
  margin: 3px 0 0; color: var(--ink-3); font-size: 9.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.canvas-stage-state {
  padding: 3px 7px; border-radius: 999px; background: var(--surface-3);
  color: var(--ink-2); font-size: 9px; white-space: nowrap;
}
.state-done > .canvas-stage-board-head .canvas-stage-state { color: #9fe2b8; }
.state-generating > .canvas-stage-board-head .canvas-stage-state { color: #ffe09a; }
.state-failed > .canvas-stage-board-head .canvas-stage-state,
.state-stopped > .canvas-stage-board-head .canvas-stage-state { color: #ffadad; }
.canvas-stage-list { display: grid; }
.canvas-stage-item {
  width: 100%; min-height: 44px; display: grid;
  grid-template-columns: 34px minmax(0,1fr) auto; align-items: center; gap: 8px;
  margin: 0; padding: 5px 9px; border: 0; border-bottom: 1px solid var(--grid);
  border-radius: 0; background: transparent; color: inherit; text-align: left;
}
button.canvas-stage-item { cursor: pointer; }
button.canvas-stage-item:hover, button.canvas-stage-item:focus-visible {
  background: rgba(95,155,255,.09);
}
.canvas-stage-item:last-child { border-bottom: 0; }
.canvas-stage-item img, .canvas-stage-item-icon {
  width: 34px; height: 34px; border-radius: 6px; object-fit: cover;
  background: var(--surface-2);
}
.canvas-stage-item-icon {
  display: grid; place-items: center; color: var(--ink-3); font-size: 12px;
}
.canvas-stage-item-copy { min-width: 0; display: grid; gap: 2px; }
.canvas-stage-item-copy b {
  color: var(--ink); font-size: 10.5px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.canvas-stage-item-copy small {
  color: var(--ink-3); font-size: 8.5px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.canvas-stage-item-status {
  min-width: 42px; padding: 2px 5px; border-radius: 999px;
  background: var(--surface-3); color: var(--ink-3);
  font-size: 8px; text-align: center; white-space: nowrap;
}
.canvas-stage-item-status.status-done { color: #9fe2b8; }
.canvas-stage-item-status.status-generating { color: #ffe09a; }
.canvas-stage-item-status.status-failed,
.canvas-stage-item-status.status-stopped { color: #ffadad; }
.canvas-shot-zone-label {
  position: absolute; width: 320px; display: grid; gap: 3px;
  padding: 12px 14px; border-radius: 11px;
  background: rgba(57,135,229,.1); border: 1px solid rgba(57,135,229,.3);
}
.canvas-shot-zone-label b { color: #cfe4ff; font-size: 15px; }
.canvas-shot-zone-label span { color: var(--ink-3); font-size: 10px; }

.lane-label {
  position: absolute; width: 118px;
  color: var(--ink-2); font-size: 12px;
  padding: 8px 10px; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: 8px;
}
.lane-label .loc { color: var(--ink); font-weight: 600; display: block; }

.shot-card {
  position: absolute; width: 220px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); overflow: hidden;
  cursor: pointer; user-select: none;
  transition: box-shadow .12s;
}
.shot-card:hover { box-shadow: 0 0 0 2px var(--accent-soft); }
.shot-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.shot-card.qc-needs-human {
  border-color: rgba(208, 59, 59, .75);
  box-shadow: 0 0 0 2px rgba(208, 59, 59, .15);
}
.shot-card img { width: 100%; height: 124px; object-fit: cover; display: block; background: var(--surface-2); pointer-events: none; }
.shot-card .no-img { width: 100%; height: 124px; display: flex; align-items: center; justify-content: center; color: var(--ink-3); background: var(--surface-2); font-size: 12px; }
.shot-card .body { padding: 8px 10px 10px; }
.shot-card .head { display: flex; justify-content: space-between; align-items: baseline; }
.shot-card .sn { font-weight: 700; font-size: 13px; }
.shot-card .dur { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.shot-card .desc {
  color: var(--ink-2); font-size: 12px; margin-top: 3px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  min-height: 2.9em;
}
.badges { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.badge {
  font-size: 11px; padding: 1px 7px; border-radius: 5px;
  background: var(--surface-2); color: var(--ink-3);
  border: 1px solid var(--grid);
}
.badge.ok { color: #7fd97f; border-color: rgba(12,163,12,.35); }
.badge.miss { color: #ff9d9d; border-color: rgba(208,59,59,.4); }
.badge.qc { color: #ffb598; border-color: rgba(236,131,90,.4); }

/* 时间轴拆条 */
.timeline {
  display: flex; gap: 2px; padding: 8px 16px; flex: none;
  background: var(--surface); border-top: 1px solid var(--hairline);
  align-items: stretch; height: 46px;
}
.tl-seg {
  border-radius: 5px; background: var(--accent-soft);
  border: 1px solid rgba(57,135,229,.35);
  color: var(--ink-2); font-size: 11px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden; white-space: nowrap;
}
.tl-seg:hover { background: rgba(57,135,229,.3); }

/* 侧栏 */
#sidepanel {
  width: 360px; flex: none; overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--hairline);
  padding: 16px;
}
#sidepanel h3 { font-size: 15px; margin-bottom: 8px; }
#sidepanel h4 { font-size: 12px; color: var(--ink-3); margin: 14px 0 6px; font-weight: 600; letter-spacing: .04em; }
#sidepanel img.preview { width: 100%; border-radius: 8px; border: 1px solid var(--hairline); display: block; }
#sidepanel .thumbs { display: flex; gap: 8px; }
#sidepanel .thumbs figure { flex: 1; }
#sidepanel .thumbs img { width: 100%; border-radius: 6px; border: 1px solid var(--hairline); display: block; }
#sidepanel .thumbs figcaption { font-size: 11px; color: var(--ink-3); text-align: center; margin-top: 3px; }
#sidepanel .prompt {
  background: var(--surface-2); border-radius: 8px; padding: 10px;
  font-size: 12px; color: var(--ink-2); word-break: break-all;
}
#sidepanel ul.links { list-style: none; font-size: 13px; }
#sidepanel ul.links li { padding: 5px 0; border-bottom: 1px solid var(--grid); display: flex; justify-content: space-between; gap: 8px; }
#sidepanel ul.links li span:first-child { color: var(--ink-2); }
.issue { font-size: 12px; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; background: var(--surface-2); }
.issue.error { border-left: 3px solid var(--critical); }
.issue.warn { border-left: 3px solid var(--warning); }
.stage-list { list-style: none; }
.stage-list li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid var(--grid); font-size: 13px;
}
.stage-list .cost { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.dialogue { background: var(--surface-2); border-radius: 8px; padding: 10px; font-size: 13px; }
.dialogue b { color: var(--accent); }
.gate-list { display: grid; gap: 6px; }
.gate-item {
  display: flex; justify-content: space-between; gap: 8px;
  background: var(--surface-2); border-radius: 7px; padding: 7px 9px; font-size: 12px;
}
.gate-item.pass { border-left: 3px solid var(--good); }
.gate-item.fail { border-left: 3px solid var(--critical); }
.gate-item span { color: var(--ink-2); }
.contract-summary {
  display: grid; gap: 5px; background: rgba(57, 135, 229, .10);
  border: 1px solid rgba(57, 135, 229, .25); border-radius: 8px; padding: 10px;
  color: var(--ink-2); font-size: 12px;
}
.standard-snapshot {
  display: grid; gap: 5px; padding: 10px; border-radius: 8px;
  border: 1px solid rgba(57, 135, 229, .24); background: rgba(57, 135, 229, .08);
}
.standard-snapshot > div { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.standard-snapshot span, .standard-snapshot code, .standard-snapshot small { color: var(--ink-3); font-size: 10.5px; }
.qc-layers { display: grid; gap: 6px; }
.qc-layers div { background: var(--surface-2); border-radius: 7px; padding: 7px 9px; font-size: 12px; }
.review-link { display: inline-flex; margin-top: 8px; }
.state-box { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.state-box > div { background: var(--surface-2); border-radius: 7px; padding: 8px; font-size: 11px; }
.state-box b { display: block; color: var(--ink-3); margin-bottom: 3px; }
.dimension-list { display: grid; gap: 5px; }
.dimension-list li, .dimension-list > div {
  list-style: none; display: grid; grid-template-columns: 72px 1fr; gap: 7px;
  border-bottom: 1px solid var(--grid); padding: 5px 0; font-size: 12px;
}
.dialogue-part { margin-top: 5px; color: var(--ink-3); font-size: 11px; }
.dimension-list b { color: #cfe4ff; }
.dimension-list span { color: var(--ink-2); }
.text-contract {
  border-left: 3px solid var(--warning); background: rgba(250, 178, 25, .08);
  border-radius: 7px; padding: 8px 10px; color: var(--ink-2); font-size: 12px;
}

.titles-list { list-style: none; }
.titles-list li { padding: 5px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }

@media (max-width: 860px) {
  #sidepanel { position: absolute; right: 0; top: 0; bottom: 0; z-index: 5; box-shadow: -8px 0 24px rgba(0,0,0,.5); }
}

/* 开工向导 */
.kind-tabs { display: flex; gap: 8px; width: 100%; align-items: center; flex-wrap: wrap; }
.kind-label { color: var(--ink-3); font-size: 12px; }
.kind-tab {
  padding: 6px 14px; font-size: 13px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--hairline);
}
.kind-tab.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe4ff; }
.mode-tabs { display: flex; gap: 8px; width: 100%; }
.mode-tab {
  flex: 1; padding: 10px 14px; font-size: 14px;
  background: var(--surface-2); border: 1px solid var(--hairline);
}
.mode-tab.active { background: var(--accent-soft); border-color: var(--accent); color: #cfe4ff; }
.produce-bar button.primary { font-size: 15px; padding: 10px 26px; }

/* 制作进度条 */
.progress-card {
  background: var(--surface); border: 1px solid rgba(250, 178, 25, .4);
  border-radius: var(--radius); padding: 14px 16px;
}
.progress-text { font-size: 14px; margin-bottom: 10px; }
.progress-text span { color: var(--ink-2); margin-left: 10px; font-size: 13px; }
.progress-track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.progress-fill {
  height: 100%; background: var(--warning); border-radius: 5px;
  transition: width .6s ease;
}

/* 剧场模式(影视站观感) */
#theater { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }
.view-toggle button.active {
  background: var(--accent-soft); border-color: var(--accent); color: #cfe4ff;
}
.hero {
  position: relative; min-height: 320px;
  background-size: cover; background-position: center 20%;
  display: flex; align-items: flex-end;
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(13,13,13,.25) 0%,
    rgba(13,13,13,.55) 55%, var(--page) 96%);
}
.hero-content { position: relative; z-index: 1; padding: 30px 28px 22px; max-width: 720px; }
.hero-content h1 { font-size: 32px; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.hero-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.hero-meta .chip { background: rgba(0,0,0,.45); }
.hero-logline {
  color: var(--ink-2); font-size: 14px; margin-bottom: 14px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hero-actions { display: flex; gap: 10px; }
.hero-actions .primary { font-size: 15px; padding: 11px 26px; }
.button-link {
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--hairline);
  border-radius: 8px; padding: 9px 14px; font-size: 13px;
}
.button-link:hover { text-decoration: none; background: var(--surface-3); }
.cast-strip {
  display: flex; gap: 16px; padding: 14px 28px 4px; overflow-x: auto;
}
.cast-strip figure { margin: 0; text-align: center; flex: none; }
.cast-strip img {
  width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--hairline); display: block; margin: 0 auto;
  background: var(--surface-2);
}
.cast-strip figure:hover img { border-color: var(--accent); }
.cast-strip figcaption { font-size: 11px; color: var(--ink-2); margin-top: 4px; max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 分镜头生产表：直播生产与完成后审阅共用同一份逐镜合同 */
.shot-production-section {
  min-width: 0; margin: 14px 0; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden;
}
#theater .shot-production-section { margin: 16px 28px 28px; }
.produce-main > .shot-production-section { margin-top: 0; }
.shot-production-heading {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 16px 10px; border-bottom: 1px solid var(--grid);
}
.shot-production-heading > div:first-child { flex: 1; min-width: 240px; }
.shot-production-heading h2 { font-size: 17px; margin: 0 0 3px; }
.shot-production-heading p { color: var(--ink-3); font-size: 11.5px; margin: 0; }
.shot-production-progress { display: flex; gap: 6px; flex-wrap: wrap; }
.shot-production-progress span {
  padding: 4px 8px; border: 1px solid var(--hairline); border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.shot-table-filter-label {
  display: flex; align-items: center; gap: 6px; color: var(--ink-3); font-size: 11px;
}
.shot-table-filter-label select { min-width: 132px; padding: 6px 28px 6px 9px; }
.shot-table-filter-summary {
  padding: 6px 16px; background: rgba(57, 135, 229, .06);
  color: var(--ink-3); font-size: 11px;
}
.shot-production-table-wrap {
  max-width: 100%; overflow: auto; min-height: 0; scrollbar-gutter: stable;
  -webkit-overflow-scrolling: touch;
}
.shot-production-table {
  width: 100%; min-width: 1390px; border-collapse: separate; border-spacing: 0;
  table-layout: fixed; font-size: 12px;
}
.shot-production-table caption {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
}
.shot-production-table .col-sequence { width: 76px; }
.shot-production-table .col-duration { width: 92px; }
.shot-production-table .col-reference { width: 190px; }
.shot-production-table .col-frames { width: 192px; }
.shot-production-table .col-movement { width: 165px; }
.shot-production-table .col-description { width: 340px; }
.shot-production-table .col-sound { width: 235px; }
.shot-production-table .col-status { width: 150px; }
.shot-production-table th, .shot-production-table td {
  padding: 10px; vertical-align: top; border-right: 1px solid var(--grid);
  border-bottom: 1px solid var(--grid); overflow-wrap: anywhere;
}
.shot-production-table thead th {
  position: sticky; top: 0; z-index: 5; background: #202020;
  color: #d7e8ff; font-size: 11.5px; text-align: left;
}
.shot-production-table thead th:first-child { left: 0; z-index: 7; }
.storyboard-scene-row th {
  padding: 8px 12px; background: #191919; color: var(--ink);
  font-size: 12px; text-align: left; letter-spacing: .02em;
}
.storyboard-scene-row th span { color: var(--ink-3); font-weight: 400; margin-left: 8px; }
.storyboard-table-row { background: var(--surface); transition: background .12s; }
.storyboard-table-row:hover { background: rgba(57, 135, 229, .06); }
.storyboard-table-row.selected { background: rgba(57, 135, 229, .13); }
.storyboard-table-row.qc-needs-human { background: rgba(90, 22, 22, .14); }
.storyboard-table-row.qc-needs-human .storyboard-sequence {
  border-left-color: var(--critical);
}
.storyboard-table-row.qc-needs-human .storyboard-reference .storyboard-media-button {
  border-color: rgba(208, 59, 59, .72);
  box-shadow: 0 0 0 1px rgba(208, 59, 59, .18);
}
.storyboard-table-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.storyboard-table-row[hidden], .storyboard-scene-row[hidden] { display: none !important; }
.storyboard-sequence {
  position: sticky; left: 0; z-index: 2; background: inherit; text-align: left;
  border-left: 3px solid transparent;
}
.storyboard-table-row.selected .storyboard-sequence { border-left-color: var(--accent); }
.storyboard-sequence b { display: block; color: #fff; font-size: 14px; }
.storyboard-sequence span { display: block; color: #cfe4ff; font-size: 10.5px; margin-top: 2px; }
.storyboard-sequence small { display: block; color: var(--ink-3); font-size: 9.5px; margin-top: 5px; }
.storyboard-duration b {
  display: block; font-size: 14px; color: #fff; font-variant-numeric: tabular-nums;
}
.storyboard-duration span { display: block; margin-top: 5px; color: var(--ink-3); font-size: 10px; }
.storyboard-media-button {
  display: block; width: 100%; padding: 0; overflow: hidden; position: relative;
  border: 1px solid var(--hairline); border-radius: 7px; background: #111;
  cursor: zoom-in;
}
.storyboard-media-button img {
  display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
}
.shot-production-section.landscape .storyboard-media-button img { aspect-ratio: 16 / 9; }
.storyboard-media-button span {
  position: absolute; left: 4px; bottom: 4px; padding: 2px 5px;
  border-radius: 4px; background: rgba(0, 0, 0, .72); color: #fff; font-size: 9px;
}
.storyboard-media-empty {
  min-height: 118px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; border: 1px dashed var(--hairline);
  border-radius: 7px; background: var(--surface-2); color: var(--ink-3); text-align: center;
}
.storyboard-media-empty span { font-size: 10px; }
.storyboard-media-empty b { font-size: 10.5px; color: var(--ink-2); }
.storyboard-media-empty.state-generating { border-color: rgba(250, 178, 25, .55); }
.storyboard-media-empty.state-failed { border-color: rgba(208, 59, 59, .65); }
.shot-inline-revision { display: grid; gap: 6px; margin-top: 7px; }
.shot-revision-toggle {
  width: 100%; padding: 6px 8px; border: 1px solid rgba(57, 135, 229, .5);
  border-radius: 7px; background: var(--surface-2); color: #cfe4ff;
  font-size: 10.5px; text-align: center; cursor: pointer; list-style: none;
}
.shot-revision-toggle::-webkit-details-marker { display: none; }
.shot-inline-revision[open] .shot-revision-toggle {
  background: var(--accent-soft); border-color: var(--accent);
}
.shot-inline-revision:not([open]) .shot-revision-form { display: none; }
.shot-revision-form { display: grid; gap: 6px; }
.shot-revision-form textarea {
  width: 100%; min-width: 0; resize: vertical; box-sizing: border-box;
  padding: 7px; border: 1px solid var(--hairline); border-radius: 7px;
  background: var(--surface-2); color: var(--ink); font: inherit; line-height: 1.45;
}
.shot-revision-form select { width: 100%; min-width: 0; }
.shot-revision-actions { display: grid; grid-template-columns: 1fr; gap: 5px; }
.shot-revision-actions button { width: 100%; padding: 6px; font-size: 10.5px; }
.shot-revision-form > small, .shot-inline-revision-note {
  display: block; color: var(--ink-3); font-size: 9px; line-height: 1.45;
}
.storyboard-frame-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.storyboard-frame-item { min-width: 0; }
.storyboard-frame-item .frame-inline-revision { margin-top: 5px; }
.storyboard-frame-pair .storyboard-media-empty { min-height: 110px; }
#sidepanel .editable-frame-thumbs { align-items: start; }
#sidepanel .editable-frame-thumbs figure { min-width: 0; }
#sidepanel .editable-frame-thumbs .shot-revision-form {
  padding: 7px; border: 1px solid var(--hairline); border-radius: 7px;
  background: var(--surface-1);
}
.storyboard-camera { display: grid; gap: 5px; }
.storyboard-camera b { color: #cfe4ff; font-size: 13px; }
.storyboard-camera span { color: var(--ink-2); }
.storyboard-camera small { color: var(--ink-3); line-height: 1.45; }
.storyboard-description > p { color: var(--ink); line-height: 1.55; margin: 0 0 8px; }
.storyboard-cast { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.storyboard-cast > span {
  border: 1px solid rgba(57, 135, 229, .28); border-radius: 999px;
  padding: 2px 6px; color: #cfe4ff; background: rgba(57, 135, 229, .08); font-size: 10px;
}
.storyboard-cast small { width: 100%; color: var(--ink-3); font-size: 9.5px; }
.storyboard-cast.mismatch small { color: var(--critical); }
.storyboard-inner-persona {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 6px;
}
.storyboard-inner-persona > span {
  padding: 2px 7px; border: 1px solid #8e6bc6; border-radius: 999px;
  background: rgba(100, 68, 150, .16); color: #d9c4ff; font-size: 10px;
}
.storyboard-inner-persona small {
  width: 100%; color: #b79bdc; font-size: 9.5px;
}
.storyboard-description details { margin-top: 8px; color: var(--ink-3); font-size: 10.5px; }
.storyboard-description summary { color: var(--accent); cursor: pointer; }
.storyboard-description details div { margin-top: 5px; line-height: 1.45; }
.storyboard-sound { display: grid; gap: 7px; }
.storyboard-dialogue { padding: 7px; border-radius: 7px; background: var(--surface-2); }
.storyboard-dialogue b { display: block; color: var(--accent); font-size: 10.5px; }
.storyboard-dialogue span { display: block; margin-top: 3px; color: var(--ink); line-height: 1.45; }
.storyboard-no-dialogue { color: var(--ink-3); }
.storyboard-sound dl { display: grid; gap: 4px; margin: 0; }
.storyboard-sound dl > div { display: grid; grid-template-columns: 34px 1fr; gap: 5px; }

.production-issue-center {

.production-progress-head {

  border-bottom: 1px solid var(--grid);
}

  display: flex; align-items: center; gap: 10px; min-width: 0;
}

  color: var(--ink-3); font-size: 10.5px; line-height: 1.45;

}

}

}

}

  display: grid; grid-template-columns: 1.25fr repeat(4, minmax(100px, 1fr));

}

}

.production-progress-active {
  display: grid; gap: 8px; padding: 10px 12px;
}
.production-progress-active > b { color: #cfe4ff; font-size: 10.5px; }
.production-progress-active-list {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 7px;
}
.production-progress-active-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr);
  gap: 3px 7px; align-items: center; min-width: 0; padding: 8px 9px;

  border-radius: 8px; background: rgba(250, 178, 25, .06); cursor: pointer;
}

  border-color: var(--warning); background: rgba(250, 178, 25, .11);
}

}

}
.production-progress-active-item small {
  min-width: 0; color: var(--ink-3); font-size: 9.5px;

}

  gap: 6px; margin-top: 8px;
}

  border: 1px solid var(--grid); border-radius: 6px; background: var(--surface-2);
}

.production-progress-categories small {
  color: var(--ink-3); font-size: 9.5px; font-variant-numeric: tabular-nums;
}
.production-ledger-summary {

}

.image-failure-panel {

}

}

}

.generation-failure-heading {

}

.generation-issue-list { display: grid; gap: 8px; }

.generation-diagnosis-section ul {

.production-ledger-stage {

.production-ledger-stage.running { color: #ffd36a; border-color: rgba(250, 178, 25, .4); }
.production-audit-records {

}
.production-audit-records > summary {

}
.production-audit-records > summary::-webkit-details-marker { display: none; }
.production-audit-records > summary > span { display: grid; gap: 2px; }
.production-audit-records > summary b { color: #cfe4ff; font-size: 11px; }
.production-audit-records > summary small { color: var(--ink-3); font-size: 9px; }
.production-audit-records > summary strong {
  color: var(--ink-2); font-size: 10px; font-variant-numeric: tabular-nums;
}
.production-audit-records[open] > summary {

}
.production-audit-records-body { min-width: 0; }
.production-ledger-controls {
  display: flex; align-items: end; justify-content: space-between; gap: 10px;
  padding: 8px 16px; background: rgba(57, 135, 229, .05);
}
.production-ledger-controls label { display: flex; align-items: center; gap: 7px; color: var(--ink-3); font-size: 11px; }
.production-ledger-controls select {
  min-width: 148px; padding: 6px 9px; border: 1px solid var(--hairline);
  border-radius: 7px; background: var(--surface-2); color: var(--ink);
}
.production-ledger-filter-summary { color: var(--ink-3); font-size: 10.5px; }
.production-ledger-table-wrap { max-width: 100%; overflow: auto; -webkit-overflow-scrolling: touch; }
.production-ledger-table {
  width: 100%; min-width: 1050px; border-collapse: separate; border-spacing: 0;
  table-layout: fixed; font-size: 11.5px;
}
.production-ledger-table th, .production-ledger-table td {
  padding: 9px 10px; vertical-align: top; border-right: 1px solid var(--grid);
  border-bottom: 1px solid var(--grid); overflow-wrap: anywhere;
}
.production-ledger-table thead th {
  position: sticky; top: 0; z-index: 2; background: #202020;
  color: #d7e8ff; font-size: 11px; text-align: left;
}
.production-ledger-table thead th:nth-child(1) { width: 180px; }
.production-ledger-table thead th:nth-child(2) { width: 135px; }
.production-ledger-table thead th:nth-child(3) { width: 270px; }
.production-ledger-table thead th:nth-child(4) { width: 120px; }
.production-ledger-table thead th:nth-child(5) { width: 112px; }
.production-ledger-row { background: var(--surface); transition: background .12s; }
.production-ledger-row:hover { background: rgba(57, 135, 229, .06); }
.production-ledger-row[hidden] { display: none !important; }
.production-ledger-object { text-align: left; border-left: 3px solid transparent; }
.production-ledger-row.state-generating .production-ledger-object { border-left-color: var(--warning); }
.production-ledger-row.state-failed .production-ledger-object { border-left-color: var(--critical); }
.production-ledger-row.state-awaiting_human .production-ledger-object { border-left-color: var(--critical); }
.production-ledger-object b { display: block; color: var(--ink); font-size: 12px; }
.production-ledger-object small, .production-ledger-table td > small,
.production-ledger-stage-label + small { display: block; margin-top: 3px; color: var(--ink-3); font-size: 10px; }
.production-ledger-story { display: grid; gap: 2px; margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--hairline); color: var(--ink-2); font-size: 10px; line-height: 1.4; }
.production-ledger-story b { color: #cfe4ff; font-size: 10px; font-weight: 600; }
.production-ledger-story small { margin-top: 0; overflow-wrap: anywhere; }
.production-ledger-stage-label { color: #cfe4ff; }
.production-ledger-ref-list { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.production-ledger-ref {
  display: inline-flex; align-items: center; gap: 4px; max-width: 125px;
  padding: 3px 5px; border: 1px solid var(--hairline); border-radius: 6px;
  background: var(--surface-2); color: var(--ink-2); font: inherit; font-size: 9.5px;
  text-align: left;
}
.production-ledger-ref-preview { cursor: zoom-in; }
.production-ledger-ref-preview:hover, .production-ledger-ref-preview:focus-visible {
  border-color: var(--accent); background: rgba(57, 135, 229, .12);
  outline: none;
}
.production-ledger-ref.expected { border-style: dashed; color: var(--ink-3); }
.production-ledger-ref img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; flex: none; }
.production-ledger-ref b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.production-ledger-ref-list > small { color: var(--ink-3); font-size: 9.5px; }
.production-ledger-ref-list > .production-ledger-expected { width: 100%; color: #9fcaff; }
.production-ledger-missing { color: #ff9d9d; font-size: 10.5px; }
.production-ledger-no-ref { color: var(--ink-3); font-size: 10.5px; }
.production-ledger-output-list { display: flex; gap: 5px; }
.production-ledger-preview {
  width: 45px; height: 45px; padding: 0; overflow: hidden; border: 1px solid var(--hairline);
  border-radius: 5px; background: #080a0d; cursor: zoom-in;
}
.production-ledger-preview img { display: block; width: 100%; height: 100%; object-fit: cover; }
.production-ledger-video-output, .production-ledger-action {
  padding: 5px 7px; border: 1px solid rgba(57, 135, 229, .42); border-radius: 6px;
  background: var(--surface-2); color: #cfe4ff; font-size: 10.5px; cursor: pointer;
}
.production-ledger-video-output:hover, .production-ledger-action:hover { border-color: var(--accent); background: var(--accent-soft); }
.production-ledger-output-empty { color: var(--ink-3); font-size: 10.5px; }
.production-ledger-status {
  display: inline-flex; padding: 3px 7px; border: 1px solid var(--hairline);
  border-radius: 5px; color: var(--ink-3); font-size: 10.5px; white-space: nowrap;
}
.production-ledger-status.status-done, .production-ledger-status.status-reused,
.production-ledger-status.status-selected { color: #8de18d; border-color: rgba(12, 163, 12, .35); }
.production-ledger-status.status-generating { color: #ffd36a; border-color: rgba(250, 178, 25, .45); }
.production-ledger-status.status-failed { color: #ff9d9d; border-color: rgba(208, 59, 59, .55); }
.production-ledger-status.status-retrying { color: #ffd36a; border-color: rgba(250, 178, 25, .45); }
.production-ledger-status.status-awaiting_human { color: #ff9d9d; border-color: rgba(208, 59, 59, .55); }
.production-ledger-status.status-selected { color: #9fcaff; border-color: rgba(57, 135, 229, .45); }
.production-ledger-warning { color: #ffadad !important; }
.production-ledger-intervention { display: grid; gap: 6px; }
.production-ledger-issue { color: #ff9d9d; line-height: 1.45; }
.production-ledger-ok, .production-ledger-no-action { color: var(--ink-3); font-size: 10.5px; }
.production-ledger-empty { padding: 26px 16px; color: var(--ink-3); text-align: center; }

.scene-row { padding: 12px 28px 4px; }
.scene-row h3 { font-size: 15px; margin-bottom: 10px; }
.scene-row h3 span { color: var(--ink-3); font-size: 12px; font-weight: 400; margin-left: 10px; }
.row-scroll {
  display: flex; gap: 12px; overflow-x: auto;
  padding: 6px 4px 18px; scroll-snap-type: x proximity;
}
.t-card {
  flex: 0 0 150px; position: relative; border-radius: 10px; overflow: hidden;
  cursor: pointer; scroll-snap-align: start; background: #000;
  border: 1px solid var(--hairline);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s;
}
.t-card.landscape { flex-basis: 260px; }
.t-card img { width: 100%; aspect-ratio: 9 / 16; object-fit: cover; display: block; }
.t-card.landscape img { aspect-ratio: 16 / 9; }
.t-empty {
  width: 100%; aspect-ratio: 9 / 16; display: flex; align-items: center;
  justify-content: center; color: var(--ink-3); font-size: 12px;
  background: var(--surface-2);
}
.t-card:hover {
  transform: scale(1.07); z-index: 2;
  box-shadow: 0 10px 32px rgba(0, 0, 0, .65);
  border-color: var(--accent);
}
.t-info {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 9px 8px;
  background: linear-gradient(transparent, rgba(0,0,0,.88));
  font-size: 11px; color: var(--ink-2); pointer-events: none;
}
.t-info b { color: #fff; }
.t-line {
  color: #fff; margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.t-play {
  position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(57, 135, 229, .92); color: #fff; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .15s; pointer-events: none;
}
.t-card:hover .t-play { opacity: 1; }
.t-detail {
  position: absolute; top: 6px; right: 6px; z-index: 3;
  width: 26px; height: 26px; border-radius: 50%; padding: 0;
  font-size: 13px; background: rgba(0,0,0,.55); border-color: transparent;
  opacity: 0; transition: opacity .15s;
}
.t-card:hover .t-detail { opacity: 1; }

/* 确认横幅与人物/场景画廊 */
.confirm-banner {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  background: rgba(250, 178, 25, .1);
  border-bottom: 1px solid rgba(250, 178, 25, .4);
  padding: 12px 18px; flex: none;
}
.confirm-banner b { display: block; margin-bottom: 2px; }
.confirm-banner span { color: var(--ink-2); font-size: 13px; }
/* 失败横幅:红色示警,一键从断点继续 */
.confirm-banner.fail-banner {
  background: rgba(248, 81, 73, .1);
  border-bottom: 1px solid rgba(248, 81, 73, .45);
}
.episode-resume { white-space: nowrap; }
.confirm-banner > div { flex: 1; min-width: 260px; }
.confirm-banner button { font-size: 15px; padding: 11px 22px; white-space: nowrap; }
.cast-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cast-actions button:not(.primary) { color: var(--ink-2); }
.cast-asset-policy {
  display: grid; gap: 5px; min-width: min(100%, 300px);
  padding: 9px 11px; border: 1px solid rgba(250, 178, 25, .3);
  border-radius: 9px; background: rgba(0, 0, 0, .08);
}
.cast-asset-policy label { display: grid; gap: 5px; }
.cast-asset-policy label b { margin: 0; font-size: 12px; }
.cast-asset-policy select { width: 100%; min-height: 44px; }
.cast-asset-policy > span { line-height: 1.45; }

/* 人物5选1定版：最终立绘是后续所有含人物图片的视觉身份锚点 */
.cast-selection-list { padding: 18px; display: grid; gap: 18px; overflow: auto; }
.cast-choice { margin: 0; }
.cast-choice-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.cast-choice-head h2 { margin: 0 0 3px; }
.cast-locked { color: var(--good); }
.cast-unlocked { color: var(--warning); }
.cast-candidate-grid { display: grid; grid-template-columns: repeat(4, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; padding: 3px; }
.cast-candidate { border: 2px solid var(--hairline); border-radius: 12px; overflow: hidden; background: var(--surface-2); display: flex; flex-direction: column; min-width: 0; }
.cast-candidate.selected { border-color: var(--good); box-shadow: 0 0 0 3px rgba(12, 163, 12, .18); }
.cast-image { display: block; width: 100%; padding: 0; border: 0; border-radius: 0; background: #111; aspect-ratio: 9 / 16; overflow: hidden; cursor: zoom-in; }
.cast-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cast-candidate-foot { padding: 10px; display: grid; gap: 9px; height: 100%; align-content: start; }
.cast-candidate-title { display: grid; gap: 2px; text-align: center; }
.cast-candidate-title span { color: var(--ink-3); font-size: 11px; }
.cast-candidate-title b { color: var(--ink); font-size: 14px; }
.cast-look { display: grid; gap: 6px; min-width: 0; }
.cast-look > b { color: var(--accent); font-size: 12px; }
.cast-look dl { display: grid; gap: 5px; margin: 0; }
.cast-look dl > div { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 5px; align-items: start; }
.cast-look dt { color: var(--ink-3); font-size: 10px; line-height: 1.45; }
.cast-look dd { margin: 0; color: var(--ink-2); font-size: 10px; line-height: 1.45; overflow-wrap: anywhere; }
.cast-look.legacy { padding: 8px; border-radius: 8px; background: rgba(250, 178, 25, .1); }
.cast-look.legacy b { color: var(--warning); }
.cast-look.legacy span { color: var(--ink-2); font-size: 11px; line-height: 1.45; }
.cast-pick { min-height: 44px; margin-top: auto; }
.cast-pick.selected { color: var(--good); border-color: var(--good); }

@media (max-width: 760px) {
  .cast-selection-list { padding: 10px; }
  .cast-choice-head { align-items: flex-start; flex-direction: column; gap: 5px; }
  .cast-candidate-grid { display: flex; gap: 10px; margin-inline: -3px; padding: 3px 3px 10px; scroll-snap-type: x mandatory; overscroll-behavior-inline: contain; }
  .cast-candidate { flex: 0 0 min(78vw, 310px); scroll-snap-align: start; }
  .cast-look dd { font-size: 11px; }
  .cast-select-view .confirm-banner { align-items: stretch; }
  .cast-select-view .confirm-banner button { width: 100%; }
  .cast-asset-policy { width: 100%; }
  .cast-actions { width: 100%; }
}
.progress-card.confirm {
  border-color: rgba(250, 178, 25, .5);
  display: flex; align-items: center; gap: 14px;
}
.progress-card.confirm .progress-text { flex: 1; margin: 0; }
.art-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.art-grid figure { margin: 0; }
.art-grid img {
  width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
  border-radius: 8px; border: 1px solid var(--hairline); display: block;
}
.art-grid figcaption {
  font-size: 11px; color: var(--ink-2); text-align: center; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 打磨:剧本重写与图片重画 */
.revise-bar { margin: 12px 0; display: grid; gap: 8px; }
.revise-bar textarea, #edit-area textarea {
  width: 100%; font-family: inherit; font-size: 13px;
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 8px;
  padding: 8px 12px; resize: vertical;
}
.revise-actions { display: flex; gap: 8px; flex-wrap: wrap; }
#edit-area { display: grid; gap: 8px; margin-bottom: 8px; }
.regen-box { margin-top: 4px; }
.regen-toggle { width: 100%; font-size: 11px; padding: 4px 6px; }
.regen-form { display: flex; gap: 6px; margin-top: 4px; }
.regen-form input {
  flex: 1; min-width: 0; font-size: 11px; padding: 5px 8px;
}
.regen-form button { font-size: 11px; padding: 4px 10px; white-space: nowrap; }
.io-box { display: flex; gap: 6px; margin-top: 4px; }
.io-box button { flex: 1; font-size: 11px; padding: 4px 6px; }
.io-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.io-row > span { color: var(--ink-2); font-size: 12px; width: 34px; flex: none; }
.io-row .io-box { flex: 1; margin: 0; }

/* 整集播放器 */
.player-overlay {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(0, 0, 0, .82);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.player-box {
  width: min(560px, 96vw); max-height: 96vh;
  display: flex; flex-direction: column; gap: 10px;
}
.player-head { display: flex; align-items: center; gap: 12px; color: var(--ink); font-size: 14px; }
.player-head .player-pos { color: var(--ink-3); font-size: 12px; flex: 1; }
.player-stage {
  position: relative; width: 100%; aspect-ratio: 9 / 16;
  max-height: 74vh; background: #000; border-radius: 14px;
  overflow: hidden; border: 1px solid var(--hairline);
  align-self: center;
}
.player-stage img, .player-stage video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; background: #000;
}
#pl-b { opacity: 0; }
#pl-b.fade-in { opacity: 1; transition-property: opacity; transition-timing-function: linear; }
.player-big {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 84px; height: 84px; border-radius: 50%; font-size: 30px;
  background: rgba(57, 135, 229, .92); border: none; color: #fff;
}
.player-big:hover { background: var(--accent); }
.player-bar { display: flex; align-items: center; gap: 12px; }
.player-track {
  flex: 1; height: 10px; background: var(--surface-2);
  border-radius: 5px; cursor: pointer; overflow: hidden;
}
.player-fill { height: 100%; background: var(--accent); transition: width .3s; }
.player-time { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.play-cta { width: 100%; margin-bottom: 12px; font-size: 14px; padding: 11px; }

/* 页面内置提示 */
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 50; max-width: min(560px, 90vw);
  background: var(--surface-2); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 10px;
  padding: 11px 18px; font-size: 13.5px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
}
.toast.error { border-color: rgba(208, 59, 59, .55); color: #ffb0b0; }
.toast.ok { border-color: rgba(12, 163, 12, .5); color: #8fdd8f; }

/* 内联播放器 */
.player { width: 100%; border-radius: 8px; border: 1px solid var(--hairline); margin: 6px 0; display: block; background: #000; }
audio.player { background: var(--surface-2); }

/* 剧本阅读覆盖层 */
.script-overlay {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(0, 0, 0, .62);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 40px 16px; overflow-y: auto;
}
.script-panel {
  width: min(720px, 100%); background: var(--surface);
  border: 1px solid var(--hairline); border-radius: 14px;
  padding: 24px 28px; margin-bottom: 40px;
}
.script-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.script-head h3 { font-size: 17px; }
.script-panel .logline { color: var(--ink-2); margin: 10px 0 12px; }
.script-panel .cast { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.script-panel .scene { margin-top: 18px; border-top: 1px solid var(--grid); padding-top: 14px; }
.script-panel .scene h4 { font-size: 14px; margin-bottom: 8px; color: var(--accent); }
.script-panel .action { color: var(--ink-3); font-size: 13px; margin-bottom: 8px; }
.script-panel .line { padding: 4px 0; font-size: 14px; }
.script-panel .line b { color: var(--ink-2); margin-right: 10px; }

/* ---------- 项目改名 ---------- */
.mini-btn {
  font-size: 12px; padding: 3px 9px; margin-left: 8px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--hairline); border-radius: 7px; cursor: pointer;
  vertical-align: middle;
}
.mini-btn:hover { color: var(--ink); border-color: var(--accent); }
.hero-content h1 .mini-btn {
  background: rgba(0, 0, 0, .35); font-size: 14px; padding: 4px 11px;
}
.rename-panel { width: min(460px, 100%); }
.rename-row { display: flex; gap: 10px; margin-top: 6px; }
.rename-row input {
  flex: 1; background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: 9px; color: var(--ink); padding: 10px 14px; font-size: 15px;
}

/* ---------- 设置中心 ---------- */
.settings {
  display: flex; flex-direction: column; gap: 18px;
  padding: 20px; overflow-y: auto;
}
.settings-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.settings-head h1 { font-size: 20px; }
.settings-head .hint { color: var(--ink-3); font-size: 13px; }
.icloud-sync-card { display: grid; gap: 12px; }
.icloud-sync-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.icloud-sync-head h2 { font-size: 17px; margin: 0 0 4px; }
.icloud-sync-head p { margin: 0; color: var(--ink-3); font-size: 13px; }
.icloud-sync-card code { overflow-wrap: anywhere; color: var(--ink-2); }
.icloud-sync-stats { display: flex; flex-wrap: wrap; gap: 18px; color: var(--ink-2); }
.icloud-sync-card small { color: var(--ink-3); line-height: 1.5; }
.dim { color: var(--ink-3); }
.route-table { width: 100%; }
.route-table small { margin-left: 6px; }
.route-input {
  width: 100%; background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: 8px; color: var(--ink); padding: 7px 11px; font-size: 13px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.settings-grid {
  display: grid; gap: 16px;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
}
.provider-card .pc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.provider-card .pc-head h2 { margin: 0; flex: 1; min-width: 0; }
.provider-card .pc-caps { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
.set-row { display: flex; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
.set-row > span { width: 76px; flex: none; color: var(--ink-3); }
.set-row input:not([type="checkbox"]) {
  flex: 1; min-width: 0; background: var(--surface-2);
  border: 1px solid var(--hairline); border-radius: 8px;
  color: var(--ink); padding: 8px 11px; font-size: 13px;
}
.set-row input:focus { border-color: var(--accent); outline: none; }
.set-row.toggle input { width: 17px; height: 17px; accent-color: var(--accent); }
.set-row.toggle em { color: var(--ink-3); font-style: normal; font-size: 12px; }
.pc-actions { display: flex; gap: 10px; margin-top: 12px; }
.pc-status { margin-top: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.pc-status .ok { color: var(--good); }
.pc-status .miss { color: var(--serious); }

/* Codex 多通道配置与图片任务分片 */
.codex-execution-panel {
  display: grid; gap: 15px; padding: 18px;
  border-color: rgba(57, 135, 229, .36);
  background:
    radial-gradient(circle at 92% -30%, rgba(57, 135, 229, .18), transparent 42%),
    var(--surface);
}
.codex-execution-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
}
.codex-execution-head h2 { margin: 0; font-size: 18px; }
.codex-execution-head p {
  margin: 5px 0 0; color: var(--ink-3); font-size: 12.5px; line-height: 1.5;
}
.codex-channel-grid, .codex-shard-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
}
.codex-channel-card, .codex-shard-card {
  min-width: 0; padding: 14px; border: 1px solid var(--hairline);
  border-radius: 11px; background: rgba(13, 13, 13, .48);
}
.codex-channel-head, .codex-shard-title {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.codex-channel-head > div, .codex-shard-title {
  min-width: 0; flex-wrap: wrap;
}
.codex-channel-head strong, .codex-shard-title strong {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px;
}
.codex-channel-badge {
  display: inline-flex; align-items: center; min-height: 24px; padding: 3px 8px;
  margin-right: 7px; border: 1px solid rgba(57, 135, 229, .38);
  border-radius: 7px; background: var(--accent-soft); color: #bcdcff;
  font-size: 10.5px; font-weight: 800; letter-spacing: .04em;
}
.codex-set-row { align-items: flex-start; }
.codex-set-row > span { width: 150px; line-height: 1.35; padding-top: 7px; }
.codex-set-row input:not([type="checkbox"]) {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.codex-toggle > span { width: 150px; }
.codex-channel-runtime, .codex-shard-stats {
  display: grid; gap: 7px; margin-top: 12px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.codex-channel-runtime span, .codex-shard-stats span {
  min-width: 0; padding: 7px 8px; border-radius: 7px;
  background: var(--surface-2); color: var(--ink-3); font-size: 10.5px;
}
.codex-channel-runtime b, .codex-shard-stats b {
  color: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums;
}
.codex-channel-error {
  margin: 8px 0 0; color: var(--serious); font-size: 11.5px;
  overflow-wrap: anywhere;
}
.codex-profile-actions {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.codex-profile-actions span { font-size: 11.5px; }
.codex-shard-board {
  display: grid; gap: 11px; padding-top: 15px; border-top: 1px solid var(--hairline);
}
.codex-shard-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.codex-shard-head h3 { margin: 0; font-size: 14px; }
.codex-shard-head p { margin: 4px 0 0; color: var(--ink-3); font-size: 11.5px; }
.codex-shard-title { justify-content: flex-start; }
.codex-shard-title .chip { margin-left: auto; }
.codex-shard-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.codex-shard-stats span { display: grid; gap: 2px; }
.codex-progress {
  height: 7px; margin-top: 11px; overflow: hidden; border-radius: 999px;
  background: var(--surface-2);
}
.codex-progress i {
  display: block; height: 100%; border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), #7cc7ff);
  transition: width .25s ease;
}
.codex-shard-card > small {
  display: block; margin-top: 5px; color: var(--ink-3); font-size: 10.5px;
}
.codex-shard-note { margin: 0; color: var(--ink-3); font-size: 10.5px; }
.codex-shard-note.compat { color: #d7ab74; }

/* ---------- 产线状态条 / 实际产线标注 ---------- */
.pipeline-row {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 12px; padding: 10px 14px; margin-bottom: 16px;
  font-size: 12.5px;
}
.pipeline-label { color: var(--ink-3); margin-right: 2px; }
.pipe-chip {
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hairline);
  color: var(--ink-3); background: var(--surface-2);
}
.pipe-chip.real { color: var(--good); border-color: rgba(12, 163, 12, .45); }
.pipe-link { margin-left: auto; color: var(--accent); text-decoration: none; }
.pipe-link:hover { text-decoration: underline; }
.stage-list .prov { color: var(--ink-3); font-size: 11px; }
.stage-list .prov.real { color: var(--good); }

/* ---------- 设置简化:高级折叠 / 提示 ---------- */
.pc-note { color: var(--ink-3); font-size: 12px; margin: 2px 0 4px; }
.pc-advanced, .route-panel { margin-top: 8px; }
.pc-advanced summary, .route-panel summary {
  cursor: pointer; color: var(--ink-3); font-size: 12.5px;
  padding: 6px 0; user-select: none;
}
.pc-advanced summary:hover, .route-panel summary:hover { color: var(--ink); }
.route-panel { padding: 14px 18px; }
.route-panel table { margin-top: 10px; }

/* 图片模型成本护栏：设置页与生产清单共用 */
.image-cost-guide {
  padding: 14px; border: 1px solid rgba(57, 135, 229, .32);
  border-radius: 12px; background: linear-gradient(135deg, rgba(57, 135, 229, .1), rgba(13, 13, 13, .28));
}
.image-cost-guide-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 10px;
}
.image-cost-guide-head b { color: #cfe4ff; font-size: 13px; }
.image-cost-guide-head span { color: var(--ink-3); font-size: 11px; text-align: right; }
.image-cost-options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.image-cost-option {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px;
  min-width: 0; padding: 10px; border: 1px solid var(--hairline);
  border-radius: 9px; background: rgba(13, 13, 13, .56);
}
.image-cost-option strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.image-cost-option > b { color: #bcdcff; font-size: 11px; white-space: nowrap; }
.image-cost-option span, .image-cost-option small { grid-column: 1 / -1; }
.image-cost-option span { color: var(--ink-2); font-size: 11px; font-weight: 650; }
.image-cost-option small { color: var(--ink-3); font-size: 10px; }
.image-cost-option.batch { border-color: rgba(12, 163, 12, .34); }
.image-cost-option.expensive { border-color: rgba(236, 131, 90, .55); background: rgba(236, 131, 90, .08); }
.image-cost-option.expensive > b, .image-cost-option.expensive span { color: #ffb598; }
.image-cost-rule {
  display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap;
  margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--hairline);
  color: var(--ink-2); font-size: 10.5px;
}
.image-cost-rule b { color: #cfe4ff; }
.image-cost-rule .danger { color: #ffb598; }
.image-cost-guide.compact { margin: 8px 0 10px; padding: 10px; }
.pc-cost {
  margin: 8px 0 5px; padding: 7px 9px; border-radius: 8px;
  background: var(--surface-2); color: var(--ink-2); font-size: 11.5px;
}
.pc-cost b { color: #bcdcff; }
.pc-cost.batch b { color: #7fd97f; }
.pc-cost.standard b { color: #ffd09a; }

@media (max-width: 1100px) {
  .workflow-map { grid-template-columns: 1fr; }
  .workflow-steps { grid-template-columns: repeat(4, 1fr); }
}

@media (max-width: 720px) {
  .dash { padding: 12px; }
  .settings { padding: 12px; }
  .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .settings-head { align-items: flex-start; }
  .codex-execution-head, .codex-shard-head { align-items: flex-start; flex-direction: column; }
  .codex-channel-grid, .codex-shard-grid { grid-template-columns: minmax(0, 1fr); }
  .codex-set-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .codex-set-row > span, .codex-toggle > span { width: auto; padding-top: 0; }
  .codex-toggle { grid-template-columns: auto minmax(0, 1fr); align-items: center; }
  .codex-toggle > span { grid-column: 1 / -1; }
  .codex-shard-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .route-table { display: block; overflow-x: auto; }
  .workflow-steps { grid-template-columns: repeat(2, 1fr); }
  .profile-strip strong { margin-left: 0; }
  .hero-actions { flex-wrap: wrap; }
  #sidepanel { width: min(360px, 92vw); }
}

/* ---- V3.2 全局工作台导航 ---- */
#topbar { min-height: 58px; height: auto; gap: 18px; }
.topbar-main { display: flex; align-items: center; gap: 28px; min-width: 0; }
.main-nav { display: flex; align-items: center; gap: 4px; align-self: stretch; }
.main-nav a {
  position: relative; display: inline-flex; align-items: center; min-height: 57px;
  padding: 0 13px; color: var(--ink-3); font-size: 13px; font-weight: 600;
}
.main-nav a:hover { color: var(--ink); text-decoration: none; }
.main-nav a.active { color: var(--ink); }
.main-nav a.active::after {
  content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px;
  height: 2px; border-radius: 2px 2px 0 0; background: var(--accent);
}
.standard-live {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px;
  border: 1px solid rgba(12, 163, 12, .3); border-radius: 999px;
  background: rgba(12, 163, 12, .08); color: #8fdd8f;
}
.standard-live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }

button:focus-visible, a:focus-visible, input:focus-visible,
textarea:focus-visible, select:focus-visible {
  outline: 2px solid #8fc2ff; outline-offset: 2px;
}

/* ---- 制作标准中心 ---- */
.standards-page {
  flex: 1; min-height: 0; overflow-y: auto; padding: 26px 28px 92px;
  background:
    radial-gradient(circle at 86% -5%, rgba(57, 135, 229, .15), transparent 34%),
    radial-gradient(circle at 12% 18%, rgba(141, 83, 255, .06), transparent 30%),
    var(--page);
}
.standards-hero {
  max-width: 1540px; margin: 0 auto 18px; display: flex;
  align-items: flex-end; justify-content: space-between; gap: 20px;
}
.eyebrow { color: #81b9fb; font-size: 10px; font-weight: 800; letter-spacing: .18em; margin-bottom: 5px; }
.standards-hero h1 { font-size: clamp(25px, 3vw, 38px); line-height: 1.12; letter-spacing: -.02em; }
.standards-hero p { color: var(--ink-2); margin-top: 7px; max-width: 680px; }
.standard-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.standard-actions button { min-height: 40px; }

.standard-identity {
  max-width: 1540px; margin: 0 auto 16px; display: grid;
  grid-template-columns: minmax(320px, 1.4fr) minmax(230px, 1fr) minmax(230px, 1fr);
  border: 1px solid rgba(57, 135, 229, .24); border-radius: 12px;
  background: linear-gradient(110deg, rgba(57, 135, 229, .13), rgba(26, 26, 25, .86) 52%);
  overflow: hidden;
}
.standard-identity > div {
  min-height: 82px; padding: 15px 18px; border-right: 1px solid var(--hairline);
  display: grid; align-content: center;
}
.standard-identity > div:last-child { border-right: 0; }
.identity-main { grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.live-pulse {
  width: 11px; height: 11px; border-radius: 50%; background: var(--good);
  box-shadow: 0 0 0 6px rgba(12, 163, 12, .12);
}
.standard-identity span, .standard-identity small { display: block; color: var(--ink-3); font-size: 11px; }
.standard-identity b { display: block; font-size: 14px; margin: 2px 0; }

.standards-layout {
  max-width: 1540px; margin: 0 auto; display: grid;
  grid-template-columns: 205px minmax(520px, 1fr) 310px; gap: 14px; align-items: start;
}
.standard-nav, .standard-editor, .impact-panel {
  border: 1px solid var(--hairline); border-radius: 12px; background: rgba(26, 26, 25, .94);
}
.standard-nav { position: sticky; top: 0; padding: 8px; display: grid; gap: 2px; }
.standard-nav a {
  display: grid; grid-template-columns: 31px 1fr; align-items: center;
  min-height: 42px; padding: 6px 9px; border-radius: 8px; color: var(--ink-2);
}
.standard-nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.standard-nav a.active { background: var(--accent-soft); color: #d9ebff; }
.standard-nav em { color: var(--ink-3); font-size: 10px; font-style: normal; font-variant-numeric: tabular-nums; }
.standard-nav a.active em { color: #81b9fb; }

.standard-editor { min-width: 0; overflow: hidden; }
.section-heading {
  padding: 20px 22px 17px; border-bottom: 1px solid var(--hairline);
  background: linear-gradient(100deg, rgba(57, 135, 229, .08), transparent 48%);
}
.section-heading > div { display: flex; align-items: center; gap: 9px; }
.section-heading > div > span {
  display: inline-flex; align-items: center; justify-content: center; width: 29px; height: 29px;
  border-radius: 8px; background: var(--accent-soft); color: #a9d0ff; font-size: 11px; font-weight: 800;
}
.section-heading h2 { font-size: 18px; }
.section-heading p { margin-top: 6px; color: var(--ink-3); font-size: 12.5px; }
.standard-fields { padding: 4px 20px 16px; }
.skill-manifest {
  margin: 16px 20px 2px; padding: 14px 16px; border: 1px solid rgba(141, 83, 255, .24);
  border-radius: 10px; background: linear-gradient(110deg, rgba(141, 83, 255, .10), rgba(57, 135, 229, .05));
}
.skill-manifest > div { display: flex; align-items: center; gap: 10px; }
.skill-manifest > div span { color: #bca8ff; font-size: 9.5px; font-weight: 800; letter-spacing: .12em; }
.skill-manifest dl { display: flex; flex-wrap: wrap; gap: 16px; margin: 8px 0 5px; }
.skill-manifest dl div { display: flex; gap: 6px; font-size: 10.5px; }
.skill-manifest dt { color: var(--ink-3); }
.skill-manifest dd { color: var(--ink-2); }
.skill-manifest p { color: var(--ink-2); font-size: 11.5px; }
.standard-field {
  display: grid; grid-template-columns: minmax(240px, 1fr) minmax(190px, .7fr);
  align-items: center; gap: 20px; padding: 17px 2px; border-bottom: 1px solid var(--grid);
}
.standard-field:last-child { border-bottom: 0; }
.field-copy label { font-weight: 650; font-size: 13.5px; }
.field-copy p { color: var(--ink-3); font-size: 11.5px; margin-top: 4px; max-width: 570px; }
.rule-badge {
  display: inline-flex; margin-left: 8px; padding: 1px 7px; border-radius: 999px;
  font-size: 9.5px; vertical-align: 1px; font-weight: 650;
}
.rule-badge.hard { color: #ffd390; background: rgba(250, 178, 25, .11); border: 1px solid rgba(250, 178, 25, .25); }
.rule-badge.adjustable { color: #9fcaff; background: rgba(57, 135, 229, .1); border: 1px solid rgba(57, 135, 229, .22); }
.rule-badge.live { color: #8fdd8f; background: rgba(12, 163, 12, .1); border: 1px solid rgba(12, 163, 12, .25); }
.field-control input[type="text"], .field-control input[type="number"],
.field-control textarea { width: 100%; background: var(--surface-2); }
.field-control textarea {
  color: var(--ink); border: 1px solid var(--hairline); border-radius: 8px;
  padding: 9px 11px; resize: vertical; font: inherit; font-size: 12px; line-height: 1.55;
}
.standard-field.locked .field-control { opacity: .68; }
.unit-control { display: flex; align-items: center; gap: 8px; }
.unit-control input { flex: 1; min-width: 0; }
.unit-control small, .range-control small { color: var(--ink-3); white-space: nowrap; }
.range-control { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 8px; align-items: center; }
.range-control input { min-width: 0; }
.range-control span { color: var(--ink-3); }

.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch > span {
  position: relative; width: 38px; height: 22px; border-radius: 999px;
  background: var(--surface-3); border: 1px solid var(--hairline); transition: background .16s;
}
.switch > span::after {
  content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px;
  border-radius: 50%; background: #aaa; transition: transform .16s, background .16s;
}
.switch input:checked + span { background: rgba(57, 135, 229, .45); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); background: #fff; }
.switch input:focus-visible + span { outline: 2px solid #8fc2ff; outline-offset: 2px; }
.switch input:disabled + span { cursor: not-allowed; opacity: .75; }
.switch em { color: var(--ink-2); font-size: 11px; font-style: normal; min-width: 26px; }

.impact-panel { position: sticky; top: 0; padding: 17px; }
.impact-panel > h2 { font-size: 13px; }
.impact-panel > p { color: var(--ink-3); font-size: 11.5px; margin: 5px 0 13px; }
.impact-card {
  border-radius: 9px; border: 1px solid rgba(12, 163, 12, .22);
